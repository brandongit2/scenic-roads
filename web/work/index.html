<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- (Its files are beside it, relative: a proxy may serve it under a path, tools/caddy's /build.) -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)">
<!-- An app to install: home screen, full screen (manifest, sw.js: docs/workers.md §7). -->
<link rel="manifest" href="manifest.webmanifest" id="manifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="dash.css">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scenic">
<!-- (The status bar takes the theme colour above, light or dark with the device.) -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Scenic build</title>
<style>
  /* The device's light or dark appearance: the dark palette, the light one where it's light. */
  /* Three text sizes, small, base and large (the owner, 21 Oct 04:03); the overview's figure and a
     phone's 16 px fields (no zoom on focus) the only others. */
  :root { --fs-s: 11px; --fs-b: 13px; --fs-l: 15px; }
  :root {
    --bg: #0e1013; --panel: #161a1f; --line: #262c33; --text: #d7dce2; --dim: #8a939c; --ok: #6cc28a; --warn: #e0b45a; --bad: #e0716a; --accent: #7aa7e0;
    --ok-line: #2a5038; --warn-line: #5a4a26; --bad-line: #5a2d2a; --info-line: #2c4566; --primary-bg: #1d2a3a; --primary-fg: #cfe0f5;
    --spark: #2c4566; --nas-r: #3987e5; --nas-w: #d95926; --net-d: #199e70; --net-u: #d55181; --mark: #e6e6e6; --dimbar: #3f5f86; --tip: #20262d; --tip-glass: color-mix(in srgb, #20262d 82%, transparent); --shadow: #0008; --rule: #3a434d; --row-line: #1d2228; --grid: #1c2127; --new-bg: #1d2a3a; --paused: #5a4a2655; --arrow: #ff4a3d;
    /* The build's stages (crate::agent::steps::STAGES), a hue each, told apart in the schedule. */
    --st-pass: #8fa2b5; --st-sites: #c47fb5; --st-terrain: #d98a3d; --st-slope: #d9c35a; --st-trees: #5fae6b; --st-roads: #5b8fd8; --st-depth: #3b6bb8; --st-fine: #a3c24a;
    --st-tiles: #4fb3c6; --st-finish: #7fb3a8; --st-trains: #a9a0d6; --st-landmarks: #9b7be0; --st-buildings: #a39a8c; --st-publish: #d9667a; --st-upkeep: #7b8590;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6f8; --panel: #ffffff; --line: #d8dee5; --text: #1c232b; --dim: #5d6873; --ok: #2c8a51; --warn: #9a6a12; --bad: #c0433a; --accent: #2d6bb4;
      --ok-line: #b5dbc2; --warn-line: #e6d2a4; --bad-line: #eebfba; --info-line: #b8cee9; --primary-bg: #e2ecf8; --primary-fg: #1d4e89;
      --spark: #b8cee9; --nas-r: #2a78d6; --nas-w: #eb6834; --net-d: #1baf7a; --net-u: #e87ba4; --mark: #6a7480; --dimbar: #9db6d5; --tip: #ffffff; --tip-glass: color-mix(in srgb, #ffffff 84%, transparent); --shadow: #0003; --rule: #c8d0d9; --row-line: #e6e9ee; --grid: #e9edf1; --new-bg: #e2ecf8; --paused: #e6d2a488; --arrow: #d81e12;
      --st-pass: #6f8499; --st-sites: #a85a97; --st-terrain: #c9731f; --st-slope: #b29a1e; --st-trees: #3f8f4c; --st-roads: #3c72c0; --st-depth: #1f4a8a; --st-fine: #6b8a1a;
      --st-tiles: #2a95a9; --st-finish: #4f8f82; --st-trains: #7f74bf; --st-landmarks: #7a55cc; --st-buildings: #857b6c; --st-publish: #c2445c; --st-upkeep: #6a7480;
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: var(--fs-b)/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  /* Two panels side by side (#685): the world map left, the tabs right, a bar between to drag
     (1:1 at first); each scrolls on its own and the page doesn't. Under 720 px one under the
     other, the map first, the page scrolling. */
  #split { display: flex; min-height: 0; }
  #mappane { flex: 0 0 var(--split, 50%); min-width: 0; overflow: auto; padding: 10px 6px 10px 16px; overscroll-behavior: contain; }
  #tabpane { flex: 1 1 0; min-width: 0; overflow: auto; container: tabs / inline-size; overscroll-behavior: contain; }
  #splitbar { flex: none; width: 9px; cursor: col-resize; position: relative; touch-action: none; outline: none; }
  #splitbar::after { content: ""; position: absolute; top: 0; bottom: 0; left: 4px; width: 1px; background: var(--line); }
  #splitbar::before { content: ""; position: absolute; top: calc(50% - 18px); height: 36px; left: 2px; width: 5px; border-radius: 3px; background: var(--dim); z-index: 1; }
  #splitbar:hover::after, #splitbar.on::after, #splitbar:focus-visible::after, #splitbar:hover::before, #splitbar.on::before, #splitbar:focus-visible::before { background: var(--accent); }
  @media (min-width: 720px) {
    body { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    #split { flex: 1 1 auto; }
    body > footer { position: static; flex: none; }
    #tabpane nav { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 0 16px 0 10px; }
  }
  @media (max-width: 719px) {
    #split { display: block; }
    #mappane { overflow: visible; padding: 10px 16px 0; }
    #tabpane { overflow: visible; }
    #splitbar { display: none; }
    #tabpane nav { padding: 0 16px; border-top: 1px solid var(--line); margin-top: 10px; }
  }
  main { padding: 10px 16px 14px 10px; }
  @media (max-width: 719px) { main { padding: 10px 16px 56px; } }
  /* The header, kept at the top: the title, the build's status and controls, the tabs. */
  body > header { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  body > header > div { padding: 8px 16px; }
  .top { display: flex; align-items: center; gap: 4px 12px; flex-wrap: wrap; }
  h1 { font-size: var(--fs-l); font-weight: 600; margin: 0; }
  #state { color: var(--dim); font-size: var(--fs-s); }
  #status { flex: 1 1 auto; min-width: 0; }
  /* (A phone: Install beside the title, not a row of its own under the wrapped status.) */
  @media (max-width: 719px) { .top h1, #state { order: -2; } #install { order: -1; margin-left: auto; } #status { flex-basis: 100%; } }
  nav { display: flex; gap: 2px; padding-top: 4px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
  nav::-webkit-scrollbar { display: none; }
  nav a { color: var(--dim); text-decoration: none; padding: 5px 10px 6px; border-bottom: 2px solid transparent; white-space: nowrap; font-size: var(--fs-b); }
  nav a:hover { color: var(--text); }
  nav a.on { color: var(--text); border-bottom-color: var(--accent); }
  .panel[hidden] { display: none; }
  /* The footer, fixed at the bottom: the charts' range, and whether the page is live. */
  body > footer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-top: 1px solid var(--line); font-size: var(--fs-s); color: var(--dim); }
  body > footer > div { padding: 6px 16px calc(6px + env(safe-area-inset-bottom)); display: flex; gap: 12px; align-items: center; justify-content: space-between; }
  #range { margin: 0 0 0 4px; width: auto; padding: 1px 4px; font-size: var(--fs-s); background: var(--panel); }
  #live { display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  #live i { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
  #live.on i { background: var(--ok); animation: blink 2s ease-in-out infinite; }
  #live.stale i { background: var(--warn); }
  #live.on b { color: var(--ok); } #live.stale b { color: var(--warn); }
  #live b { font-weight: 600; color: var(--text); }
  @keyframes blink { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { #live.on i { animation: none; } }
  .note { color: var(--warn); margin: 0 0 12px; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 4px 10px; font: inherit; }
  input { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 4px 8px; font: inherit; width: 100%; margin: 6px 0; }
  .hint { color: var(--dim); margin: 0 0 12px; }
  h2 { font-size: var(--fs-s); font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; margin: 18px 0 6px; display: flex; justify-content: space-between; align-items: baseline; }
  h2 span { text-transform: none; letter-spacing: 0; font-weight: 400; }
</style>
</head>
<body>
<header><div>
  <!-- The title, the build's status and its pause controls (dash.js), Install. -->
  <div class="top"><h1 id="title">Scenic build</h1><span id="state">starting…</span><div id="status"></div><button id="install" hidden>Install</button></div>
</div></header>
<div id="split">
<!-- Left, the world map (dash.js); right, the tabs; the bar between drags. -->
<aside id="mappane" aria-label="World map"></aside>
<div id="splitbar" role="separator" aria-orientation="vertical" aria-valuemin="25" aria-valuemax="80" aria-label="The map's share of the width" tabindex="0" title="Drag to share the width · double-click to reset"></div>
<section id="tabpane">
<nav id="tabs">
  <a href="#overview">Overview</a><a href="#jobs">Jobs</a><a href="#machines">Machines</a><a href="#nas">NAS</a><a href="#regions">Regions</a><a href="#inputs">Inputs</a><a href="#activity">Activity</a><a href="#details">Details</a>
</nav>
<main>
  <p class="hint" id="hint" hidden></p>
  <!-- A panel a tab (dash.js fills them). -->
  <div class="panel" data-tab="overview"></div>
  <div class="panel" data-tab="jobs" hidden></div>
  <div class="panel" data-tab="machines" hidden></div>
  <div class="panel" data-tab="regions" hidden></div>
  <div class="panel" data-tab="nas" hidden></div>
  <div class="panel" data-tab="inputs" hidden></div>
  <div class="panel" data-tab="activity" hidden></div>
  <div class="panel" data-tab="details" hidden></div>
</main>
</section>
</div>
<footer><div>
  <label>Charts show the last<select id="range"></select></label>
  <span id="live" title="Green and blinking: the build's state is asked for every 10 s and answered"><i></i><b>Live</b><span id="live-at"></span></span>
</div></footer>
<script type="module">
import { dashboard } from "./dash.js";
// The build's page (docs/workers.md §7): the whole build at a glance for anyone it answers, and the
// owner's controls. It reads and asks; it never runs the build's work (pages stopped helping,
// #875: the Macs' agents do it all).
//
// `?view` (the menu bar's panel, tools/status): a viewer only; the page as an app (its service
// worker) isn't installed either.
const $ = (id) => document.getElementById(id);
const viewer = new URLSearchParams(location.search).has("view");
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
// (What an older page kept here to help with the build: gone with it.)
try {
  for (const k of Object.keys(localStorage)) if (k.startsWith("running:") || ["helping", "ceiling", "lowered", "near", "startV", "running", "id", "peers"].includes(k)) localStorage.removeItem(k);
} catch {}

// Where this page's member answers: the path before /work/ ("" straight, "/build" through
// tools/caddy's proxy), so its requests go there.
const ROOT = location.pathname.slice(0, location.pathname.lastIndexOf("/work/"));
const label = (() => {
  const ua = navigator.userAgent;
  const browser = /Edg\//.test(ua) ? "Edge" : /Chrome\//.test(ua) ? "Chrome" : /Firefox\//.test(ua) ? "Firefox" : /Safari\//.test(ua) ? "Safari" : "browser";
  const os = /iPad|Macintosh.*Mobile/.test(ua) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(ua)) ? "iPad" : /iPhone/.test(ua) ? "iPhone" : /Android/.test(ua) ? "Android" : /Mac OS X/.test(ua) ? "Mac" : /Windows/.test(ua) ? "Windows" : "Linux";
  return `${browser} on ${os}`; // (A name to show, nothing more.)
})();

// A POST of JSON to this page's member (at ROOT).
const READING = new Set(["/work/swarm", "/work/history", "/work/catalogs"]);
async function call(path, body) {
  const r = await fetch(ROOT + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (r.status === 204) return [204, null];
  const text = await r.text();
  // (A 503 from the build at a glance is an answer: this Mac hasn't read the build's state yet,
  // and the dashboard waits for it quietly; anything else not ok is an error.)
  if (!r.ok && r.status !== 410 && !(r.status === 503 && READING.has(path))) throw new Error(`${path}: ${r.status} ${text.slice(0, 200)}`);
  return [r.status, text ? JSON.parse(text) : null];
}

// The page as an app (sw.js, manifest.webmanifest): kept for when its Mac doesn't answer. A new
// version taking over (a newly published app): reloaded into it. (A first install takes over too:
// that's no reason to reload.)
if (!viewer && "serviceWorker" in navigator && window.isSecureContext) {
  let had = !!navigator.serviceWorker.controller;
  // (Asked about whenever the page comes back to the front, and every half hour: an installed app
  // stays open for days.)
  navigator.serviceWorker.register("sw.js").then((reg) => {
    const check = () => reg.update().catch(() => {});
    document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && check());
    setInterval(check, 30 * 60000);
  }, (e) => console.error(`couldn't install the page as an app: ${e.message}`));
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!had) { had = true; return; }
    location.reload();
  });
}
// Installing it: the browser's own prompt where it offers one, else (Safari on an iPhone or iPad)
// how to.
let installer = null;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installer = e; $("install").hidden = false; });
$("install").onclick = async () => { if (!installer) return; installer.prompt(); await installer.userChoice; installer = null; $("install").hidden = true; };
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
// (An iPad says it's a Mac: one with a touch screen.)
const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
if (!standalone && window.isSecureContext && ios) {
  $("hint").hidden = false;
  $("hint").textContent = "To keep it on your home screen as an app: Share, then Add to Home Screen.";
}

// ---- Tabs, by the address's #hash (kept in it: a link or a reload opens the same tab) -------------
const panels = Object.fromEntries([...document.querySelectorAll(".panel[data-tab]")].map((el) => [el.dataset.tab, el]));
function showTab() {
  // (#dropboxes: the Inputs tab's old address, task #502, so old links still open it.)
  if (location.hash === "#dropboxes") history.replaceState(null, "", "#inputs");
  const want = location.hash.slice(1);
  const name = panels[want] ? want : "overview";
  for (const [k, el] of Object.entries(panels)) el.hidden = k !== name;
  for (const a of $("tabs").children) a.classList.toggle("on", a.getAttribute("href") === `#${name}`);
}
window.addEventListener("hashchange", () => { showTab(); $("tabpane").scrollTop = 0; });
showTab();

// ---- The split (#685): the map's share of the width, dragged, stepped by the arrow keys or reset by
// a double click (1:1); this browser's own, kept. (Under 720 px the panels stack: no bar.)
const SPLIT = [0.25, 0.8], SPLIT0 = 1 / 2;
function setSplit(f, keep) {
  const v = Math.max(SPLIT[0], Math.min(SPLIT[1], f));
  $("split").style.setProperty("--split", `${(v * 100).toFixed(2)}%`);
  $("splitbar").setAttribute("aria-valuenow", String(Math.round(v * 100)));
  if (keep) store.set("split", v);
  return v;
}
{
  const bar = $("splitbar");
  let split = setSplit(Number(store.get("split", SPLIT0)) || SPLIT0, false), drag = false;
  bar.addEventListener("pointerdown", (e) => { drag = true; bar.setPointerCapture(e.pointerId); bar.classList.add("on"); e.preventDefault(); });
  bar.addEventListener("pointermove", (e) => { if (!drag) return; const r = $("split").getBoundingClientRect(); split = setSplit((e.clientX - r.left) / r.width, false); });
  const end = () => { if (!drag) return; drag = false; bar.classList.remove("on"); split = setSplit(split, true); };
  bar.addEventListener("pointerup", end);
  bar.addEventListener("pointercancel", end);
  bar.addEventListener("dblclick", () => { split = setSplit(SPLIT0, true); });
  bar.addEventListener("keydown", (e) => { const d = { ArrowLeft: -0.02, ArrowRight: 0.02 }[e.key]; if (d) { e.preventDefault(); split = setSplit(split + d, true); } });
}

// ---- The footer: the charts' range (this browser's own, kept), and the Live dot ---------------------
// (The range is the Machines tab's live charts', from each Mac's /work/live: live.js, docs/pipeline.md §5.)
const RANGES = [[60, "1 min"], [300, "5 min"], [600, "10 min"], [1800, "30 min"], [3600, "1 h"], [7200, "2 h"], [21600, "6 h"], [86400, "24 h"], [259200, "72 h"], [604800, "7 days"]];
{
  const kept = store.get("range", 3600);
  $("range").replaceChildren(...RANGES.map(([v, t]) => { const o = document.createElement("option"); o.value = String(v); o.textContent = t; o.selected = v === kept; return o; }));
  $("range").onchange = (e) => store.set("range", Number(e.target.value));
  // (Another tab's pick, which this one's charts follow at their next ask: the menu says it too.)
  addEventListener("storage", (e) => { if (e.key === "range") $("range").value = String(store.get("range", 3600)); });
}
// Live while the build's state answered in the last 30 s (three polls); else stale, since when.
let answeredAt = 0;
function liveDot() {
  const on = answeredAt && Date.now() - answeredAt < 30000;
  $("live").className = answeredAt ? (on ? "on" : "stale") : "";
  $("live").querySelector("b").textContent = on || !answeredAt ? "Live" : "Stale";
  $("live-at").textContent = answeredAt ? `updated ${new Date(answeredAt).toLocaleTimeString([], { hour12: false })}` : "waiting for the build";
}
setInterval(liveDot, 5000);
liveDot();

// ---- The whole build at a glance (dash.js) -------------------------------------------------------
dashboard({
  head: $("status"), mapPane: $("mappane"), tabsEl: $("tabpane"), panels, call, label, store,
  onAnswer: () => { answeredAt = Date.now(); liveDot(); },
  // (The header says how the build goes.)
  onState: (st) => { $("state").textContent = st; },
  onError: (m) => console.error(m),
});
</script>
</body>
</html>
