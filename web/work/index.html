<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- (The same page serves /work/ and /work/watch/: its files are /work/'s.) -->
<base href="/work/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0e1013">
<!-- An app to install: home screen, full screen (manifest, sw.js: docs/workers.md). -->
<link rel="manifest" href="manifest.webmanifest" id="manifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scenic">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Scenic worker</title>
<style>
  :root { --bg: #0e1013; --panel: #161a1f; --line: #262c33; --text: #d7dce2; --dim: #8a939c; --ok: #6cc28a; --warn: #e0b45a; --bad: #e0716a; --accent: #7aa7e0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0; }
  #state { color: var(--dim); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  .k { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .v { font-size: 15px; margin-top: 2px; }
  .slots { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .slot { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  .dot.run { background: var(--accent); } .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
  .bar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s; }
  #log { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; max-height: 40vh; overflow: auto; font: 11.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--dim); white-space: pre-wrap; }
  #log b { color: var(--text); font-weight: 500; } #log .bad { color: var(--bad); }
  .note { color: var(--warn); margin: 0 0 12px; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 4px 10px; font: inherit; }
  input { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 4px 8px; font: inherit; width: 100%; margin: 6px 0; }
  .hint { color: var(--dim); margin: 0 0 12px; }
  h2 { font-size: 11px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; margin: 18px 0 6px; display: flex; justify-content: space-between; align-items: baseline; }
  h2 span { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .overall { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .big { font-size: 30px; font-weight: 600; letter-spacing: -.02em; }
  .big small { font-size: 13px; color: var(--dim); font-weight: 400; }
  .segs { display: flex; gap: 2px; margin-top: 6px; height: 10px; }
  .segs > i { flex: 1; border-radius: 2px; background: var(--line); position: relative; overflow: hidden; }
  .segs > i > b { position: absolute; inset: 0 auto 0 0; background: var(--accent); }
  .segs > i.done { background: var(--ok); }
  .rows { display: flex; flex-direction: column; gap: 6px; }
  .row { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; }
  .row .top { display: flex; gap: 8px; align-items: baseline; }
  .row .top .name { font-weight: 600; }
  .row .top .tag { color: var(--dim); font-size: 11px; }
  .row .top .right { margin-left: auto; color: var(--dim); font-size: 11px; white-space: nowrap; }
  .row .what { margin-top: 2px; }
  .row .sub { color: var(--dim); font-size: 11.5px; margin-top: 2px; }
  .row .bar { height: 5px; }
  .chip { display: inline-block; padding: 0 6px; border-radius: 9px; font-size: 10.5px; border: 1px solid var(--line); color: var(--dim); }
  .chip.run { color: var(--accent); border-color: #2c4566; } .chip.ok { color: var(--ok); border-color: #2a5038; } .chip.warn { color: var(--warn); border-color: #5a4a26; } .chip.bad { color: var(--bad); border-color: #5a2d2a; }
  .hbars { display: grid; grid-template-columns: max-content 1fr max-content; gap: 5px 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  .hbars .hb { height: 8px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .hbars .hb > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .hbars .n { color: var(--dim); font-size: 11.5px; text-align: right; white-space: nowrap; }
  .steps { display: grid; grid-template-columns: 16px 1fr max-content; gap: 3px 8px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  .steps .mark { color: var(--dim); text-align: center; } .steps .mark.ok { color: var(--ok); } .steps .mark.run { color: var(--accent); }
  .steps .n { color: var(--dim); font-size: 11.5px; white-space: nowrap; }
  .steps .note { grid-column: 2 / 4; color: var(--dim); font-size: 11px; margin: -2px 0 2px; }
  .steps .bar { grid-column: 2 / 4; margin: 0 0 3px; }
  .regions { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 5px; }
  .reg { background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 4px 7px; font-size: 11.5px; }
  .reg .t { display: flex; justify-content: space-between; gap: 6px; } .reg .t span:last-child { color: var(--dim); }
  .reg.done { border-color: #2a5038; } .reg.done .bar > i { background: var(--ok); }
  .reg .bar { height: 3px; }
  .recent { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 12px; }
  .recent > div { display: grid; grid-template-columns: 14px 1fr max-content; gap: 8px; padding: 2px 0; }
  .recent .ok { color: var(--ok); } .recent .bad { color: var(--bad); } .recent .n { color: var(--dim); white-space: nowrap; }
  .banner { background: #2a2416; border: 1px solid #5a4a26; color: var(--warn); border-radius: 6px; padding: 7px 10px; margin-bottom: 8px; display: flex; gap: 10px; align-items: center; }
  .banner span { flex: 1; }
  .waits { color: var(--dim); font-size: 11.5px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
  .waits div + div { margin-top: 3px; }
  #device[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <header><h1 id="title">Scenic worker</h1><span id="state">starting…</span><span style="flex:1"></span><button id="install" hidden>Install</button><button id="buildpause" hidden>Pause the build</button></header>
  <p class="note" id="note" hidden></p>
  <p class="hint" id="hint" hidden></p>
  <!-- The whole build at a glance, every machine's work (/work/swarm). -->
  <section id="swarm">
    <div class="banner" id="paused" hidden><span id="paused-t"></span><button id="resume">Resume the build</button></div>
    <div class="overall"><div class="big" id="pct">–</div><div><div id="overall-t">Reading the build…</div><div class="segs" id="segs"></div></div></div>
    <div class="grid" id="kpis"></div>
    <h2>Machines <span id="machines-n"></span></h2><div class="rows" id="machines"></div>
    <h2>Work left <span id="work-t"></span></h2><div class="hbars" id="work"></div>
    <h2>Step by step <span id="steps-t"></span></h2><div class="steps" id="steps"></div>
    <div id="waits-box" hidden><h2>Waiting</h2><div class="waits" id="waits"></div></div>
    <h2>Regions <span id="regions-t"></span></h2><div class="regions" id="regions"></div>
    <h2>Finished lately</h2><div class="recent" id="recent"></div>
  </section>
  <section id="device">
  <h2>This device <span><button id="toggle">Pause</button></span></h2>
  <div class="grid">
    <div class="card"><div class="k">Memory to spare</div><div class="v" id="mem">–</div></div>
    <div class="card"><div class="k">Slots</div><div class="v" id="slots-n">–</div></div>
    <div class="card"><div class="k">Done here</div><div class="v" id="done">0</div></div>
    <div class="card"><div class="k">Busy for</div><div class="v" id="busy">0 s</div></div>
  </div>
  <div class="slots" id="slots"></div>
  <div id="log"></div>
  </section>
</main>
<script type="module">
// The web worker page (docs/workers.md §7). This thread hands out work: it asks the coordinator
// for tasks that fit the memory this tab can spare, gives each to a slot (a Web Worker running the
// build's WebAssembly programs), and beats for every lease while its slot works. Nothing here asks
// what device it is: it learns how much memory a tab may use (§6) and takes on what fits.
const $ = (id) => document.getElementById(id);
// /work/watch/: the same page watching only. It shows the build and joins no work: no slots, no
// asks, nothing of this browser's own tasks touched.
const WATCH = /\/watch\/?$/.test(location.pathname);
if (WATCH) {
  document.title = "Scenic build";
  $("title").textContent = "Scenic build";
  $("manifest").href = "watch.webmanifest";
  $("device").hidden = true;
}
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

// The token comes in the address's fragment (never sent to a server), then stays in this browser.
// (A token is 32 hex digits: anything else, an address that lost its fragment, isn't one.)
const tokenIn = (v) => /^[0-9a-f]{32}$/.test(v) ? v : (/[#&]k=([0-9a-f]{32})(?:&|$)/.exec(v) || [])[1] || null;
const hashToken = tokenIn(location.hash);
if (location.hash.includes("k=")) history.replaceState(null, "", location.pathname);
if (hashToken) store.set("token", hashToken);
const token = store.get("token", "");
const id = store.get("id", null) || (() => { const v = Math.random().toString(36).slice(2, 8); store.set("id", v); return v; })();
const label = (() => {
  const ua = navigator.userAgent;
  const browser = /Edg\//.test(ua) ? "Edge" : /Chrome\//.test(ua) ? "Chrome" : /Firefox\//.test(ua) ? "Firefox" : /Safari\//.test(ua) ? "Safari" : "browser";
  const os = /iPad|Macintosh.*Mobile/.test(ua) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(ua)) ? "iPad" : /iPhone/.test(ua) ? "iPhone" : /Android/.test(ua) ? "Android" : /Mac OS X/.test(ua) ? "Mac" : /Windows/.test(ua) ? "Windows" : "Linux";
  return `${browser} on ${os}`; // (A name to show, nothing more.)
})();
const worker = `${label} ${id}`;
const cores = Math.max(1, (navigator.hardwareConcurrency || 2) - 1);

// How much memory this tab may use (MB): learned. It starts modest (or from what the browser says
// it has), rises after tasks that came near it succeed, and falls below any task the tab died in.
// (32-bit WebAssembly can't address more than 4 GB; a browser may allow a program less: the most it
// lets a memory grow to, tried once.)
const CAP = (() => {
  for (let mb = 3800; mb >= 256; mb = Math.floor(mb / 2)) {
    try { new WebAssembly.Memory({ initial: 1, maximum: mb * 16 }); return mb; } catch {}
  }
  return 128;
})();
let ceiling = Math.min(CAP, store.get("ceiling", navigator.deviceMemory ? navigator.deviceMemory * 256 : 1024));
// Each tab's running tasks, noted with the time (renewed every minute while it lives). A note not
// renewed for two minutes is a tab that died: together its tasks took more than this browser lets a
// tab have. (Another tab's live note is left alone.)
const tab = Math.random().toString(36).slice(2, 10);
const notes = store.get("running", null);
const all = notes && !Array.isArray(notes) ? notes : {};
const died = [];
for (const [t, n] of WATCH ? [] : Object.entries(all)) {
  if (Date.now() - (n.at || 0) > 120000) {
    died.push(...(n.tasks || []));
    delete all[t];
  }
}
if (!WATCH) store.set("running", all);
if (died.length) {
  const total = died.reduce((a, t) => a + (t.mem_mb || 0), 0);
  ceiling = Math.max(256, Math.min(ceiling, Math.floor(total * 0.7)));
  store.set("ceiling", ceiling);
  log(`<span class="bad">A page died running ${died.length > 1 ? `${died.length} tasks` : "a task"} of ${total} MB: taking on at most ${ceiling} MB now.</span>`);
}
let nearMisses = store.get("near", 0);

async function call(path, body) {
  const r = await fetch(path, { method: "POST", headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json", "X-Worker": worker }, body: JSON.stringify(body) });
  if (r.status === 204) return [204, null];
  const text = await r.text();
  if (r.status === 401) {
    askToken("The coordinator refused this page's token (the build Mac's made a new one?): paste the page's address again");
    throw new Error("the coordinator refused this page's token");
  }
  if (!r.ok && r.status !== 410) throw new Error(`${path}: ${r.status} ${text.slice(0, 200)}`);
  return [r.status, text ? JSON.parse(text) : null];
}
for (const t of died) call("/work/fail", { worker, lease: t.lease, error: "the page died running it", oom_mb: t.mem_mb }).catch(() => {});

function log(html) {
  const el = $("log");
  const line = document.createElement("div");
  line.innerHTML = `<b>${new Date().toLocaleTimeString([], { hour12: false })}</b> ${html}`;
  el.prepend(line);
  while (el.childNodes.length > 300) el.lastChild.remove();
}
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

// Slots: as many as cores, each a Web Worker running one task at a time.
const slots = [];
let reserved = 0, done = 0, busyMs = 0, paused = false;
// (A running WebAssembly program can't be interrupted: a slot whose task is taken back gets a new
// Web Worker.)
function spawn(s) {
  if (s.w) s.w.terminate();
  s.w = new Worker("worker.js", { type: "module" });
  s.w.onmessage = (e) => onSlot(s, e.data);
  s.w.onerror = (e) => { log(`<span class="bad">slot ${s.i + 1}: ${esc(e.message)}</span>`); finish(s, false, { error: e.message }); };
  s.w.postMessage({ init: { token, worker } });
}
function makeSlot(i) {
  const s = { i, w: null, lease: null, task: null, mem: 0, started: 0, state: "idle", detail: "", frac: 0 };
  spawn(s);
  const row = document.createElement("div");
  row.className = "slot";
  row.innerHTML = `<span class="dot"></span><div><div class="t">idle</div><div class="bar"><i></i></div></div><span class="m"></span>`;
  $("slots").append(row);
  s.row = row;
  slots.push(s);
  return s;
}
for (let i = 0; i < (WATCH ? 0 : cores); i++) makeSlot(i);
$("slots-n").textContent = `${slots.length}`;

function show() {
  $("mem").textContent = `${Math.max(0, ceiling - reserved)} of ${ceiling} MB`;
  $("done").textContent = `${done}`;
  $("busy").textContent = busyMs < 120000 ? `${Math.round(busyMs / 1000)} s` : `${Math.round(busyMs / 60000)} min`;
  for (const s of slots) {
    s.row.querySelector(".dot").className = `dot ${s.state === "run" ? "run" : s.state === "bad" ? "bad" : s.state === "ok" ? "ok" : ""}`;
    s.row.querySelector(".t").textContent = s.detail || "idle";
    s.row.querySelector(".m").textContent = s.mem ? `${s.mem} MB` : "";
    s.row.querySelector(".bar > i").style.width = `${Math.round(s.frac * 100)}%`;
  }
}

// This tab's running tasks, kept (with the time) so a page loaded after this one dies can give them
// back and lower its ceiling.
function remember() {
  const r = slots.filter((s) => s.lease).map((s) => ({ lease: s.lease, mem_mb: s.mem }));
  const notes = store.get("running", null);
  const all = notes && !Array.isArray(notes) ? notes : {};
  if (r.length) all[tab] = { at: Date.now(), tasks: r };
  else delete all[tab];
  store.set("running", all);
}

function onSlot(s, m) {
  if (m.state) { s.detail = m.state; if (m.frac !== undefined) s.frac = m.frac; show(); }
  if (m.done !== undefined) finish(s, m.ok, m);
}

function finish(s, ok, m = {}) {
  if (!s.lease) return;
  const ms = performance.now() - s.started;
  busyMs += ms;
  if (ok) {
    done++;
    // A task that came near the ceiling and succeeded: room to spare, perhaps; after three, more.
    if (m.peak_mb && m.peak_mb > 0.6 * ceiling) {
      nearMisses++;
      if (nearMisses >= 3 && ceiling < CAP) { ceiling = Math.min(CAP, Math.round(ceiling * 1.25)); nearMisses = 0; store.set("ceiling", ceiling); log(`Tasks near ${m.peak_mb} MB succeed: taking on up to ${ceiling} MB.`); }
      store.set("near", nearMisses);
    }
    log(`${esc(s.task.unit || s.task.kind)} done in ${(ms / 1000).toFixed(0)} s (${m.peak_mb || "?"} MB at most)`);
  } else if (m.error) {
    log(`<span class="bad">${esc(s.task?.unit || "task")} failed: ${esc(m.error)}</span>`);
  }
  reserved -= s.mem;
  Object.assign(s, { lease: null, task: null, mem: 0, state: ok ? "ok" : "bad", detail: ok ? "idle" : `failed: ${m.error || ""}`.slice(0, 120), frac: 0 });
  remember();
  show();
  setTimeout(fill, 100);
}

// Asks for work while a slot is idle and memory is free; the coordinator picks what fits. (A new
// version installed: none asked for; reloaded into it once every slot is idle.)
let asking = false, lastNone = -Infinity, update = false;
async function fill() {
  if (update && slots.every((s) => !s.lease)) {
    try { sessionStorage.setItem("paused", paused ? "1" : ""); } catch {}
    location.reload();
    return;
  }
  if (WATCH || asking || paused || !token || update) return;
  const idle = slots.find((s) => !s.lease);
  const free = ceiling - reserved;
  if (!idle || free < 200 || performance.now() - lastNone < 15000) return;
  asking = true;
  try {
    const [code, g] = await call("/work/ask", { worker, kind: "web", label, can: ["tail"], mem_mb: free, cores });
    if (code === 204 || !g) { lastNone = performance.now(); $("state").textContent = "waiting for work"; return; }
    Object.assign(idle, { lease: g.lease, task: g.task, mem: g.mem_mb, started: performance.now(), state: "run", detail: `${g.task.unit}: fetching`, frac: 0 });
    reserved += g.mem_mb;
    remember();
    $("state").textContent = "working";
    idle.w.postMessage({ run: { lease: g.lease, task: g.task, mem_mb: g.mem_mb } });
    show();
  } catch (e) {
    lastNone = performance.now();
    $("state").textContent = `can't reach the coordinator (${e.message})`;
  } finally {
    asking = false;
    setTimeout(fill, 50);
  }
}
setInterval(fill, 5000);

// Heartbeats for every lease, every minute; a lease the coordinator no longer holds is stopped
// (its task went to another worker, or the job took it back).
setInterval(async () => {
  remember();
  for (const s of slots) {
    if (!s.lease) continue;
    try {
      const [, r] = await call("/work/beat", { worker, lease: s.lease, progress: s.detail });
      if (r && r.ok === false && s.lease) {
        log(`${esc(s.task.unit)}: taken back (another worker or the build Mac has it)`);
        spawn(s);
        reserved -= s.mem;
        Object.assign(s, { lease: null, task: null, mem: 0, state: "idle", detail: "", frac: 0 });
        remember();
        show();
      }
    } catch {}
  }
}, 60000);

// Keeping the screen on (where the browser allows it: a secure context).
let lock = null;
async function wake() {
  if (!("wakeLock" in navigator) || document.visibilityState !== "visible") return;
  try { lock = await navigator.wakeLock.request("screen"); } catch {}
}
document.addEventListener("visibilitychange", wake);
wake();
if (!window.isSecureContext) {
  $("note").hidden = false;
  $("note").textContent = "Not a secure context: this browser won't keep the screen on for the page, so set the device to stay awake while it works.";
}
// No token yet (an app installed on an iPhone keeps its own storage, apart from Safari's), or the
// coordinator refused it: its address pasted, from the build Mac's status menu.
function askToken(why) {
  if ($("paste")) return;
  $("note").hidden = false;
  $("note").innerHTML = `${esc(why)}, from the build Mac's status menu (Copy the Worker Page's Address).<input id="paste" placeholder="https://…/work/#k=…" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="use">Use it</button>`;
  $("use").onclick = () => {
    const k = tokenIn($("paste").value.trim());
    if (!k) { $("paste").value = ""; $("paste").placeholder = "not the page's address with its #k=…: copy it again"; return; }
    store.set("token", k);
    location.replace(location.pathname);
  };
}
if (!token) askToken("No token yet: paste this page's full address");

// The page as an app (sw.js, manifest.webmanifest): kept for when the build Mac doesn't answer, its
// programs kept by version. A new version taking over (a newly published app): reloaded into it
// once no task is running. (A first install takes over too: that's no reason to reload.)
if ("serviceWorker" in navigator && window.isSecureContext) {
  let had = !!navigator.serviceWorker.controller;
  // (Asked about whenever the page comes back to the front, and every half hour: an installed app
  // stays open for days.)
  navigator.serviceWorker.register("sw.js").then((reg) => {
    const check = () => reg.update().catch(() => {});
    document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && check());
    setInterval(check, 30 * 60000);
  }, (e) => log(`<span class="bad">couldn't install the page as an app: ${esc(e.message)}</span>`));
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!had) { had = true; return; }
    if (update) return;
    // (Watching only: nothing running to wait for.)
    if (WATCH) { location.reload(); return; }
    update = true;
    log("A new version of the page is ready: reloading once the tasks running finish.");
    fill();
  });
}
// Installing it: the browser's own prompt where it offers one, else (Safari on an iPhone or iPad)
// how to.
let installer = null;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installer = e; $("install").hidden = false; });
$("install").onclick = async () => { if (!installer) return; installer.prompt(); await installer.userChoice; installer = null; $("install").hidden = true; };
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
// (An iPad says it's a Mac: one with a touch screen.)
const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
if (!standalone && window.isSecureContext && ios) {
  $("hint").hidden = false;
  $("hint").textContent = "To keep it on your home screen as an app: Share, then Add to Home Screen.";
}

const setPaused = (v) => { paused = v; $("toggle").textContent = paused ? "Resume" : "Pause"; if (!WATCH) $("state").textContent = paused ? "paused (running tasks finish)" : "working"; if (!paused) fill(); };
$("toggle").onclick = () => setPaused(!paused);
// (Paused before the reload into a new version: still paused.)
try { if (sessionStorage.getItem("paused") === "1") setPaused(true); sessionStorage.removeItem("paused"); } catch {}

// ---- The whole build at a glance (both pages): /work/swarm, every 10 s -------------------------
// The build Mac's heartbeat (its job, the checklist to the end, the regions, its helpers), every
// worker and lease, and what's left of each shared step with about how long it takes.
const dur = (s) => {
  s = Math.max(0, Math.round(s));
  if (s < 90) return `${s} s`;
  const m = Math.round(s / 60);
  if (m < 90) return `${m} min`;
  const h = s / 3600;
  return h < 48 ? `${h < 10 ? h.toFixed(1) : Math.round(h)} h` : `${(h / 24).toFixed(1)} days`;
};
const n = (v) => Number(v).toLocaleString("en-US");
const h = (tag, cls, ...kids) => { const e = document.createElement(tag); if (cls) e.className = cls; for (const k of kids) e.append(k instanceof Node ? k : document.createTextNode(String(k))); return e; };
const bar = (frac, cls = "bar") => { const b = h("div", cls); const i = h("i", ""); i.style.width = `${Math.round(Math.max(0, Math.min(1, frac)) * 100)}%`; b.append(i); return b; };
const STEP = { terrain: "Terrain", slope: "Slope", trees: "Tree cover", unit: "Areas (roads, elevations, scenery)", pois: "Landmark candidates", peaks: "Peaks" };
// How much a machine's work counts towards the swarm's pace, against the build Mac's (a guess: the
// M1 is about half its speed, a page a fraction): for the time left.
const PACE = { mac: 1, helper: 0.5, web: 0.1 };

function jobLine(j, now) {
  if (!j) return null;
  const box = h("div", "");
  const p = j.progress;
  const part = j.parts && j.part != null ? j.parts[j.part] : null;
  box.append(h("div", "what", j.what));
  if (part) box.append(h("div", "sub", `Part ${j.part + 1} of ${j.parts.length}: ${part}`));
  if (p && p.total > 0) {
    box.append(bar(p.done / p.total));
    const eta = p.eta_s != null && !j.paused ? ` · about ${dur(p.eta_s)} left` : "";
    box.append(h("div", "sub", `${Math.floor((p.done / p.total) * 100)}% · ${n(Math.round(p.done))} of ${n(Math.round(p.total))} ${p.unit}${eta} · running ${dur(now - j.started)}`));
  } else {
    box.append(h("div", "sub", `running ${dur(now - j.started)}`));
  }
  if (j.paused) box.append(h("div", "sub", `Frozen: ${j.paused}`));
  else if (j.pausing) box.append(h("div", "sub", "Stopping at its next safe point (what it's on is kept)"));
  return box;
}

function machineRow(name, tag, state, cls, right, body) {
  const r = h("div", "row");
  const top = h("div", "top", h("span", "name", name), h("span", "tag", tag), h("span", `chip ${cls}`, state), h("span", "right", right));
  r.append(top);
  if (body) r.append(body);
  return r;
}

function cond(c) {
  if (!c) return "";
  const power = c.ac ? "on mains" : c.battery != null ? `on battery ${c.battery}%` : "on battery";
  return `${power} · NAS ${c.nas ? (c.home === false ? "through Tailscale" : "reachable") : "not reachable"}`;
}

function render(sw) {
  const now = sw.now, a = sw.agent || {};
  const fresh = (beat) => beat && now - beat < 360;
  // The pause.
  $("paused").hidden = !sw.pause;
  $("buildpause").hidden = !!sw.pause || !token;
  if (sw.pause) $("paused-t").textContent = `The build is paused (from ${sw.pause.by}, ${dur(now - sw.pause.at)} ago): ${sw.pause.mode === "freeze" ? "every job frozen where it was" : "each job stops at its next safe point"}; nothing new starts.`;

  // Overall: the steps to the end, each a segment.
  const steps = a.checklist || [];
  const fin = (st) => st.left != null ? st.left === 0 : st.total != null && st.done >= st.total;
  const finished = steps.filter(fin).length;
  const units = steps.find((st) => (st.steps || []).includes("unit"));
  const pct = units && units.total ? units.done / units.total : 0;
  $("pct").replaceChildren(units && units.total ? `${Math.floor(pct * 100)}%` : "–", h("small", "", units && units.total ? " of the areas" : ""));
  const segs = $("segs");
  segs.replaceChildren(...steps.map((st) => {
    const i = h("i", fin(st) ? "done" : "");
    i.title = `${st.what}: ${st.total != null ? `${st.done} of ${st.total}` : st.left != null ? `${st.left} left` : "to come"}`;
    if (!fin(st) && st.total) { const b = h("b", ""); b.style.width = `${Math.round((st.done / st.total) * 100)}%`; i.append(b); }
    return i;
  }));

  // Work left (the shared steps'), and the time it takes at the swarm's pace.
  const work = sw.work || [];
  const workS = work.reduce((t, w) => t + w.est_s, 0);
  const helpers = (a.helpers || []).filter((x) => fresh(x.beat));
  const pages = (sw.workers || []).filter((w) => w.kind === "web" && w.seen_s < 120);
  const pace = (fresh(a.beat) ? PACE.mac : 0) + helpers.length * PACE.helper + pages.length * PACE.web;
  $("overall-t").textContent = steps.length
    ? `${finished} of ${steps.length} steps done${workS && pace ? ` · about ${dur(workS / pace)} of building left at this pace` : ""}`
    : "No word from the build Mac yet";

  // The numbers that matter most.
  const kpi = (k, v, sub) => h("div", "card", h("div", "k", k), h("div", "v", v), ...(sub ? [h("div", "sub", sub)] : []));
  const step = (id) => steps.find((st) => (st.steps || []).includes(id));
  const frac = (st) => st && st.total != null ? `${n(st.done)} of ${n(st.total)}` : st && st.left != null ? `${st.left} left` : "–";
  const built = a.built || {};
  const regs = Object.entries(built);
  const regsDone = regs.filter(([, b]) => b.total > 0 && b.built >= b.total).length;
  const busy = (a.job && fresh(a.beat) ? 1 : 0) + helpers.filter((x) => x.job).length + pages.filter((w) => !/^asked for|^waiting/.test(w.what)).length;
  $("kpis").replaceChildren(
    kpi("Areas built", frac(units)),
    kpi("Regions done", regs.length ? `${regsDone} of ${regs.length}` : "–"),
    kpi("Terrain", frac(step("terrain"))),
    kpi("Slope · tree cover", `${frac(step("slope"))} · ${frac(step("trees"))}`),
    kpi("Map tiles", frac(step("pack"))),
    kpi("Machines", `${1 + helpers.length + pages.length}`, `${busy} working`),
  );

  // Every machine: what it's doing, how far, how long left.
  const rows = [];
  if (a.host) {
    const st = !fresh(a.beat) ? ["out of touch", "bad"] : a.job?.paused ? ["frozen", "warn"] : a.job?.pausing ? ["stopping", "warn"] : a.job ? ["building", "run"] : sw.pause ? ["paused", "warn"] : ["idle", ""];
    const body = jobLine(a.job, now) || h("div", "sub", (a.waiting || [])[0] ? `${a.waiting[0].what}: ${a.waiting[0].why}` : "Nothing to build now");
    rows.push(machineRow(a.host, "build Mac", st[0], st[1], `${cond(a.conditions)} · seen ${dur(now - a.beat)} ago`, body));
  }
  for (const x of a.helpers || []) {
    const st = !fresh(x.beat) ? ["out of touch", "bad"] : x.job?.paused ? ["frozen", "warn"] : x.job?.pausing ? ["stopping", "warn"] : x.job ? ["building", "run"] : ["idle", ""];
    const body = jobLine(x.job, now) || h("div", "sub", (x.waiting || [])[0] ? (x.waiting[0].why) : "Nothing for it now");
    rows.push(machineRow(x.host, "helper", st[0], st[1], `${cond(x.conditions)} · seen ${dur(now - x.beat)} ago`, body));
  }
  for (const w of sw.workers || []) {
    if (w.kind !== "web" || w.seen_s > 600) continue;
    const st = w.bad ? ["stopped", "bad"] : w.seen_s > 120 ? ["away", ""] : ["joined", "ok"];
    rows.push(machineRow(w.label, "page", st[0], st[1], `${w.mem_mb ? `${n(w.mem_mb)} MB · ` : ""}${w.done} done · seen ${dur(w.seen_s)} ago`, h("div", "sub", w.what)));
  }
  $("machines").replaceChildren(...rows);
  $("machines-n").textContent = rows.length ? `${rows.length}` : "";

  // Work left: each shared step's targets and the time they take, as bars.
  const max = Math.max(1, ...work.map((w) => w.est_s));
  const wb = $("work");
  wb.replaceChildren(...work.flatMap((w) => [
    h("div", "", STEP[w.step] || w.step),
    (() => { const b = h("div", "hb"); const i = h("i", ""); i.style.width = `${Math.max(2, Math.round((w.est_s / max) * 100))}%`; b.append(i); return b; })(),
    h("div", "n", `${n(w.left)} left · about ${dur(w.est_s)}${w.known < w.left ? ` (${w.known} timed before)` : ""}`),
  ]));
  wb.hidden = !work.length;
  $("work-t").textContent = workS ? `about ${dur(workS)} of work${pace > 1 ? `, ${dur(workS / pace)} across the machines` : ""}` : "none offered to helpers now";

  // The checklist, step by step.
  const sl = $("steps");
  sl.replaceChildren();
  for (const st of steps) {
    const done = fin(st), now_ = !done && a.job && (st.steps || []).includes(String(a.job.id).split(" ")[0]);
    sl.append(h("span", `mark ${done ? "ok" : now_ ? "run" : ""}`, done ? "✓" : now_ ? "▸" : "○"), h("span", "", `${st.what}${st.shared ? " ⇄" : ""}`), h("span", "n", st.total != null ? `${n(st.done)} of ${n(st.total)} ${st.unit || ""}` : st.left != null ? (st.left ? `${st.left} left` : "done") : "to come"));
    if (!done && st.total) sl.append(bar(st.done / st.total));
    if (!done && st.note) sl.append(h("span", "note", st.note));
  }
  $("steps-t").textContent = steps.length ? `${finished} of ${steps.length} done · ⇄ helpers can take part` : "";

  // Waiting: what can't run yet, and why.
  const waits = a.waiting || [];
  $("waits-box").hidden = !waits.length;
  $("waits").replaceChildren(...waits.slice(0, 8).map((w) => h("div", "", `${w.what}: ${w.why}`)));

  // The regions: building first, then waiting, then done; each its areas built.
  const names = Object.fromEntries((a.regions || []).map((r) => [r.id, r.name]));
  const rank = (b) => b.built >= b.total ? 2 : b.built > 0 ? 0 : 1;
  regs.sort(([ia, x], [ib, y]) => rank(x) - rank(y) || (x.total - x.built) - (y.total - y.built) || String(names[ia] || ia).localeCompare(names[ib] || ib));
  $("regions").replaceChildren(...regs.map(([id, b]) => {
    const r = h("div", `reg${b.total > 0 && b.built >= b.total ? " done" : ""}`, h("div", "t", h("span", "", names[id] || id), h("span", "", `${b.built}/${b.total}`)));
    r.append(bar(b.total ? b.built / b.total : 0));
    r.title = `${names[id] || id}: ${b.built} of ${b.total} areas built`;
    return r;
  }));
  $("regions-t").textContent = regs.length ? `${regsDone} of ${regs.length} done · areas built of each` : "";

  // Finished lately.
  $("recent").replaceChildren(...(a.recent || []).slice(0, 10).map((d) => h("div", "", h("span", d.ok ? "ok" : "bad", d.ok ? "✓" : "✗"), h("span", "", d.what), h("span", "n", `${dur(d.secs)} · ${dur(now - d.ended)} ago`))));
  if (WATCH) $("state").textContent = !a.host ? "no word from the build Mac" : fresh(a.beat) ? (sw.pause ? "paused" : a.job ? "building" : "idle") : `build Mac out of touch since ${dur(now - a.beat)} ago`;
}

async function swarm() {
  if (!token) return;
  try {
    const [code, sw] = await call("/work/swarm", {});
    if (code === 200 && sw) render(sw);
  } catch (e) {
    $("overall-t").textContent = `Can't reach the build Mac (${e.message}): showing what it last said`;
  }
}
setInterval(swarm, 10000);
document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && swarm());
// Pausing the whole build from here, or letting it go on (docs/plan.md §8, Pausing).
async function askBuild(pause) {
  try {
    await call("/work/pause", { pause });
    swarm();
  } catch (e) {
    log(`<span class="bad">couldn't ask the build to ${pause ? "pause" : "go on"}: ${esc(e.message)}</span>`);
  }
}
$("buildpause").onclick = () => askBuild({ mode: "drain", by: label, at: Math.floor(Date.now() / 1000) });
$("resume").onclick = () => askBuild(null);
swarm();
show();
fill();
</script>
</body>
</html>
