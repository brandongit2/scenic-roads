[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2"
clap = { workspace = true, features = ["help", "usage", "error-context", "suggestions"] }
# The crates its code names, neither pipeline (the plan, the binaries) nor agentcore (the runtime):
# an edit there, or in a family it doesn't read, rebuilds no server, and a build doesn't wait on
# them to compile it (docs/crates.md, step 7a).
buildstore = { path = "../buildstore" }
codecs = { path = "../codecs" }
coordwire = { path = "../coordwire" }
inputs = { path = "../inputs" }
jobrt = { path = "../jobrt" }
terrain = { path = "../terrain" }
det = { path = "../det" }
toml = "0.9"
unicode-normalization = "0.1"
roadcore = { path = "../roadcore" }
store = { path = "../store" }
names = { path = "../names" }
blake3 = "1"
zstd = "0.13"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
memmap2.workspace = true
anyhow.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "sync"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "compression-gzip", "cors"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
bytes = "1"
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
png = "0.18"
# Tiles cut to the downloads away from the NAS (clip.rs): the stored lossless WebPs read and made again.
image-webp = "0.2"
webpenc = { path = "../webpenc" }
base64 = "0.22"
rayon = { workspace = true }
ureq = "=3.4.2"
bytemuck = { workspace = true }

[dev-dependencies]
# The lead's map routes (maplog's tests serve them) and the room setting a test sets: the runtime's.
agentcore = { path = "../agentcore" }
store = { path = "../store", features = ["testkit"] }
tempfile = "3"
