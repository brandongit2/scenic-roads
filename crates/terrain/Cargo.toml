[package]
name = "terrain"
version = "0.1.0"
edition = "2021"
description = "The terrain and slope steps: the terrain's pool, packs and deep tiles, their zoom rule, the slopes, the depth, the polar caps, the pyramids, the roads' terrain, the layers' packs (docs/crates.md, step 6e)"

[dependencies]
det = { path = "../det" }
roadcore = { path = "../roadcore" }
store = { path = "../store" }
codecs = { path = "../codecs" }
jobrt = { path = "../jobrt" }
buildstore = { path = "../buildstore" }
inputs = { path = "../inputs" }
offload = { path = "../offload" }
sha2 = "0.10"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
zstd = "0.13"
anyhow.workspace = true
rayon.workspace = true
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
png = "0.18"
# The depth's tiles (depth::fall): lossless WebP through libwebp, as the terrain's (codecs::terrain_codec).
webpenc = { path = "../webpenc" }
# The depth's tiles read back (depth::fall), as roadcore reads the terrain's.
image-webp = "0.2"
libc = "0.2"
# GEOS for the lakes' outlines (depth::lakes): pipeline's static GEOS 3.13.1 (crates/bld/Cargo.toml says
# why these versions).
geos = { version = "=11.1.1", features = ["static", "v3_12_0"] }

[features]
# Test helpers (terrain_pack's and terrain_task's testkit, terrain_zoom's test world) for other
# crates' tests: pipeline's dev-dependency on terrain turns it on. Helpers only, never behaviour.
testkit = ["buildstore/testkit", "store/testkit"]

[dev-dependencies]
buildstore = { path = "../buildstore", features = ["testkit"] }
codecs = { path = "../codecs", features = ["testkit"] }
jobrt = { path = "../jobrt", features = ["testkit"] }
inputs = { path = "../inputs", features = ["testkit"] }
store = { path = "../store", features = ["testkit"] }
tempfile = "3"
