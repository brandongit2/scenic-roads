[package]
name = "names"
version = "0.1.0"
edition = "2021"
description = "Display names for the map (main and sub per name, from the translations folder) and the vector-tile rewriting that attaches them"

[dependencies]
anyhow.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
