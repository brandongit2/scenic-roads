[package]
name = "coordwire"
version = "0.1.0"
edition = "2021"
description = "The coordinator's client side: the contact, the client's transport, a task's shared side, the map now from the lead, the network a Mac's services share (docs/crates.md, steps 6c and 7a)"

[dependencies]
store = { path = "../store" }
jobrt = { path = "../jobrt" }
buildstore = { path = "../buildstore" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
anyhow.workspace = true
# Pinned: the client's idle transport uses ureq's unversioned::transport API (no semver promise).
ureq = "=3.4.2"
# The services' listener (net::Listener, axum::serve's).
axum = "0.8"
tokio = { version = "1", features = ["net", "time"] }

[features]
# Test coordinators (testkit: answering, mute, dead, serve) for other crates' tests: their
# dev-dependency on coordwire turns it on. Helpers only, never behaviour.
testkit = []

[dev-dependencies]
tempfile = "3"
store = { path = "../store", features = ["testkit"] }
