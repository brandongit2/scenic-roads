[package]
name = "mapview"
version = "0.1.0"
edition = "2021"
description = "The scenic metrics' map-side parts: the far-field view, the roadside buildings, the terrain lookups and the scenic steps' caches (docs/crates.md, step 5b)"

[dependencies]
det = { path = "../det" }
roadcore = { path = "../roadcore" }
store = { path = "../store" }
codecs = { path = "../codecs" }
anyhow.workspace = true
rayon.workspace = true
bytemuck.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
