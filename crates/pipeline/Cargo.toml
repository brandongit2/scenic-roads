[package]
name = "pipeline"
version = "0.1.0"
edition = "2021"

[dependencies]
det = { path = "../det" }
roadcore = { path = "../roadcore" }
store = { path = "../store" }
names = { path = "../names" }
codecs = { path = "../codecs" }
jobrt = { path = "../jobrt" }
buildstore = { path = "../buildstore" }
coordwire = { path = "../coordwire" }
offload = { path = "../offload" }
landmarks = { path = "../landmarks" }
mapview = { path = "../mapview" }
inputs = { path = "../inputs" }
terrain = { path = "../terrain" }
trees = { path = "../trees" }
roads = { path = "../roads" }
bld = { path = "../bld" }
agentcore = { path = "../agentcore" }
serde = { version = "1", features = ["derive"] }
zstd = "0.13"
anyhow.workspace = true
rayon.workspace = true
bytemuck.workspace = true
osmpbf = "0.3"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
png = "0.18"
weezl = "0.2"
libc = "0.2"
clap = { workspace = true, features = ["help", "usage", "error-context", "suggestions"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "io-util", "sync", "time"] }

# (agentcore compiles the plan's modules into its unit tests, and sets `in_agentcore` there:
# agentcore/build.rs.)
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(in_agentcore)"] }

[dev-dependencies]
agentcore = { path = "../agentcore", features = ["testkit"] }
bld = { path = "../bld", features = ["testkit"] }
trees = { path = "../trees", features = ["testkit"] }
landmarks = { path = "../landmarks", features = ["testkit"] }
terrain = { path = "../terrain", features = ["testkit"] }
offload = { path = "../offload", features = ["testkit"] }
inputs = { path = "../inputs", features = ["testkit"] }
buildstore = { path = "../buildstore", features = ["testkit"] }
coordwire = { path = "../coordwire", features = ["testkit"] }
codecs = { path = "../codecs", features = ["testkit"] }
jobrt = { path = "../jobrt", features = ["testkit"] }
store = { path = "../store", features = ["testkit"] }
tempfile = "3"
# (The declarations read by tests/source_names.rs.)
toml = "0.9"
