[package]
name = "pipeline"
version = "0.1.0"
edition = "2021"

[dependencies]
det = { path = "../det" }
roadcore = { path = "../roadcore" }
store = { path = "../store" }
names = { path = "../names" }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
zstd = "0.13"
anyhow.workspace = true
rayon.workspace = true
memmap2.workspace = true
bytemuck.workspace = true
osmpbf = "0.3"
indicatif = "0.18"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
png = "0.18"
crc32fast = "1"
weezl = "0.2"
libc = "0.2"
toml = "0.9"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# (WebAssembly has no sockets, and ring's C doesn't build for it: there the programs read what they
# need from their inputs, docs/workers.md.)
[target.'cfg(not(target_os = "wasi"))'.dependencies]
ureq = "3"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["catch-panic"] }
tower = { version = "0.5", features = ["util"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
socket2 = { version = "0.6", features = ["all"] }
futures-util = { version = "0.3", default-features = false }

[target.'cfg(target_os = "wasi")'.dependencies]
ureq = { version = "3", default-features = false }

[dev-dependencies]
tempfile = "3"
image-webp = "0.2"
