[package]
name = "pipeline"
version = "0.1.0"
edition = "2021"

[dependencies]
det = { path = "../det" }
roadcore = { path = "../roadcore" }
store = { path = "../store" }
names = { path = "../names" }
sha2 = "0.10"
blake3 = "1"
clap.workspace = true
serde = { version = "1", features = ["derive"] }
zstd = "0.13"
anyhow.workspace = true
rayon.workspace = true
memmap2.workspace = true
bytemuck.workspace = true
osmpbf = "0.3"
indicatif = "0.18"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
png = "0.18"
# The terrain's tiles (crate::terrain_codec): lossless WebP through libwebp (not crate::webp, the tree cover's own encoder), natively and in the
# WebAssembly build alike (terrainsub makes terrain tiles).
webpenc = { path = "../webpenc" }
# The depth's tiles read back (crate::depth::fall), as roadcore reads the terrain's.
image-webp = "0.2"
crc32fast = "1"
weezl = "0.2"
libc = "0.2"
toml = "0.9"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# (The regions' set operations, in integer coordinates: docs/inputs.md §6.1.4.)
i_overlay = { version = "=9.0.0", default-features = false }
# (Names compared as the heritage chain does: crate::heritage_layers.)
unicode-normalization = "0.1"

# (WebAssembly has no sockets, and ring's C doesn't build for it: there the programs read what they
# need from their inputs, docs/workers.md.)
[target.'cfg(not(target_os = "wasi"))'.dependencies]
clap = { workspace = true, features = ["help", "usage", "error-context", "suggestions"] }
# Pinned: coord::client's idle transport uses ureq's unversioned::transport API (no semver promise).
ureq = "=3.4.2"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["catch-panic"] }
tower = { version = "0.5", features = ["util"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
socket2 = { version = "0.6", features = ["all"] }
futures-util = { version = "0.3", default-features = false }
# GEOS for the World Heritage Sites' dots (crate::whsshapes, as shapely computed them): 3.13.1,
# built from the workspace's crates/geos-src by CMake and linked statically (no GEOS needed on the
# Macs). geos-src 0.2.4 is the one patched (the root Cargo.toml); geos-sys 2.0.10 and geos 11.1.2 on
# would take 0.2.5.
geos = { version = "=11.1.1", features = ["static", "v3_12_0"] }
geos-sys = "=2.0.9"
geos-src = "=0.2.4"
# zlib's own deflate (1.3, built from source and linked statically), for the leaf-type squares'
# tiles as GDAL wrote them (crate::leaftype: zlib-rs's deflate makes other bytes).
libz-sys = { version = "=1.1.30", features = ["static"] }
# Overture's GeoParquet (crate::bld::overture: the 3D buildings' row groups and footers, the
# roadside buildings' boxes), through arrow's arrays; Overture's files are zstd.
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"] }
arrow-array = "60"
# S3's ETags (an Overture file's MD5, or its multipart upload's MD5 of MD5s: crate::bld::fetch).
md-5 = "0.10"
# (parquet's byte buffers, for a reader of the fetched spans of a file: crate::bld::overture::Spans.)
bytes = "1"

[target.'cfg(target_os = "wasi")'.dependencies]
# Pinned: coord::client's idle transport uses ureq's unversioned::transport API (no semver promise).
ureq = { version = "=3.4.2", default-features = false }

[dev-dependencies]
store = { path = "../store", features = ["testkit"] }
tempfile = "3"
