[package]
name = "pipeline"
version = "0.1.0"
edition = "2021"

[dependencies]
det = { path = "../det" }
roadcore = { path = "../roadcore" }
store = { path = "../store" }
names = { path = "../names" }
pyport = { path = "../pyport" }
codecs = { path = "../codecs" }
jobrt = { path = "../jobrt" }
buildstore = { path = "../buildstore" }
coordwire = { path = "../coordwire" }
offload = { path = "../offload" }
landmarks = { path = "../landmarks" }
mapview = { path = "../mapview" }
inputs = { path = "../inputs" }
terrain = { path = "../terrain" }
trees = { path = "../trees" }
roads = { path = "../roads" }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
zstd = "0.13"
anyhow.workspace = true
rayon.workspace = true
bytemuck.workspace = true
osmpbf = "0.3"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
png = "0.18"
# WebP tiles read back in tests (the fields'), as roadcore reads the terrain's.
image-webp = "0.2"
crc32fast = "1"
weezl = "0.2"
libc = "0.2"
toml = "0.9"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
clap = { workspace = true, features = ["help", "usage", "error-context", "suggestions"] }
# Pinned as coordwire pins it (coordwire::client's idle transport uses ureq's unversioned::transport API).
ureq = "=3.4.2"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["catch-panic", "compression-gzip"] }
tower = { version = "0.5", features = ["util"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
socket2 = { version = "0.6", features = ["all"] }
futures-util = { version = "0.3", default-features = false }
# GEOS for the World Heritage Sites' dots (crate::whsshapes, as shapely computed them): 3.13.1,
# built from the workspace's crates/geos-src by CMake and linked statically (no GEOS needed on the
# Macs). geos-src 0.2.4 is the one patched (the root Cargo.toml); geos-sys 2.0.10 and geos 11.1.2 on
# would take 0.2.5.
geos = { version = "=11.1.1", features = ["static", "v3_12_0"] }
geos-sys = "=2.0.9"
geos-src = "=0.2.4"
# zlib's own deflate (1.3, built from source and linked statically), for gzip as Python writes it
# (crate::bld::fetch's py_gzip: zlib-rs's deflate makes other bytes).
libz-sys = { version = "=1.1.30", features = ["static"] }
# Overture's GeoParquet (crate::bld::overture: the 3D buildings' row groups and footers, the
# roadside buildings' boxes), through arrow's arrays; Overture's files are zstd.
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"] }
arrow-array = "60"
# S3's ETags (an Overture file's MD5, or its multipart upload's MD5 of MD5s: crate::bld::fetch).
md-5 = "0.10"
# (parquet's byte buffers, for a reader of the fetched spans of a file: crate::bld::overture::Spans.)
bytes = "1"

[dev-dependencies]
trees = { path = "../trees", features = ["testkit"] }
landmarks = { path = "../landmarks", features = ["testkit"] }
terrain = { path = "../terrain", features = ["testkit"] }
offload = { path = "../offload", features = ["testkit"] }
inputs = { path = "../inputs", features = ["testkit"] }
buildstore = { path = "../buildstore", features = ["testkit"] }
coordwire = { path = "../coordwire", features = ["testkit"] }
codecs = { path = "../codecs", features = ["testkit"] }
jobrt = { path = "../jobrt", features = ["testkit"] }
store = { path = "../store", features = ["testkit"] }
tempfile = "3"
