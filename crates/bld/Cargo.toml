[package]
name = "bld"
version = "0.1.0"
edition = "2021"
description = "The buildings: the 3D buildings' sources fetched onto the NAS, a z6 tile's normalized file, its tiles and field (a z8 tile at a time, as tasks for other Macs), and the roadside buildings a unit reads (docs/crates.md, step 6e)"

[dependencies]
det = { path = "../det" }
roadcore = { path = "../roadcore" }
store = { path = "../store" }
names = { path = "../names" }
pyport = { path = "../pyport" }
codecs = { path = "../codecs" }
jobrt = { path = "../jobrt" }
buildstore = { path = "../buildstore" }
offload = { path = "../offload" }
landmarks = { path = "../landmarks" }
inputs = { path = "../inputs" }
terrain = { path = "../terrain" }
roads = { path = "../roads" }
serde = { version = "1", features = ["derive"] }
zstd = "0.13"
anyhow.workspace = true
rayon.workspace = true
bytemuck.workspace = true
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
crc32fast = "1"
# Pinned as coordwire pins it (coordwire::client's idle transport uses ureq's unversioned::transport API).
ureq = "=3.4.2"
# GEOS for the files a fetch takes, those near the coverage (bld::fetch's Near): 3.13.1, built from
# the workspace's crates/geos-src by CMake and linked statically (no GEOS needed on the Macs).
# geos-src 0.2.4 is the one patched (the root Cargo.toml); geos-sys 2.0.10 and geos 11.1.2 on would
# take 0.2.5.
geos = { version = "=11.1.1", features = ["static", "v3_12_0"] }
geos-sys = "=2.0.9"
geos-src = "=0.2.4"
# zlib's own deflate (1.3, built from source and linked statically), for gzip as Python writes it
# (bld::fetch's py_gzip: zlib-rs's deflate makes other bytes).
libz-sys = { version = "=1.1.30", features = ["static"] }
# Overture's GeoParquet (bld::overture: the 3D buildings' row groups and footers, the roadside
# buildings' boxes), through arrow's arrays; Overture's files are zstd.
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"] }
arrow-array = "60"
# S3's ETags (an Overture file's MD5, or its multipart upload's MD5 of MD5s: bld::fetch).
md-5 = "0.10"
# (parquet's byte buffers, for a reader of the fetched spans of a file: bld::overture::Spans.)
bytes = "1"
# (testkit's coverage is drawn in a temporary folder.)
tempfile = { version = "3", optional = true }

[features]
# Test helpers (bld::prep's buildings and frames, bld::task's work files, coverage and what an
# Offers holds, buildtiles' TEST_RELEASE) for other crates' tests: pipeline's dev-dependency on bld
# turns it on. Helpers only, never behaviour.
testkit = ["dep:tempfile", "buildstore/testkit"]

[dev-dependencies]
buildstore = { path = "../buildstore", features = ["testkit"] }
codecs = { path = "../codecs", features = ["testkit"] }
jobrt = { path = "../jobrt", features = ["testkit"] }
inputs = { path = "../inputs", features = ["testkit"] }
store = { path = "../store", features = ["testkit"] }
# The fields' tiles read back (bld::field's tests), as roadcore reads the terrain's.
image-webp = "0.2"
tempfile = "3"
