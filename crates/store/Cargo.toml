[package]
name = "store"
version = "0.1.0"
edition = "2021"
description = "NAS storage for the map: content-named files, packs, sectioned files, catalogs, the NAS I/O pool, finding and mounting the share, the per-Mac mirror, PMTiles reading"

[dependencies]
roadcore = { path = "../roadcore" }
anyhow.workspace = true
memmap2.workspace = true
bytemuck.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
blake3 = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = "0.13"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
