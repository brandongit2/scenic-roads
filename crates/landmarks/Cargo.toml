[package]
name = "landmarks"
version = "0.1.0"
edition = "2021"
description = "The names family: Wikidata asks, heritage sites and their details, items and their pageviews, labels, the area details, the World Heritage Sites' shapes, the marks and overlays, the timetables, the descriptions to write (docs/crates.md, steps 5a and 6e)"

[dependencies]
det = { path = "../det" }
roadcore = { path = "../roadcore" }
store = { path = "../store" }
names = { path = "../names" }
pyport = { path = "../pyport" }
jobrt = { path = "../jobrt" }
buildstore = { path = "../buildstore" }
codecs = { path = "../codecs" }
coordwire = { path = "../coordwire" }
inputs = { path = "../inputs" }
terrain = { path = "../terrain" }
roads = { path = "../roads" }
serde = { version = "1", features = ["derive"] }
anyhow.workspace = true
rayon.workspace = true
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
zstd = "0.13"
bytemuck.workspace = true
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
crc32fast = "1"
libc = "0.2"
osmpbf = "0.3"
# (Names compared as the heritage chain does: heritage_layers, heritagewd.)
unicode-normalization = "0.1"
# Pinned as coordwire pins it (coordwire::client's idle transport uses ureq's unversioned::transport API).
ureq = "=3.4.2"
# GEOS for the World Heritage Sites' dots (whsshapes, as shapely computed them): pipeline's static
# GEOS 3.13.1 (crates/pipeline/Cargo.toml says why these versions).
geos = { version = "=11.1.1", features = ["static", "v3_12_0"] }

[dev-dependencies]
jobrt = { path = "../jobrt", features = ["testkit"] }
store = { path = "../store", features = ["testkit"] }
tempfile = "3"
