[package]
name = "landmarks"
version = "0.1.0"
edition = "2021"
description = "The landmarks' Wikidata and heritage steps: Wikidata asks, heritage sites and their details, items and their pageviews, labels, the area details, the World Heritage Sites' shapes (docs/crates.md, step 5a)"

[dependencies]
det = { path = "../det" }
roadcore = { path = "../roadcore" }
store = { path = "../store" }
names = { path = "../names" }
pyport = { path = "../pyport" }
jobrt = { path = "../jobrt" }
buildstore = { path = "../buildstore" }
anyhow.workspace = true
rayon.workspace = true
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
zstd = "0.13"
libc = "0.2"
osmpbf = "0.3"
# (Names compared as the heritage chain does: heritage_layers, heritagewd.)
unicode-normalization = "0.1"
# Pinned as pipeline pins it (coord::client's idle transport uses ureq's unversioned::transport API).
ureq = "=3.4.2"
# GEOS for the World Heritage Sites' dots (whsshapes, as shapely computed them): pipeline's static
# GEOS 3.13.1 (crates/pipeline/Cargo.toml says why these versions).
geos = { version = "=11.1.1", features = ["static", "v3_12_0"] }

[dev-dependencies]
tempfile = "3"
