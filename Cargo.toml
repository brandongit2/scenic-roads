[workspace]
resolver = "2"
members = ["crates/det", "crates/roadcore", "crates/pipeline", "crates/server", "crates/store", "crates/names"]

[workspace.dependencies]
anyhow = "1"
rayon = "1.10"
memmap2 = "0.9"
bytemuck = { version = "1.19", features = ["derive", "extern_crate_alloc"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false
