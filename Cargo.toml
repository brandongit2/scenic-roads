[workspace]
resolver = "2"
members = ["crates/det", "crates/roadcore", "crates/pipeline", "crates/server", "crates/store", "crates/names", "crates/jxl"]

[workspace.dependencies]
anyhow = "1"
rayon = "1.10"
memmap2 = "0.9"
bytemuck = { version = "1.19", features = ["derive", "extern_crate_alloc"] }

# Tests and debug builds keep only line tables (panics and backtraces still name file and line).
# Full debug info on macOS stays in each build's object files beside the binaries, and they
# piled up to 38 GB in target/debug by 15 Oct 2026.
[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false

# Tests optimized (task #505): the suite's heavy tests (packs built from fixture tiles, the pool's
# simulations) ran 5-15x slower unoptimized; the slowest, 193 s, takes 28 s at these levels. The
# workspace's crates at 1 (a rebuild after an edit stays ~15 s), the third-party ones at 3 (built
# once). Debug assertions and overflow checks stay on, as in dev.
[profile.test]
opt-level = 1

[profile.test.package."*"]
opt-level = 3
