[workspace]
resolver = "2"
members = ["crates/det", "crates/roadcore", "crates/pipeline", "crates/server", "crates/store", "crates/names", "crates/webpenc"]
exclude = ["crates/geos-src"]

[workspace.dependencies]
anyhow = "1"
rayon = "1.10"
memmap2 = "0.9"
bytemuck = { version = "1.19", features = ["derive", "extern_crate_alloc"] }
# Every program's command line (pipeline::cli; docs/building.md, "Command lines"): strict, its
# usage generated. No colour: plain text in logs and in the pages' consoles.
clap = { version = "4.5", default-features = false, features = ["std", "derive", "string"] }
# (Help text and errors' context natively only, crates/pipeline/Cargo.toml: the WebAssembly programs
# a page runs stay small.)

# Tests and debug builds keep only line tables (panics and backtraces still name file and line).
# Full debug info on macOS stays in each build's object files beside the binaries, and they
# piled up to 38 GB in target/debug by 15 Oct 2026.
[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false

# Tests optimized (task #505): the suite's heavy tests (packs built from fixture tiles, the pool's
# simulations) ran 5-15x slower unoptimized; the slowest, 193 s, takes 28 s at these levels. The
# workspace's crates at 1 (a rebuild after an edit stays ~15 s), the third-party ones at 3 (built
# once). Debug assertions and overflow checks stay on, as in dev.
[profile.test]
opt-level = 1

[profile.test.package."*"]
opt-level = 3

# GEOS 3.13.1, the version shapely 2.1.2's wheel ships (pipeline::whsshapes computes as shapely
# did; crates.io's geos-src has 3.12.1, 3.14.1 and 3.15 dev, whose inscribed circles differ by an
# ulp): crates/geos-src is geos-src 0.2.4's build with GEOS 3.13.1's release tarball (its tests
# left out), built by CMake and linked statically.
[patch.crates-io]
geos-src = { path = "crates/geos-src" }
