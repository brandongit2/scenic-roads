<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<script src="/shim.js"></script>
<title>Scenic Roads Task Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* A sticky header (Claude's status, search, filters, adding), then two panes side by side: the
     folder tree, and every task by priority. The selected item's details dock on the right on wide
     screens and slide over the panes when narrower; under 900 px the panes become two tabs. */
  :root {
    --bg: #f5f7f6;
    --panel: #ffffff;
    --fg: #1b2220;
    --muted: #5c6964;
    --faint: #8e9994;
    --line: #e3e8e5;
    --line-strong: #cdd5d1;
    --hover: #edf1ef;
    --sel: #e1efe9;
    --sel-line: #9fcbbb;
    --accent: #1f6f5c;
    --on-accent: #ffffff;
    --focus: #2a8a71;
    --st-work-fg: #1c5ea8;
    --st-work-bg: #e3edfa;
    --st-int-fg: #8a5700;
    --st-int-bg: #f7edd6;
    --st-rev-fg: #6847b5;
    --st-rev-bg: #eee8fb;
    --st-wait-fg: #b3261d;
    --st-wait-bg: #fbe6e3;
    --st-done-fg: #1e7a51;
    --disc: #0a7c8a;
    --disc-bg: #dcf2f4;
    --mark: #fbe38c;
    --mark-fg: #1b2220;
    --toast-bg: #1f2624;
    --toast-fg: #eef2f0;
    --toast-accent: #7fdcbf;
    --scrim: rgba(12, 16, 14, 0.55);
    --shadow: 0 10px 30px rgba(16, 24, 20, 0.16), 0 1px 3px rgba(16, 24, 20, 0.08);
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --indent: 16px;
    --pr-w: 30px;
    --where-w: 84px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121614;
      --panel: #171c1a;
      --fg: #e1e7e4;
      --muted: #97a49e;
      --faint: #6b7873;
      --line: #252c29;
      --line-strong: #333c38;
      --hover: #1c2320;
      --sel: #17302a;
      --sel-line: #2e6957;
      --accent: #5fc4a6;
      --on-accent: #0d1a16;
      --focus: #6fd4b6;
      --st-work-fg: #86b9f3;
      --st-work-bg: #172739;
      --st-int-fg: #e6b65e;
      --st-int-bg: #2c2414;
      --st-rev-fg: #baa2f3;
      --st-rev-bg: #251e38;
      --st-wait-fg: #f38a7f;
      --st-wait-bg: #3a1c19;
      --st-done-fg: #5fc89b;
      --disc: #4fc8d5;
      --disc-bg: #133238;
      --mark: #6d5b14;
      --mark-fg: #fff4c7;
      --toast-bg: #2a3330;
      --toast-fg: #eef2f0;
      --toast-accent: #7fdcbf;
      --scrim: rgba(0, 0, 0, 0.6);
      --shadow: 0 12px 34px rgba(0, 0, 0, 0.55), 0 1px 3px rgba(0, 0, 0, 0.4);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121614;
    --panel: #171c1a;
    --fg: #e1e7e4;
    --muted: #97a49e;
    --faint: #6b7873;
    --line: #252c29;
    --line-strong: #333c38;
    --hover: #1c2320;
    --sel: #17302a;
    --sel-line: #2e6957;
    --accent: #5fc4a6;
    --on-accent: #0d1a16;
    --focus: #6fd4b6;
    --st-work-fg: #86b9f3;
    --st-work-bg: #172739;
    --st-int-fg: #e6b65e;
    --st-int-bg: #2c2414;
    --st-rev-fg: #baa2f3;
    --st-rev-bg: #251e38;
    --st-wait-fg: #f38a7f;
    --st-wait-bg: #3a1c19;
    --st-done-fg: #5fc89b;
    --disc: #4fc8d5;
    --disc-bg: #133238;
    --mark: #6d5b14;
    --mark-fg: #fff4c7;
    --toast-bg: #2a3330;
    --toast-fg: #eef2f0;
    --toast-accent: #7fdcbf;
    --scrim: rgba(0, 0, 0, 0.6);
    --shadow: 0 12px 34px rgba(0, 0, 0, 0.55), 0 1px 3px rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { height: 100%; }
  body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  mark { background: var(--mark); color: var(--mark-fg); border-radius: 2px; padding: 0 1px; margin: 0 -1px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  .app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }

  /* Header. */
  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: grid; gap: 8px; padding: 10px 16px 9px; background: var(--bg); border-bottom: 1px solid var(--line); min-width: 0; }
  .bar1, .bar2 { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; min-width: 0; }
  h1 { margin: 0; font: 600 16px/1.2 var(--sans); letter-spacing: -0.01em; }
  .status { flex: 1 1 16rem; min-width: 0; margin: 0; display: flex; align-items: center; gap: 7px; color: var(--muted); }
  .status .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .status .dot.live { background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .status .now { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg); }
  .status .when { flex: none; font: 11.5px var(--mono); color: var(--faint); font-variant-numeric: tabular-nums; }
  .ro { flex: none; height: 20px; padding: 0 7px; border: 1px solid var(--line-strong); border-radius: 4px; color: var(--muted); font: 500 11px/18px var(--sans); }
  .adds { display: flex; gap: 6px; margin-left: auto; }
  .btn { height: 28px; padding: 0 10px; display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--panel); color: var(--fg); font-weight: 500; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.primary:hover { filter: brightness(1.07); color: var(--on-accent); }
  .btn svg { width: 13px; height: 13px; }
  .search { position: relative; flex: 0 1 250px; min-width: 150px; display: flex; align-items: center; }
  .search svg { position: absolute; left: 8px; width: 14px; height: 14px; color: var(--faint); pointer-events: none; }
  .search input { width: 100%; height: 28px; padding: 0 28px 0 28px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--panel); color: var(--fg); }
  .search input::placeholder { color: var(--faint); }
  .search input:focus { border-color: var(--accent); outline: 2px solid color-mix(in srgb, var(--accent) 25%, transparent); outline-offset: 0; }
  .search kbd { position: absolute; right: 7px; padding: 0 5px; border: 1px solid var(--line); border-radius: 4px; color: var(--faint); font: 11px/16px var(--mono); pointer-events: none; }
  .search input:focus ~ kbd, .search input:not(:placeholder-shown) ~ kbd { display: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
  .chip { height: 24px; padding: 0 8px; display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .chip:hover { border-color: var(--line-strong); color: var(--fg); }
  .chip[aria-pressed="true"] { background: var(--sel); border-color: var(--sel-line); color: var(--fg); }
  .chip .n { font: 11px var(--mono); color: var(--faint); font-variant-numeric: tabular-nums; }
  .chip[aria-pressed="true"] .n { color: var(--muted); }
  .chip .sw { width: 8px; height: 8px; border-radius: 50%; }
  .chip select { border: 0; background: transparent; color: inherit; font-size: 12px; padding: 0; max-width: 12rem; }
  .chip.zero { opacity: 0.55; }
  .sep { width: 1px; height: 16px; background: var(--line-strong); margin: 0 2px; }
  .tabs { display: none; }
  .banner { margin: 0; padding: 5px 10px; border-radius: 6px; background: var(--st-int-bg); color: var(--st-int-fg); font-size: 12px; }
  .ghost-btn.hist { display: inline-flex; align-items: center; gap: 4px; }
  .ghost-btn svg { width: 13px; height: 13px; }
  .ghost-btn.hist[aria-expanded="true"] { background: var(--line); color: var(--fg); }
  .top-hist { margin: 4px 10px 8px 22px; }
  .top-hist .sec-h { margin: 2px 0 4px; }
  .filt { display: none; }

  /* Panes. */
  .panes { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(320px, 380px); }
  .pane { min-width: 0; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); border-right: 1px solid var(--line); }
  .pane-h { height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 16px; border-bottom: 1px solid var(--line); min-width: 0; }
  .pane-h h2 { margin: 0; font: 600 11px/1 var(--sans); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
  .pane-h .sum { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 11.5px var(--mono); color: var(--faint); font-variant-numeric: tabular-nums; }
  .pane-h .sp { flex: 1; }
  .ghost-btn { height: 24px; padding: 0 7px; border: 0; border-radius: 5px; background: none; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .ghost-btn:hover { background: var(--hover); color: var(--fg); }
  .pane-h label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .pane-h select { height: 24px; padding: 0 4px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); color: var(--fg); font-size: 12px; }
  .scroll { position: relative; min-height: 0; overflow: auto; overscroll-behavior: contain; padding-block: 4px 56px; }
  .rows { position: relative; }
  .empty { padding: 18px 16px; color: var(--muted); }
  .empty .btn { margin-top: 8px; }

  /* Rows: one line (a second for a status note or a task's folders), a handle at the left edge. */
  .row { --d: 0; position: relative; display: flex; align-items: flex-start; gap: 7px; min-height: 30px; padding: 6px 10px 6px calc(22px + var(--d) * var(--indent)); cursor: default; outline: none; }
  .row { --rowbg: var(--bg); background: var(--rowbg); }
  .row:hover { --rowbg: var(--hover); }
  .row.sel { --rowbg: var(--sel); }
  .row.sel::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); }
  .row:focus-visible { box-shadow: inset 0 0 0 2px var(--focus); }
  .row.sel:focus-visible { box-shadow: none; } /* (the selection, which follows the keys, shows where you are) */
  .grip { position: absolute; left: 3px; top: 6px; width: 16px; height: 18px; display: grid; place-items: center; border-radius: 4px; color: var(--faint); cursor: grab; touch-action: none; opacity: 0; }
  .grip::before { content: ""; width: 8px; height: 13px; background-image: radial-gradient(circle, currentColor 1.15px, transparent 1.5px); background-size: 4px 4.4px; background-position: center; }
  .row:hover .grip, .row.sel .grip, .row:focus-visible .grip { opacity: 1; }
  .grip:hover { color: var(--accent); background: var(--line); }
  @media (hover: none) { .grip { opacity: 0.75; } }
  .box { flex: none; width: 14px; height: 14px; margin-top: 2px; display: grid; place-items: center; border: 1.5px solid var(--faint); border-radius: 4px; }
  .box::after { content: ""; width: 6px; height: 6px; border-radius: 50%; }
  .box.s-working { border-color: var(--st-work-fg); }
  .box.s-working::after { background: var(--st-work-fg); }
  .box.s-integrating { border-color: var(--st-int-fg); }
  .box.s-integrating::after { background: var(--st-int-fg); }
  .box.s-review { border-color: var(--st-rev-fg); }
  .box.s-review::after { background: var(--st-rev-fg); }
  .box.s-waiting { border-color: var(--st-wait-fg); }
  .box.s-waiting::after { background: var(--st-wait-fg); }
  .box.s-done { background: var(--st-done-fg); border-color: var(--st-done-fg); }
  .box.s-done::after { width: 3.5px; height: 7px; border-radius: 0; border: solid var(--panel); border-width: 0 1.8px 1.8px 0; transform: translateY(-1px) rotate(45deg); }
  .tw { flex: none; width: 16px; height: 18px; margin: 0 -2px 0 -1px; padding: 0; display: grid; place-items: center; border: 0; border-radius: 4px; background: none; color: var(--muted); }
  .tw::before { content: ""; border-left: 5px solid currentColor; border-top: 4px solid transparent; border-bottom: 4px solid transparent; transform: rotate(90deg); transition: transform 0.12s; }
  .row.collapsed .tw::before { transform: none; }
  .tw:hover { background: var(--line); color: var(--fg); }
  .tw.leaf { visibility: hidden; }
  .main { flex: 1; min-width: 0; display: grid; gap: 1px; }
  .l1 { display: flex; align-items: center; gap: 6px; min-width: 0; min-height: 18px; }
  .ttl { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .folder > .main .ttl { font-weight: 600; }
  /* A task's number, #57, before its title: faint, mono, its digits all one width, never wrapped;
     right-aligned in a column wide enough for "#999", so titles line up. */
  .num { flex: none; min-width: 4ch; margin-right: -1px; text-align: right; color: var(--faint); font: 11.5px/18px var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; white-space: nowrap; }
  .num mark { padding: 0; margin: 0; }
  /* (In the narrowest rows, in the tree on a small phone, the title keeps the room: the number
     is in the details, and in the priorities.) */
  .row { container-type: inline-size; }
  @container (max-width: 279px) { .num { display: none; } }
  @media (max-width: 360px) { .num { min-width: 0; font-size: 10.5px; } }
  /* "#57" in a description, a note or the trail: a link to that task. */
  .ref { color: var(--accent); cursor: pointer; text-decoration: underline; text-decoration-color: color-mix(in srgb, currentColor 40%, transparent); text-underline-offset: 2px; white-space: nowrap; }
  .ref:hover { text-decoration-color: currentColor; }
  .ref:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; border-radius: 2px; }
  .l2 { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 12px; }
  .l2.crumbs { color: var(--faint); }
  .row.done .ttl, .row.done .l2 { color: var(--faint); }
  .row.arch > .main, .row.arch > .tail, .row.arch > .box, .row.arch > .pr { opacity: 0.55; }
  .row.ctx > .main .ttl { color: var(--muted); font-weight: 500; }
  .row.ctx > .main, .row.ctx > .tail { opacity: 0.7; }
  .st { flex: none; height: 18px; max-width: 15rem; padding: 0 6px; display: inline-flex; align-items: center; gap: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-radius: 4px; font: 500 11px/18px var(--sans); }
  .st.s-working { color: var(--st-work-fg); background: var(--st-work-bg); }
  .st.s-integrating { color: var(--st-int-fg); background: var(--st-int-bg); }
  .st.s-review { color: var(--st-rev-fg); background: var(--st-rev-bg); }
  .st.s-waiting { color: var(--st-wait-fg); background: var(--st-wait-bg); }
  .st.s-done { color: var(--st-done-fg); padding: 0; }
  .ed-chips .st.s-done::before, .legend .st.s-done::before { content: "✓"; font-weight: 600; }
  .tag { flex: none; height: 16px; padding: 0 5px; border: 1px solid var(--line-strong); border-radius: 4px; color: var(--muted); font: 500 10px/14px var(--sans); letter-spacing: 0.05em; text-transform: uppercase; }
  .tail { position: relative; flex: none; display: flex; align-items: center; gap: 2px; height: 18px; }
  /* A row's actions show over its "where" column while it's hovered, focused or selected. */
  .acts { position: absolute; right: 0; top: -2px; z-index: 1; display: flex; align-items: center; gap: 2px; padding-left: 18px; background: linear-gradient(to right, transparent, var(--rowbg) 16px); opacity: 0; pointer-events: none; }
  .task .acts { min-width: calc(var(--where-w) + 2px); justify-content: flex-end; padding-left: 0; background: var(--rowbg); }
  #tree .task .acts { right: calc(var(--pr-w) + 2px); }
  .folder .acts { right: calc(100% + 2px); }
  .row:hover .acts, .row.sel .acts, .row:focus-within .acts { opacity: 1; pointer-events: auto; }
  @media (hover: none) { .row .acts { position: static; min-width: 0; padding-left: 0; background: none; opacity: 1; pointer-events: auto; } }
  .ic { flex: none; width: 22px; height: 22px; padding: 0; display: grid; place-items: center; border: 0; border-radius: 5px; background: none; color: var(--faint); }
  .ic:hover { background: var(--line); color: var(--fg); }
  .ic svg { width: 14px; height: 14px; }
  .ic.on { color: var(--disc); }
  .ic.on svg path, .toggle[aria-pressed="true"] svg path { fill: currentColor; }
  .ic.on:hover { background: var(--disc-bg); color: var(--disc); }
  .ic[aria-disabled="true"] { cursor: default; }
  .hist { width: auto; min-width: 22px; padding: 0 4px; gap: 3px; display: inline-flex; align-items: center; font: 11px var(--mono); }
  .hist.open { color: var(--fg); background: var(--line); }
  .where { width: var(--where-w); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; color: var(--faint); font-size: 12px; }
  .pr { flex: none; width: var(--pr-w); text-align: right; font: 500 12px/18px var(--mono); font-variant-numeric: tabular-nums; color: var(--muted); }
  .pr.none { color: var(--faint); }
  .pr.next { color: var(--accent); font-weight: 600; }
  .lead { width: 26px; margin-left: -4px; text-align: right; }
  .cnt { flex: none; font: 11.5px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .meter { flex: none; width: 44px; height: 4px; margin: 0 4px; border-radius: 2px; background: var(--line-strong); overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--st-done-fg); border-radius: 2px; }
  .hist-list { margin: -3px 10px 6px calc(43px + var(--d) * var(--indent)); padding: 3px 0 3px 10px; display: grid; gap: 1px; border-left: 1px solid var(--line-strong); font-size: 12px; color: var(--muted); }
  .hist-list .none { color: var(--faint); }
  .ev { display: flex; gap: 8px; min-width: 0; }
  .ev time { flex: none; width: 5.6em; color: var(--faint); font: 11px/18px var(--mono); }
  .ev span { min-width: 0; overflow-wrap: anywhere; }
  .ev .who { flex: none; color: var(--accent); font-size: 11px; }
  .addrow { display: flex; align-items: center; gap: 2px; height: 24px; padding-left: calc(38px + var(--d) * var(--indent)); opacity: 0; transition: opacity 0.12s; }
  .addrow.hot, .addrow:focus-within { opacity: 1; }
  @media (hover: none) { .addrow { opacity: 0.8; } }
  .gap { height: 10px; }
  .addrow button { height: 20px; padding: 0 6px; border: 0; border-radius: 4px; background: none; color: var(--muted); font-size: 12px; }
  .addrow button:hover { background: var(--hover); color: var(--accent); }
  .row.draft input.unsaved { border-color: var(--st-int-fg); border-style: dashed; }
  .row.draft input { flex: 1; min-width: 0; height: 24px; margin: -3px 0; padding: 0 6px; border: 1px solid var(--accent); border-radius: 5px; background: var(--panel); color: var(--fg); outline: none; }
  .grp { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px 0 22px; color: var(--muted); font: 600 10.5px/1 var(--sans); letter-spacing: 0.07em; text-transform: uppercase; }
  .grp::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .grp .n { font: 500 11px var(--mono); letter-spacing: 0; color: var(--faint); }
  .grp.wait { color: var(--st-wait-fg); }
  .grp.drop { color: var(--accent); }
  .grp.drop::after { height: 2px; background: var(--accent); }

  /* Dragging. */
  .row.dragging { opacity: 0.35; }
  .row.drop-in { background: var(--sel); box-shadow: inset 0 0 0 1.5px var(--accent); }

  // ---------------------------------------------------------------------------------------------
  // Stages, filters, the model.
  const STAGES = { "": "Queued", working: "Under way", integrating: "Integrating", review: "In review", waiting: "Waiting on you", done: "Done" };
  const stageOf = (t) => (typeof t.stage === "string" && t.stage in STAGES ? t.stage : "");
  const shortWhere = (w) => String(w ?? "").replace(/\s*\(.*$/s, "").trim();
  function stageText(t) {
    switch (stageOf(t)) {
      case "working": return `under way · ${shortWhere(t.where) || "Subagent"}`;
      case "integrating": return "integrating";
      case "review": return "in review";
      case "waiting": return "waiting on you";
      case "done": return "done";
      default: return "";
    }
  }
  const TYPICAL_WHERE = ["Subagent", "Sonnet subagent", "Haiku subagent", "Me", "You", "Build Mac process"];
  const TASK_FIELDS = ["priority", "slot", "where", "stage", "discuss", "started", "finished", "reply"];
  const FILTERS = [
    { key: "working", label: "Under way", sw: "var(--st-work-fg)", test: (t) => stageOf(t) === "working" },
    { key: "intrev", label: "Integrating or in review", sw: "var(--st-rev-fg)", test: (t) => stageOf(t) === "integrating" || stageOf(t) === "review" },
    { key: "waiting", label: "Waiting on you", sw: "var(--st-wait-fg)", test: (t) => stageOf(t) === "waiting" },
    { key: "discuss", label: "Needs discussion", sw: "var(--disc)", test: (t) => !!t.discuss },
  ];

  const S = {
    db: null,
    assets: null,
    readOnly: false,
    writable: null, // (what the platform says: true, false, or null for not told)
    failed: "",
    raw: { items: new Map(), events: new Map() },
    loaded: { items: false, events: false },
    meta: null,
    overlay: new Map(), // "items/<id>" → [{tok, op: "patch" | "set" | "del", body}]: writes under way, shown at once
    sel: null,
    sheet: false,
    collapsed: new Set([].concat(local.get("collapsed", [])).filter((x) => typeof x === "string")),
    showArch: !!local.get("archived", false),
    sort: ["priority", "recent", "added"].includes(local.get("sort", "")) ? local.get("sort", "") : "priority",
    tab: local.get("tab", "tree") === "prio" ? "prio" : "tree",
    q: "",
    filters: new Set(),
    where: null,
    hist: new Set(), // "<pane>:<id>": a row's history, open
    draft: null, // {kind, parent, text}: a new item whose title is being typed
    dragging: false,

  // (May this view change the backlog at all; and may it right now: changes pause while the view
  // isn't the server's latest yet, or the connection is lost.)
  const canEdit = () => !!S.db && !S.readOnly;

  // The doc as shown: the store's latest, with the changes of the actions still being written laid
  // over it in order (a patch of the fields an action changes, a whole doc it creates, or none for
  // one it deletes), so a change of Claude's to any other field shows at once.
  function layered(col, id, base) {
    const ls = S.overlay.get(col + "/" + id);

  }

  }

      const id = k.slice(i + 1);

  let M = null; // the model, rebuilt on every render
  function build() {
    const byId = new Map();
    for (const [id, d] of merged("items")) byId.set(id, Object.assign({}, d, { id }));
    const kids = new Map([["", []]]);
    const list = (p) => kids.get(p) || (kids.set(p, []), kids.get(p));

    }
    const cmp = (a, b) => (isNum(a.order) ? a.order : 0) - (isNum(b.order) ? b.order : 0) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);

    const seen = new Set();
    const walk = (it, depth, crumbs, archAnc) => {

      order.push(it);

    for (let guard = 0; seen.size < byId.size && guard < 100; guard++) {
      const lost = [...byId.values()].find((it) => !seen.has(it.id));

    // one added first; a folder's kept number names nothing).
    const byNum = new Map();
    for (const t of [...tasks].sort(byAdded)) if (validNum(t.num) && !byNum.has(t.num)) byNum.set(t.num, t.id);

    for (const l of ev.values()) l.sort((a, b) => (ms(b.t) ?? 0) - (ms(a.t) ?? 0));

  }
  const kidsOf = (id) => M.kids.get(id) || [];

    go(id);
    return out;
  }
  const isInside = (id, anc) => !!M.byId.get(id)?.$crumbs.some((c) => c.id === anc);
  const title = (it) => String(it.text ?? "").trim() || (it.$folder ? "Untitled folder" : "Untitled task");
  const isArch = (it) => !!(it.archived || it.$archAnc);
  const hiddenArch = (it) => !S.showArch && isArch(it);
  const lastEvent = (id) => ms(M.ev.get(id)?.[0]?.t);
  const changedAt = (t) => Math.max(ms(t.finished) ?? -Infinity, ms(t.started) ?? -Infinity, lastEvent(t.id) ?? -Infinity);

  // Search: every word somewhere in the title, description, where it runs, the status note or the
  // folders it's in. A word "#57" is task 57, and nothing else; a bare 57 is task 57 or the text.
  const terms = () => S.q.toLowerCase().split(/\s+/).filter(Boolean);
  const numTerm = (t) => (/^#\d{1,9}$/.test(t) ? Number(t.slice(1)) : null);
  const bareNum = (t) => (/^\d{1,9}$/.test(t) ? Number(t) : null);
  const shownNum = (it) => (it && !it.$folder && validNum(it.num) ? it.num : null);
  const hay = (it) => [it.text, it.note, it.where, it.reply, ...it.$crumbs.map((c) => c.text)].map((s) => String(s ?? "")).join("\n").toLowerCase();
  const matchQ = (it) => {
    const ts = terms();
    if (!ts.length) return true;
    const s = hay(it), n = shownNum(it);
    return ts.every((t) => { const k = numTerm(t); return k != null ? n === k : (n != null && bareNum(t) === n) || s.includes(t); });
  };
  // (Is the task's own number one the search names?)
  const numHit = (it) => { const n = shownNum(it); return n != null && terms().some((t) => (numTerm(t) ?? bareNum(t)) === n); };

  const matchChips = (t) => FILTERS.every((f) => !S.filters.has(f.key) || f.test(t)) && (S.where == null || String(t.where ?? "") === S.where);

  }

  }

  // `mark`: the search's words marked too; `row`: in a row, out of the tab order like its buttons.
  const MENTION = /(^|[^\w#&/])#(\d{1,7})(?![\w-])/g;

  // ---------------------------------------------------------------------------------------------
  // Writing. An action is a list of ops {col, id, before, after} (whole bodies, null for none),
  // worked out when you act, on the page as shown, so the screen changes at once (the overlay).
  // Actions are written one at a time, in the order you made them; an undo is an action like any
  // other. An op updates only the fields it changes (a field that goes is written as null), sets a
  // doc it creates (or recreates, if the doc is still gone), or deletes one; an action's ops go out
  // at most four at a time, one at a time per doc. A refusal that can pass (a rate limit, a lost
  // connection) is tried again after 1, 2 and 4 s. A write is never given up on: one unanswered

  // lands late counts as landed). When an action fails for good, what it wrote is put back, the
  // actions made after it (which counted on it) are dropped before they write anything, and the

  // Put back what did. (Undo puts back the fields the action changed, even one Claude has changed

  // no undo clears one).

  // An op's layer: the fields it changes (a field that goes: null), a doc it creates, or a delete.

    if (op.before === null) return { tok, op: "set", body: op.after };

      if (ls.length) S.overlay.set(k, ls);
      else S.overlay.delete(k);
    }
  }
  function writeOne(op) {

    if (op.before === null && !S.raw[op.col].has(op.id)) return ref.set(op.after);
    const ks = opKeys(op);
    if (!ks.length) return Promise.resolve();
    const patch = {};
    for (const k of ks) patch[k] = k in op.after ? op.after[k] : null;
    return ref.update(patch).catch((e) => {

      : code === "unavailable" ? "the server can't be reached"
      : code === "revoked" ? "this view lost access to the task board"

  $("add-task").addEventListener("click", () => startDraft("task", ""));
  $("add-folder").addEventListener("click", () => startDraft("folder", ""));
  $("sort").addEventListener("change", () => { S.sort = $("sort").value; local.set("sort", S.sort); render(); });
  $("top-hist").addEventListener("click", () => { if (S.hist.has("tree:")) S.hist.delete("tree:"); else S.hist.add("tree:"); render(); });
  $("expand-all").addEventListener("click", () => { S.collapsed.clear(); local.set("collapsed", []); render(); });
  $("collapse-all").addEventListener("click", () => { for (const it of M.order) if (it.$folder) S.collapsed.add(it.id); local.set("collapsed", [...S.collapsed]); render(); });
  function setTab(t, focus) {
    S.tab = t;
    local.set("tab", t);
    render();
    if (focus) $(t === "tree" ? "tab-tree" : "tab-prio").focus();
  }
  $("tab-tree").addEventListener("click", () => setTab("tree"));
  $("tab-prio").addEventListener("click", () => setTab("prio"));
  for (const t of ["tab-tree", "tab-prio"]) $(t).addEventListener("keydown", (e) => { if (e.key === "ArrowLeft" || e.key === "ArrowRight") { e.preventDefault(); setTab(S.tab === "tree" ? "prio" : "tree", true); } });
  const narrow = matchMedia("(max-width: 899px)");
  const roles = () => { for (const id of ["pane-tree", "pane-prio"]) { if (narrow.matches) { $(id).setAttribute("role", "tabpanel"); $(id).setAttribute("aria-labelledby", id === "pane-tree" ? "tab-tree" : "tab-prio"); } else { $(id).removeAttribute("role"); $(id).setAttribute("aria-labelledby", id === "pane-tree" ? "tree-h" : "prio-h"); } } };
  narrow.addEventListener?.("change", roles);
  roles();

  // The editor's buttons, photos and paste.
  $("editor").addEventListener("click", (e) => {
    const b = e.target.closest("[data-act], [data-photo], [data-rm], [data-ref]");
    if (!b) return;
    const it = edItem();
    if (b.dataset.rm) {
      e.stopPropagation();
      if (it && canWrite()) commit([edit(it.id, { photos: (it.photos || []).filter((p) => p !== b.dataset.rm) })], { toast: "Removed a photo" });
      return;
    }
    if (b.dataset.photo) return showPhoto(b.dataset.photo);
    if (b.dataset.ref) return goRef(b.dataset.ref);
    const a = b.dataset.act;
    if (a === "ed-close") { const pane = S.tab; S.sheet = false; if (!narrow.matches && !matchMedia("(max-width: 1199px)").matches) S.sel = null; render(); rowEl(pane, S.sel)?.focus({ preventScroll: true }); }
    else if (a === "ed-menu" && it) openMenu(b, it.id);
    else if (a === "copy-num" && it) copyNum(it, b);
    else if ((a === "ed-add-task" || a === "ed-add-folder") && it) startDraft(a === "ed-add-task" ? "task" : "folder", it.id);
  });
  document.addEventListener("paste", (e) => {
    if (!S.sel || !canWrite() || !S.assets) return;
    const files = [...(e.clipboardData?.files || [])].filter((f) => /^image\//.test(f.type));
    if (!files.length) return;
    const a = document.activeElement;
    if (a && (a.id === "q" || a.id === "draft-input")) return;
    e.preventDefault();
    addPhotos(S.sel, files);
  });
  $("viewer-close").addEventListener("click", closePhoto);
  $("viewer").addEventListener("click", (e) => { if (e.target === $("viewer")) closePhoto(); });

  // Keys anywhere: / searches, Esc steps back, ⌘Z undoes while the notice shows.
  const typing = (el) => !!el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
  document.addEventListener("keydown", (e) => {
    if (e.defaultPrevented) return;
    const a = document.activeElement;
    if (e.key === "Escape") {
      if (!$("viewer").hidden) { e.preventDefault(); closePhoto(); return; }
      if (menu) { e.preventDefault(); closeMenu(true); return; }
      if (a && $("editor").contains(a)) {
        e.preventDefault();
        a.blur();
        if (matchMedia("(max-width: 1199px)").matches) { S.sheet = false; render(); }
        const pane = narrow.matches ? S.tab : "tree";
        (rowEl(pane, S.sel) || rowEl("prio", S.sel))?.focus({ preventScroll: true });
        return;
      }
      if (S.sheet && S.sel) { e.preventDefault(); S.sheet = false; render(); }
      return;
    }
    if (typing(a)) return;
    if ((e.key === "Enter" || e.key === " ") && a?.dataset?.ref && !e.metaKey && !e.ctrlKey && !e.altKey) { e.preventDefault(); goRef(a.dataset.ref); return; }
    if (e.key === "/" && !e.metaKey && !e.ctrlKey && !e.altKey) { e.preventDefault(); $("q").focus(); $("q").select(); }
    else if ((e.key === "z" || e.key === "Z") && (e.metaKey || e.ctrlKey) && !e.shiftKey && undoFn) { e.preventDefault(); undo(); }
    else if ((e.key === "z" || e.key === "Z") && (e.metaKey || e.ctrlKey) && e.shiftKey && redoFn) { e.preventDefault(); redo(); }
  });

  // Times shown as "3 h ago" stay current.
  setInterval(() => {
    for (const t of document.querySelectorAll("time[data-t]")) { const v = ago(t.dataset.t); if (t.textContent !== v) t.textContent = v; }
    const dot = $("status").querySelector(".dot");
    const u = ms(S.meta?.updated);
    dot?.classList.toggle("live", u != null && Date.now() - u < 20 * 60e3);
  }, 30e3);

  // ---------------------------------------------------------------------------------------------
  // Start: the database (read-only where it's refused), photos where this viewer may add them.
  function updateWhereList() {
    const vals = new Set(TYPICAL_WHERE);
    for (const it of S.raw.items.values()) if (typeof it.where === "string" && it.where.trim()) vals.add(it.where.trim());
    $("where-list").replaceChildren(...[...vals].map((v) => h("option", { value: v })));
  }
  // Each subscription, should it fail, is opened again after 1, 2, 4… up to 30 s, for as long as it
  // takes; while the items' is down the page is read-only, with a banner saying so.
  function sub(make, onSnap, critical) {
    let n = 0;
    const start = () => {
      make().onSnapshot((snap) => {
        n = 0;
        onSnap(snap);
        if (critical && S.down) { S.down = false; soon(); if (canWrite()) setTimeout(() => { render(); resume(); }, 0); }
      }, (e) => {
        if (e?.code === "revoked") { S.readOnly = true; render(); return; }
        if (critical) { S.down = true; render(); }
        setTimeout(start, Math.min(30000, 1000 * 2 ** n++) * (0.8 + Math.random() * 0.4));
      });
    };
    start();
  }
  function listen() {
    sub(() => S.db.collection("items"), (snap) => {
      const paused = !canWrite();
      S.raw.items = new Map(snap.docs.map((d) => [d.id, d.data() || {}]));
      S.loaded.items = true;
      // (Only a cached view counts as not yet the server's: the page's own unconfirmed writes come
      // with hasPendingWrites, never fromCache.)
      S.synced = !snap.metadata?.fromCache;
      if (paused && canWrite()) setTimeout(() => { render(); resume(); }, 0);
      updateWhereList();
      soon();
      repairSoon();
    }, true);
    sub(() => S.db.collection("events").orderBy("t", "desc").limit(1000), (snap) => {
      S.raw.events = new Map(snap.docs.map((d) => [d.id, d.data() || {}]));
      S.loaded.events = true;
      soon();
    });
    sub(() => S.db.doc("meta/status"), (snap) => { S.meta = snap.exists ? snap.data() || null : null; soon(); });
  }
  (async () => {
    M = build();
    render();
    const c = window.claude;
    const db = c && typeof c.use === "function" ? await c.use("db").catch(() => null) : null;
    if (!db) {
      S.noDb = true;
      S.failed = "This view can't load the task board. Open it on claude.ai while signed in.";
      render();
      return;
    }
    S.db = db;
    const writable = c.use("user").then((u) => (u && typeof u.can === "function" ? u.can("data.write") : null)).catch(() => null);
    const w = await Promise.race([writable, sleep(1500).then(() => undefined)]);
    const take = (v) => { if (v === true || v === false) S.writable = v; if (v === false) S.readOnly = true; };
    if (w === undefined) writable.then((v) => { take(v); render(); });
    else take(w);
    c.use("assets").then((a) => { S.assets = a || null; soon(); }).catch(() => {});
    listen();
    render();
  })();
})();
</script>


</body></html>
