# Every child is started, and every listener made and connection taken, by store::spawn: a child
# started while a socket is made would hold it (docs/pool.md §7.5). Checked by tools/app/publish.sh
# (cargo clippy --workspace --all-targets -- -A clippy::all -D clippy::disallowed_methods).
# (tokio::process: allow-invalid, its feature off today, the ban kept for when it is on.)
disallowed-methods = [
    { path = "std::process::Command::new", reason = "store::spawn::command: a program started by its path, so no failed exec's half-made child holds this process's files (their locks) after the start" },
    { path = "std::process::Command::spawn", reason = "store::spawn::spawn: a child started while a socket is made holds it" },
    { path = "std::process::Command::status", reason = "store::spawn::status: a child started while a socket is made holds it" },
    { path = "std::process::Command::output", reason = "store::spawn::output: a child started while a socket is made holds it" },
    { path = "std::net::TcpListener::bind", reason = "store::spawn::listen: a child started while it's made holds it" },
    { path = "std::net::TcpListener::accept", reason = "store::spawn::accept: a child started while it's made holds it" },
    { path = "tokio::net::TcpListener::bind", reason = "store::spawn::listen, then from_std: a child started while it's made holds it" },
    { path = "std::net::TcpListener::incoming", reason = "store::spawn::accept: a child started while it's made holds it" },
    { path = "tokio::process::Command::spawn", allow-invalid = true, reason = "store::spawn::spawn: a child started while a socket is made holds it" },
    { path = "tokio::process::Command::status", allow-invalid = true, reason = "store::spawn::status: a child started while a socket is made holds it" },
    { path = "tokio::process::Command::output", allow-invalid = true, reason = "store::spawn::output: a child started while a socket is made holds it" },
    { path = "tokio::net::TcpListener::accept", reason = "coordwire::net::Listener: a child started while it's made holds it" },
    # The platforms' transcendental functions differ in the last bit (Apple's libm against musl's and
