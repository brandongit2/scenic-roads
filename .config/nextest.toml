# Every test runs bounded (#1108, #1112; tools/dev/testing.md, "Every test bounded"): nextest says
# SLOW each period, then ends a test that outlasts terminate-after periods (SIGTERM, then SIGKILL
# after its grace period) and fails it as TIMEOUT.
#
# The budget (#1112): every test under 10 s alone on the M4 unloaded. The bound, 3 min: the budget
# with room for the loaded test Mac (three suites at nice 20 beside builds), where 8-10 Nov's runs
# took a test up to 4x its time alone at the median and 7x at the 90th percentile (the dev jobs'
# test spans against each test alone, 10 Nov); and over store::testkit::WATCHDOG (2 min), so a
# test waiting with it fails itself first, saying what for. A test over the bound is failed, never
# given more: make it smaller (testing.md, "Every test bounded": the budget).
[profile.default]
slow-timeout = { period = "60s", terminate-after = 3 }

# Over the budget still, left for task #1096 (the terrain steps' read paths, changing now): their
# fixtures are the steps' own z6 tiles. 15 and 28 s alone on the M4, 10 Nov; 20 min as before.
[[profile.default.overrides]]
filter = """
package(terrain) & (
    test(=terrain_task::tests::a_groups_tiles_made_from_its_file_are_the_pieces_bytes)
  | test(=terrain_task::tests::a_z6_tile_stopped_and_resumed_makes_the_same_packs))
"""
slow-timeout = { period = "60s", terminate-after = 20 }
