[project]
name = "producers"
version = "0.1.0"
description = "The scripts that make the map's inputs in their drop boxes' shapes (docs/inputs.md §8); never run by the app."
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pyproj>=3.8.0",
    "pyshp>=3.1.6",
    "rasterio>=1.5.1",
    "scipy>=1.18.1",
    "shapely>=2.1.2",
    "tqdm>=4.70.1",
]

[tool.uv]
package = false
