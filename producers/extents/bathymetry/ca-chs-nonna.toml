notes = "The CHS's consolidation of its digital surveys in Canadian waters (multibeam, lidar and older soundings merged), on chart datum, updated 1 Apr 2026: its two cell indexes (OGL-Canada, the record's attachments), NONNA-10's 72,305 cells of 0.1° (wider north of 68° N) and NONNA-100's 1,220 of 1°, each a piece. The data come through the CHS portal's guest login under the NONNA Licence (no redistribution; copies destroyed on its termination), so the cells are claimed. A cell is where the product has data, not all of it: gaps where no modern survey is. Its per-source detail (TECSOU, CATZOC, survey dates) is only inside the downloads: not read."

