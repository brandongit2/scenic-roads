name = "Litto3D (Shom and IGN): topo-bathymetric models of the French coasts"
credit = "Shom and IGN, Litto3D"
licence = "Licence Ouverte 1.0 and 2.0 (Etalab), by product"
licence_url = "https://www.etalab.gouv.fr/licence-ouverte-open-licence/"
source = "https://diffusion.shom.fr/donnees/altimetrie-littorale.html"
theme = "bathymetry"
availability = "open"
notes = "The coastal strip of France's Litto3D programme (airborne topo-bathymetric lidar on the sea side, multibeam where the lidar fails, topographic lidar inland; a model of 1 m or 5 m, tiles as 7z archives; free under the Licence Ouverte, not for navigation), a piece for each of the Shom's 25 products (the metropolitan regions, Corsica, the Antilles, Réunion, Mayotte, the Îles Éparses, Saint-Pierre-et-Miquelon, four of French Polynesia's islands, the Rance and Roches Douvres): the tiles the Shom's WFS lists for each (GRILLE layers: 2,982 tiles; the 7z downloads can't be read by range), a tile counted where the product has data. The spacing is the finest each tile's record states (1 m, or 5 m alone for Finistère 2014, Languedoc-Roussillon 2011 and Iroise 2012; Brittany's, Nouvelle-Aquitaine's, Saint-Pierre-et-Miquelon's, the Rance's and Roches Douvres's records state both and are taken at 1 m); the year is the last of the product's name. The sea values are heights in the land's vertical system (IGN69; IGN78 in Corsica), not chart depths."

