name = "Shom bathymetric models of the façades and the coasts (HOMONIM, TANDEM)"
credit = "Shom (Service hydrographique et océanographique de la Marine)"
licence = "Licence Ouverte 2.0 (Etalab)"
licence_url = "https://www.etalab.gouv.fr/licence-ouverte-open-licence/"
source = "https://www.data.gouv.fr/organizations/shom/"
theme = "bathymetry"
availability = "open"
notes = "The Shom's digital terrain models for hydrodynamic (tide, surge, tsunami) modelling, free under the Licence Ouverte 2.0 and not for navigation: the façades' 100 m models (Atlantic, Gulf of Lion and Côte d'Azur, Corsica, the Antilles, Guyane, Réunion, Mayotte, New Caledonia, Tahiti and Moorea, Clipperton; 0.001°) compiled from the Shom's soundings and other surveys, and the coastal models (20 m in the Pas-de-Calais, Morbihan, the Pertuis Charentais, the Gironde, Arcachon, the Baie de Saint-Jean-de-Luz, the Gulf of Normandy-Brittany, Tahiti, Moorea and Clipperton; 10 m at Boulogne-sur-Mer; 5 m at Île de Ré and Saint-Malo), whose nodes are interpolated from the soundings. The downloads are 7z archives, which can't be read by range, so each model's extent is where the Shom's own WMS layer (MNT_*_WMSR) draws it: a GetMap of the layer's published bounding box as a GeoTIFF at 0.01° (façades, 1 km cells), 0.002° (20 m models, 220 m) or 0.0005° (harbours, 55 m), its alpha channel the valid data. The models state no survey year and no per-cell source (the Shom's sounding surveys, LEVES_BATHY, are not declared). Heights and depths are on the lowest astronomical tide (PBMA) or mean sea level (NM), in two files each."

