name = "LINZ bathymetric depth models and New Zealand Coastal LiDAR"
credit = "Toitū Te Whenua Land Information New Zealand (LINZ), New Zealand Hydrographic Authority"
licence = "CC-BY-4.0"
licence_url = "https://creativecommons.org/licenses/by/4.0/"
source = "https://data.linz.govt.nz/"
theme = "bathymetry"
availability = "open"
notes = "Two of LINZ's open (CC BY 4.0) bathymetric products. The Depth Model series on the LINZ Data Service (58 of its 64 gridded layers, of multibeam sonar and of airborne bathymetric lidar, harbours, sounds, fiords and shipping lanes surveyed 1999 to 2025, on approximate lowest astronomical tide) is not declared as an extent: only the layers' bounding boxes are public without an API key (a free Data Service login gives the export and the footprint layers, a key we create no account for), and a box reaches far beyond where the sonar went, so claiming it would outrank real surveys across all that open sea. The New Zealand Coastal LiDAR 1 m DEM (the 3D Coastal Mapping Programme: airborne topographic and bathymetric lidar to about 25 m of water, anonymous on LINZ's public S3 bucket, NZVD2016, surveys captured 2024 to 2026): the capture areas of its 29 collections (28 surveys and their composite), a piece for them all (each area's own survey year isn't in its file)."

[[piece]]
id = "depth-models"
availability = "login"
method = "none"
why = "the Depth Model layers' extents are bounding boxes, which claim open sea (58 of them 548,000 km², twice New Zealand's land; one box round the Bounty and Antipodes Islands alone 252,943 km²), and the Data Service gives their footprints only with an API key, which we create no account for"

