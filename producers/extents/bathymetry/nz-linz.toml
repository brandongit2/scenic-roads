name = "LINZ bathymetric depth models and New Zealand Coastal LiDAR"
credit = "Toitū Te Whenua Land Information New Zealand (LINZ), New Zealand Hydrographic Authority"
licence = "CC-BY-4.0"
licence_url = "https://creativecommons.org/licenses/by/4.0/"
source = "https://data.linz.govt.nz/"
theme = "bathymetry"
availability = "open"
notes = "Two of LINZ's open (CC BY 4.0) bathymetric products. The Depth Model series on the LINZ Data Service (58 of its 64 gridded layers, of multibeam sonar and of airborne bathymetric lidar at Whitianga, Motiti, Great Mercury, Stewart Island and the Snares and Solander Islands; harbours, sounds, fiords and shipping lanes surveyed 1999 to 2025, on approximate lowest astronomical tide): each layer's page on the Data Service's API (a free Data Service login for its export, a key the producer doesn't hold), its extent the layer's bounding box, so each is claimed, the box reaching beyond where the sonar went (the six shipping lane models, narrow strips whose boxes would claim 100,000 km² of open sea each, are left out: their footprints are LINZ's index layers 122710 and 122711, behind the key); its spacing and year are those of its title (`... Multibeam 2m Depth Model (2022)`). The New Zealand Coastal LiDAR 1 m DEM (the 3D Coastal Mapping Programme: airborne topographic and bathymetric lidar to about 25 m of water, anonymous on LINZ's public S3 bucket, NZVD2016, surveys captured 2024 to 2026): the capture areas of its 29 collections (28 surveys and their composite), a piece for them all (each area's own survey year isn't in its file)."

