notes = "Shom's and IGN's continuous land-sea models of Mayotte, La Réunion and the Îles Éparses (airborne topographic lidar on land, bathymetric lidar or multibeam at sea, 300 m overlapping): a 1 m DTM each, in 5 km packages from Shom's INSPIRE download service, without a login. Each campaign's extent is its package grid (Shom's WFS LITTO3D_<campaign>_GRILLE_WFS: 192, 134 and 80 packages on 13 Nov 2026), squares over land and sea; its year the one its name and record give (Mayotte's dated 10 Dec 2012, La Réunion's 2 May 2016, the Éparses' 1 Mar 2012). The two departments also have IGN's LiDAR HD (La Réunion) and RGE ALTI (both): ign-lidar-hd's and fr-rgealti's."

