name = "South Georgia GIS: SG DEM and Shackleton Crossing DEM"
credit = "Government of South Georgia and the South Sandwich Islands, South Georgia GIS (British Antarctic Survey Mapping and Geographic Information Centre)"
licence = "no conditions stated (the services' Fees and AccessConstraints none)"
licence_url = "https://www.sggis.gov.gs/geoserver/ows?service=WMS&request=GetCapabilities&version=1.3.0"
source = "https://www.sggis.gov.gs/geoserver/ows?service=WCS&request=GetCapabilities&version=2.0.1"
theme = "terrain"
availability = "open"
notes = "The South Georgia GIS's elevation models, served openly over its WCS with no login: the \"SG DEM\", a 20 m grid of South Georgia (8,040 × 5,374 cells) composited from ASTER GDEM, SRTM, five DEMs from very-high-resolution imagery and one from aerial photography (created 2017; a surface model, its glaciers cautioned); and the 5 m \"Shackleton Crossing DEM\" from two WorldView-1 stereo pairs of 2013-14 (\"No ground control points were used\"). Both coverages are in an engineering CRS the server can't name (EPSG:404000, a local South Georgia Lambert), so their own masks can't be placed: the SG DEM's extent is South Georgia, as Natural Earth's 1:10m map subunits (v5.1.2) draw it (claimed, not checked against data); the crossing's strip has no outline (listed). No accuracy is stated."

[[piece]]
id = "sg-dem"
label = "SG DEM 20 m (2017 composite)"
method = "file"
class = "claimed"
url = "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/v5.1.2/geojson/ne_10m_admin_0_map_subunits.geojson"
filter = { SU_A3 = ["SGG"] }
tolerance_m = 200
[piece.metrics]
surface = "surface"
spacing_m = 20
year = 2017

[[piece]]
id = "crossing-dem"
label = "Shackleton Crossing DEM 5 m (WorldView-1, 2013-14)"
method = "none"
why = "the coverage is in a CRS the server can't name (EPSG:404000), so its mask can't be placed, and no outline of the crossing's strip is published"
[piece.metrics]
surface = "surface"
spacing_m = 5
year = 2014
