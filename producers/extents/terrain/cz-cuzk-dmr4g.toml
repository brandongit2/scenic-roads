name = "ČÚZK DMR 4G and DMP OK"
credit = "ČÚZK (Český úřad zeměměřický a katastrální)"
licence = "CC-BY-4.0"
licence_url = "https://creativecommons.org/licenses/by/4.0/"
source = "https://geoportal.cuzk.gov.cz/SDIProCSW/service.svc/get?REQUEST=GetRecordById&SERVICE=CSW&VERSION=2.0.2&OUTPUTSCHEMA=http://www.isotc211.org/2005/gmd&ELEMENTSETNAME=full&Id=CZ-CUZK-DMR4G-V"
theme = "terrain"
availability = "open"
notes = "The national bare-earth model as a 5 × 5 m grid (DMR 4G: generated in 2016 from the DMR 5G for the whole country, 78,866 km² as its record states, and updated as the DMR 5G is, from the 2009 to 2013 lidar and the surveys since; LAZ and GeoTIFF by SM5 sheet), and the surface model made by image correlation (DMP OK, \"Digitální model povrchu České republiky z obrazové korelace\": first made from the aerial survey photographs of 2024, taken primarily for Ortofoto ČR, and updated with its two-year cycle; CC BY 4.0, no charge), published as a point cloud arranged in a regular 0.2 × 0.2 m grid (LAZ) and as a 0.5 × 0.5 m raster interpolated from it (TIFF), as its record states. Each one's extent: the SM5 sheets (2.5 × 2 km) its ATOM download service lists (DMR4G-SJTSK, DMPOK-SJTSK-TIFF, DMPOK-SJTSK-LAZ), each entry's GeoRSS box. The DMP OK record's coverage, \"50 % of the Czech Republic territory, i.e. 39,433 km²\" (revised 3 April 2026), lags its feeds: each lists all 16,301 sheets, each with its file (the entries of October 2025 and April 2026). The year each DMR 4G area was last updated is in the agency's metadata service (Metadata/MapServer layer 20, `rok`, 2010 to 2026), which answers every query without geometry (GeoJSON, Esri JSON, its own CRS, generalized): so no year is stated here; the DMP OK's photographs are of 2024 and 2025 (its record's temporal extent), a sheet's year not stated. The DMR 4G record states a total mean height error of 0.3 m in open and 1 m in forested terrain, two figures for one grid: left out; the DMP OK's states none. The DMR 5G (a TIN of the ground points, 0.18 m and 0.3 m) and the DMP 1G (a TIN of the lidar's surface points, 2009 to 2013, no longer provided from 1 January 2027, replaced by the DMP OK) state no grid spacing or point density, so no score: not pieces."

