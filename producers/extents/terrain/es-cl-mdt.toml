notes = "The Junta's 5 m bare-earth model of Castilla y León, 2008 to 2011: the south-west quadrant from stereo-correlation of digital images edited in 3D (\"Error Medio Cuadrático\" around 80 cm), the north-west, north-east and south-east from the PNOA's first-coverage lidar (around 20 cm; the IGN-CNIG's MDT05 there, es-pnoa's). Published as one zipped GeoTIFF per province (no index or footprint beyond its WMS layer and the record's box), so its extent is the area it states, Castilla y León, as Natural Earth's 1:10m administrative areas (v5.1.2) draw it: claimed, not checked against data. Its accuracy differs by quadrant, with no outline of them, so none is stated."

