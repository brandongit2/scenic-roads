name = "ARSO Lasersko skeniranje Slovenije 2011–2015"
credit = "Agencija Republike Slovenije za okolje (ARSO), LSS"
licence = "CC-BY-4.0 (as Mapterhorn reads ARSO's terms; ARSO's own page was unreachable)"
