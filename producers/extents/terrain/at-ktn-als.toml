notes = "Carinthia's second lidar campaign, 2022 to 2029, published as open data: its record lists the sheet indexes of its raster products and point clouds with flight dates and download URLs (ALS2_RASTER_FLUGDATUM_KTN.zip, ALS2_PUNKTE_FLUGDATUM_KTN.zip on gis.ktn.gv.at), but the host answered nothing on 13 Nov 2026 (connections timed out from both Macs), the Wayback Machine holds no copy, and the record states no grid. The BEV's 1 m model already holds the areas flown in 2022 and 2023 (at-bev-als-dgm). The Land's open 5 m and 10 m models (2006 to 2015) are coarser than the BEV's: not declared."

