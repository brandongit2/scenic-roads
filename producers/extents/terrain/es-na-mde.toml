name = "Gobierno de Navarra Modelos Digitales de Elevaciones"
credit = "Gobierno de Navarra"
licence = "CC-BY-4.0"
licence_url = "https://filescartografia.navarra.es/6_MDE/_leeme.txt"
source = "https://filescartografia.navarra.es/6_MDE/"
theme = "terrain"
availability = "open"
notes = "Navarre's own bare-earth models (MDT) and surface models (MDS, \"el terreno como si sobre él se arrojara una sábana\"), a block each, on the government's open file server as one zipped ASCII grid per 1:10,000 sheet of the grid it publishes beside them (Malla_IGN_10000_EPSG25830.zip, 400 sheets, its `E10_IGN` the sheet in each file's name), heights orthometric (EGM2008_REDNAP), EPSG:25830. The 0.5 m models of 2017 (Leica single-photon lidar, 14 points/m²) and 2024 (Optech Galaxy T2000, 5 points/m²): each model's listing (MDT and MDS alike) names 401 sheets, the grid's 400 and 0243_43 (the enclave of Petilla de Aragón), which the grid lacks, so it's left out (about 19 km²). The 12.5 cm MDT and MDS of the Pamplona area (2020, 88 quarter-sheets of the grid's 1:10,000 sheets) has no outline: its quarters are named, not drawn, so it's listed, not drawn. The 2 m models of 2011-12 and 2014 are left out (the 0.5 m ones cover them)."

