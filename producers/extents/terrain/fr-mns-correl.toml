notes = "IGN's 0.5 m surface model made by image correlation of the BD ORTHO's aerial photographs (image-matched, not lidar: the ground with its vegetation and buildings), served by the Géoplateforme's raw-value WMS (ELEVATION.ELEVATIONGRIDCOVERAGE.HIGHRES.MNS, a GeoTIFF of heights per request, as LiDAR HD's tiles are) and WMTS. \"Le produit couvre l'ensemble du territoire français métropolitain et ultramarin (sauf la Polynésie Française, la Nouvelle-Calédonie et Wallis et Futuna)\", but the ZICAD (no-fly zones, nodata), as its data.gouv.fr record states, with no index or footprint published: its extent is that area, metropolitan France and the overseas departments (Natural Earth's France), Saint-Pierre-et-Miquelon, Saint-Barthélemy and Saint-Martin, as Natural Earth's 1:10m administrative areas (v5.1.2) draw it: claimed, not checked against data (the French Southern Lands and Clipperton, which the statement doesn't name and the BD ORTHO isn't said to cover, left out). It is updated by département every 3 to 4 years with the BD ORTHO's flights, with no date by département published: no year is stated, nor an accuracy."

