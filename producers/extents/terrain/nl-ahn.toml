source = "https://www.ahn.nl/dataroom"
theme = "terrain"
availability = "open"
notes = "The Netherlands' height model, its 0.5 m bare-earth and surface models (DTM, maaiveldmodel; DSM, oppervlaktemodel) by version, each a block of its own (`-dsm` the surface model's). AHN4: the 1,373 sheets of 5 × 6.25 km of PDOK's ATOM feeds (dtm_05m and dsm_05m, each file's own bbox), flown 30 November 2019 to 25 March 2022 as its dataset record (NGR 41daef8b-155e-4608-b49c-c87ea45d931c) states, CC0. AHN5, published in the three western parts (2 October 2024), and AHN6, its first part (the north-east, 13 October 2025) and the sheets flown in 2026 since: the bladwijzer's sheet indexes (AHN's own OGC API Features collections on Ellipsis Drive, linked from the dataroom), AHN5's 5 × 6.25 km sheets and AHN6's 1 × 1 km ones, each sheet's year the one its model's file name opens with (2023_M_37FZ2.TIF, AHN6_2025_R_207000_445000.TIF), a sheet without that model's file left out (AHN6's 792 sheets with a point cloud and no DTM, over water: no ground; fewer have no DSM). AHN5 and AHN6 are CC BY 4.0, AHN4 CC0: the declaration states the more restrictive. The 5 m DTMs and DSMs cover the same sheets and are left out. AHN states its points' accuracy as at most 5 cm standard deviation and 5 cm systematic error, not an RMSE of the model: left out."

