name = "IDE Uruguay modelos digitales de terreno y superficie"
credit = "Infraestructura de Datos Espaciales (IDE), Presidencia de la República, Uruguay"
licence = "Licencia de Datos Abiertos - Uruguay"
licence_url = "https://www.agesic.gub.uy/innovaportal/file/6327/1/licencia-de-datos-abiertos.pdf"
source = "https://catalogodatos.gub.uy/dataset/ide-ortoimagen-mdt-de-cobertura-nacional"
theme = "terrain"
availability = "open"
notes = "The national spatial data infrastructure's elevation models from its photogrammetric flight of 2017 and 2018 (UltraCam Eagle Prime, 32 cm GSD; correlation with Match-T edited with breaklines, EGM2008 heights), each GeoTIFF and LAS file downloaded without a login, its sheet grid a GeoJSON on the national data catalogue with each sheet's links: the national hydrologically consistent terrain model (MDTHC), a 2.5 m grid in 6,597 sheets of 3'45\" × 2'30\" (1:10,000; \"Exactitud absoluta vertical: 1.5 metros al 95% de confianza\", not an RMSE: left out); and in 86 towns (`localidad`), 2,753 sheets of 37.5\" (1:2,000), the urban terrain model, a 1 m grid, and surface model, a 10 cm grid (both 0.3 m at 95 %, left out); and the flight of December 2025 over Minas (Lavalleja): its surface model, a 10 cm grid (its files' own cell, read from a header), in 47 sheets, and the point cloud of four heritage blocks (its density not stated). Minas's terrain model of those blocks is one zip with no index (not read). Pieces: the national grid; a piece per town."

