name = "MERIT DEM"
credit = "Yamazaki, D. et al., University of Tokyo (MERIT DEM), from SRTM, AW3D30 and Viewfinder Panoramas"
licence = "CC-BY-NC-4.0 or ODbL-1.0 (dual)"
licence_url = "https://global-hydrodynamics.github.io/MERIT_DEM/"
source = "https://global-hydrodynamics.github.io/MERIT_DEM/"
theme = "terrain"
availability = "login"
notes = "A 3 arc-second (90 m) surface model of the land from 90° N to 60° S, the SRTM's, AW3D30's and Viewfinder Panoramas' models with their absolute bias, stripes, speckle and tree heights removed; its 30° packages download with a password given after a registration form, so it is claimed over the land north of 60° S as Natural Earth's 1:10m admin-1 areas (v5.1.2, public domain) draw it, Antarctica left out, at a 5 km tolerance (islands under 25 km² dropped as specks): claimed, not checked against data. Its years are its inputs' (to 2011)."

