name = "MERIT DEM"
credit = "Yamazaki, D. et al., University of Tokyo (MERIT DEM), from SRTM, AW3D30 and Viewfinder Panoramas"
licence = "CC-BY-NC-4.0 or ODbL-1.0 (dual)"
licence_url = "https://global-hydrodynamics.github.io/MERIT_DEM/"
source = "https://global-hydrodynamics.github.io/MERIT_DEM/"
theme = "terrain"
availability = "login"
notes = "A 3 arc-second (90 m) surface model of the land from 90° N to 60° S, the SRTM's, AW3D30's and Viewfinder Panoramas' models with their absolute bias, stripes, speckle and tree heights removed; its 30° packages download with a password given after a registration form, so it is claimed over the land north of 60° S as the Copernicus DEM's GLO-90 list gives it (`cop-dem`: 1° tiles, each holding land; those whose south-west corner is at 61° S or beyond left out), the land with a margin of up to a tile: claimed, not checked against data. Its years are its inputs' (to 2011)."

[[piece]]
id = "merit"
label = "MERIT DEM"
method = "listing"
class = "claimed"
list = "lines"
url = "https://copernicus-dem-90m.s3.amazonaws.com/tileList.txt"
pattern = '_(?P<ns>N|S(?!6[1-9]|[7-9]\d))(?P<y>\d+)_00_(?P<ew>[EW])(?P<x>\d+)_00_DEM'
size = 1
tolerance_m = 10
[piece.metrics]
surface = "surface"
spacing_m = 90
year = 2011
