name = "swissSURFACE3D"
credit = "Federal Office of Topography swisstopo"
licence = "swisstopo OGD terms of use (free use, commercial included; source reference mandatory)"
licence_url = "https://www.swisstopo.admin.ch/en/terms-of-use-free-geodata-and-geoservices"
source = "https://www.swisstopo.admin.ch/en/height-model-swisssurface3d-raster"
theme = "terrain"
availability = "open"
notes = "swisstopo's airborne lidar of Switzerland and Liechtenstein, as its two STAC collections' items, a 1 km tile each (LV95): swissSURFACE3D Raster (ch.swisstopo.swisssurface3d-raster), the 0.5 m surface model (ground, vegetation, buildings, bridges and water classes; a cloud-optimized GeoTIFF a tile), and swissSURFACE3D (ch.swisstopo.swisssurface3d), the classified point cloud it is made from (a zipped LAS or a COPC a tile). An item's year is its `datetime`'s, the year in its id. A tile re-flown in the six-year cycle keeps its earlier item beside the new one, so only each tile's newest item is read (`latest`, by the tile's number in its id). The point cloud's spacing is its stated minimum density's nominal spacing (1/√density): \"Minimum 15 pts/m²\" for the data from 2024 on (eastern Switzerland), \"Minimum 5 pts/m²\" for the data until 2024 (the canton of Bern included), a block each by the item's year; a point cloud holds ground and surface both, so states no `surface`. The accuracy is stated at 1 sigma (±10 cm in height for the raster), not as an RMSE: left out. The bare-earth model of the same flights is ch-swissalti3d's."

[[piece]]
id = "dsm"
label = "swissSURFACE3D Raster 0.5 m"
method = "stac"
url = "https://data.geo.admin.ch/api/stac/v1/collections/ch.swisstopo.swisssurface3d-raster"
page = 100
latest = { field = "id", pattern = '\d{4}-\d{4}$', order = "datetime" }
tolerance_m = 50
[piece.metrics]
surface = "surface"
spacing_m = 0.5
year = { field = "datetime", date = "iso" }

[[piece]]
id = "points-2024"
label = "swissSURFACE3D point cloud, from 2024 (min. 15 pts/m²)"
method = "stac"
url = "https://data.geo.admin.ch/api/stac/v1/collections/ch.swisstopo.swisssurface3d"
page = 100
latest = { field = "id", pattern = '\d{4}-\d{4}$', order = "datetime" }
filter = { datetime = ["2024-01-01T00:00:00Z", "2025-01-01T00:00:00Z", "2026-01-01T00:00:00Z"] }
tolerance_m = 50
[piece.metrics]
spacing_m = 0.258
year = { field = "datetime", date = "iso" }

[[piece]]
id = "points"
label = "swissSURFACE3D point cloud, until 2024 (min. 5 pts/m²)"
method = "stac"
url = "https://data.geo.admin.ch/api/stac/v1/collections/ch.swisstopo.swisssurface3d"
page = 100
latest = { field = "id", pattern = '\d{4}-\d{4}$', order = "datetime" }
exclude = { datetime = ["2024-01-01T00:00:00Z", "2025-01-01T00:00:00Z", "2026-01-01T00:00:00Z"] }
tolerance_m = 50
[piece.metrics]
spacing_m = 0.447
year = { field = "datetime", date = "iso" }
