name = "TanDEM-X PolarDEM 90m of Antarctica"
credit = "German Aerospace Center (DLR)"
licence = "DLR's TanDEM-X data licence (not read)"
licence_url = "https://geoservice.dlr.de/web/datasets"
source = "https://geoservice.dlr.de/web/datasets"
theme = "terrain"
availability = "login"
notes = "DLR's edited 90 m surface model of the whole Antarctic continent from TanDEM-X radar interferometry (Wessel et al., The Cryosphere 15, 5241, 2021), in Antarctic polar stereographic, from DLR's EOC Geoservice after registering. Its extent is the continent it states it covers, as the Copernicus DEM's GLO-90 list (`cop-dem`, from the same mission) gives the land south of 60° S, its 1° tiles each holding land or ice: claimed, not checked against data. Its year is the paper's (its acquisitions' dates weren't read). No accuracy is stated per piece."

[[piece]]
id = "polardem"
label = "TanDEM-X PolarDEM 90 m"
method = "listing"
class = "claimed"
list = "lines"
url = "https://copernicus-dem-90m.s3.amazonaws.com/tileList.txt"
pattern = '_(?P<ns>S)(?P<y>6[1-9]|[7-9]\d)_00_(?P<ew>[EW])(?P<x>\d+)_00_DEM'
size = 1
tolerance_m = 10
[piece.metrics]
surface = "surface"
spacing_m = 90.0
year = 2021
