notes = "Local models found in East Africa and the Indian Ocean, none with an outline: a 20 m InSAR DEM of the Maasai Mara catchment (Kenya; open.africa, open); the World Bank's 2019 comparison of UAV lidar and photogrammetry DTMs (0.25 m) on a 4 km² site of the lower Msimbazi in Dar es Salaam, no data released; a 5 m DEM used for UKCEH's Kampala flood model, not provided; a 1 m lidar DSM over part of Antananarivo used by CIRAD, not released; and a drone DEM of Aldabra's arm01 (Seychelles, flown 2022, on Zenodo, open). Listed."

