source = "https://catalogue.data.wa.gov.au/dataset/christmas-island-dem-2011"
theme = "terrain"
availability = "open"
notes = "The Commonwealth's lidar of the Indian Ocean Territories, flown by AAM in August 2011 (Christmas Island 24 to 26 Aug, the whole of the Cocos (Keeling) Islands 8 to 16 Aug): 1 m bare-earth DEMs (\"vertically accurate to 15cm\", not stated as an RMSE), each one zip on Landgate's catalogue (457 MB for Christmas Island). Each covers its whole island group as the record states, so its extent is the territory as Natural Earth's 1:10m administrative areas (v5.1.2) draw it: claimed, not checked against data."

