notes = "The city's bare-earth model of 2019, an elevation image service (OMI/OMI_DMT_2019_elevation: 0.25 m pixels, S-JTSK) and downloads (TIFF, XYZ, DWG, DGN, ShapeFile, on the city's SharePoint), CC BY. Its catalogue record names its region, Brno, and no outline; the image service is one raster with no catalogue (its query refused) and only a bounding box (22.9 × 21.5 km, 493 km², against the city's 230); the TIFF download is a zip behind SharePoint (403 to a plain request). Natural Earth's administrative areas have no unit for the city (its region, South Moravia, would overstate it). So it has no outline: listed, not drawn. The lidar's density and the model's accuracy are not stated."

