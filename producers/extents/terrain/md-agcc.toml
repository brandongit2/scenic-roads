name = "AGCC Modelul Digital al Terenului"
credit = "Agenția Geodezie, Cartografie și Cadastru (AGCC), Republica Moldova"
licence = "no conditions stated (INSPIRE record: \"noLimitations\", \"noConditionsApply\")"
licence_url = "https://geodata.gov.md/geoserver/DTM/wcs?service=WCS&request=GetCapabilities"
source = "https://geodata.gov.md/geoserver/DTM/wcs?service=WCS&request=GetCapabilities"
theme = "terrain"
availability = "open"
notes = "The land agency's terrain models, served by the national geoportal's GeoServer: its DTM workspace's WCS (geodata.gov.md/geoserver/DTM/wcs; the server-wide WCS and WFS answer \"disabled\", the workspace's answers): \"DTM Moldova 2007, (5m)\" (DTM__DTM_5m, made by INGEOCAD from an aerial survey, its INSPIRE record saying the left bank of the Dniester isn't in it, though the coverage has values there: its mask holds 1,965 of the 1,981 km² Natural Earth draws for the left bank), \"DTM 2020, Centru\" and \"DTM 2021, Sud\" (5 m) and the Plaiul Fagului reserve's (0.5 m), all in MOLDREF99 (EPSG:4026), their cells as each coverage's DescribeCoverage states. Each coverage's extent is its valid data (nodata −32767) in a GetCoverage asked for at a coarse scale (SCALEFACTOR, each a GeoTIFF of a few hundred kB): `files`, its grain the coarse cell; the spacing is the coverage's own, not the coarse answer's. No accuracy is stated."

