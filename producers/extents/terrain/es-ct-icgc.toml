name = "ICGC Models d'elevacions"
credit = "Institut Cartogràfic i Geològic de Catalunya (ICGC)"
licence = "CC-BY-4.0"
licence_url = "https://www.icgc.cat/en/Geoinformation-and-Maps/Data-and-products/Elevations/Territorial-elevations/Elevation-models"
source = "https://datacloud.icgc.cat/datacloud/model-elevacions-terreny/tif_unzip/"
theme = "terrain"
availability = "open"
notes = "Catalonia's bare-earth and surface models, each one GeoTIFF on the institute's open directories (no login), each file's own header and its mask at an overview saying where it has data and at what cell. The bare-earth models (model-elevacions-terreny/) from the ICGC's territorial lidar (third coverage, flown 2021 to 2023, at least 8 points/m²): the 0.5 m model of all Catalonia (model-elevacions-terreny-lidar-catalunya-50cm-2021-2023.tif, 421,964,204,579 bytes) and the 0.25 m model of the Barcelona metropolitan area (…-lidar-amb-25cm-2022-2022.tif). The surface models (model-superficies/, \"buildings, vegetation, street furniture\"): the 1 m model from the same lidar (model-superficies-lidar-catalunya-1m-2021-2023.tif), the 0.25 m one of the metropolitan area's 2022 lidar (…-lidar-amb-25cm-2022-2022.tif), and the newest of the annual 1 m models made by image correlation of the year's Catalonia-wide photo flight (…-correlacio-catalunya-1m-2024-2024.tif: image-matched, not lidar; those of 2018 to 2023 cover the same and are older, left out). The 1 m and 5 m bare-earth models of the same flights, and the 2 m one of 2008 to 2011, cover what the 0.5 m one does and are left out. The lidar's altimetric RMSE of about 6 cm (in flat, low-vegetation areas) is the point cloud's, not the models' stated accuracy, and is left out."

