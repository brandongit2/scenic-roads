id = "dtm-50cm"
label = "MET lidar Catalunya 50 cm 2021-2023"
method = "raster"
urls = ["https://datacloud.icgc.cat/datacloud/model-elevacions-terreny/tif_unzip/model-elevacions-terreny-lidar-catalunya-50cm-2021-2023.tif"]
mask_m = 100
tolerance_m = 100
