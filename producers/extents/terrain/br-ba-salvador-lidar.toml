  "https://geoservicos.inde.gov.br/geoserver/BAPSalvador/wcs?service=WCS&version=2.0.1&request=GetCoverage&coverageId=BAPSalvador__MDT_Lote_02&format=image/tiff&SCALEFACTOR=0.01",
  "https://geoservicos.inde.gov.br/geoserver/BAPSalvador/wcs?service=WCS&version=2.0.1&request=GetCoverage&coverageId=BAPSalvador__MDT_Lote_03_Continental&format=image/tiff&SCALEFACTOR=0.01",
  "https://geoservicos.inde.gov.br/geoserver/BAPSalvador/wcs?service=WCS&version=2.0.1&request=GetCoverage&coverageId=BAPSalvador__MDT_Lote_03_Ilha_Frades&format=image/tiff&SCALEFACTOR=0.01",
  "https://geoservicos.inde.gov.br/geoserver/BAPSalvador/wcs?service=WCS&version=2.0.1&request=GetCoverage&coverageId=BAPSalvador__MDT_Lote_03_Ilha_Mare&format=image/tiff&SCALEFACTOR=0.01",
]
