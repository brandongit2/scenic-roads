availability = "closed"
notes = "The Balearic government's 2 m bare-earth model from the 2014 lidar (MDT_LIDAR_2014_2x2), served only as the mosaic of its map service: no download of the grid was found (the IDEIB's download folders answer 403, and the service draws images). The mosaic's rasters are the five islands' (Mallorca, Menorca, Eivissa, Formentera, Cabrera, the footprint layer's names, its geometry not returned) and its boundary layer is boxes over the sea (11,119 km²), so its extent is the area it covers, the Balearic Islands, as Natural Earth's 1:10m administrative areas (v5.1.2) draw them: claimed, not checked against data. The islands' heights are on local mean sea level."

