name = "Tasmania Statewide 2m DEM; Tasmanian LiDAR projects"
credit = "The LIST © State of Tasmania (Mineral Resources Tasmania; Department of Natural Resources and Environment Tasmania)"
licence = "CC-BY-3.0-AU"
licence_url = "https://data.gov.au/data/dataset/dc463cd1-9b03-48fd-875b-a554f983e69a"
source = "https://services.thelist.tas.gov.au/arcgis/rest/services/Public/Indexes/MapServer/97"
theme = "terrain"
availability = "open"
notes = "Mineral Resources Tasmania's statewide 2 m DEM of 14 Aug 2021, \"land area of Tasmania and most of the associated islands, but excluding Macquarie Island. Approximately 65% of the DEM is derived from LiDAR data ... Outside of LiDAR areas, the data resolution is 10 m\" (resampled to the 2 m grid): one cloud-optimized GeoTIFF of 95 GB (the Source Cooperative copy), its extent its valid data at an overview of about 500 m; its spacing is the grid's, 2 m, where a third is 10 m data. The state's lidar projects as the LIST's coverage index (all projects: 253 areas on 13 Nov 2026, the completed ones read), each its pulse density (`PPM`, \"4 pls/m²\": its nominal spacing) and year: point clouds, downloaded from ELVIS. Accuracies are stated at 68 or 95 %: left out."

[[piece]]
id = "dem-2m"
label = "Tasmania statewide 2 m DEM"
method = "raster"
urls = ["https://data.source.coop/alexgleith/tasmania-dem-2m/Tasmania_Statewide_2m_DEM_14-08-2021.tif"]
mask_m = 500
tolerance_m = 500
[piece.metrics]
surface = "ground"
spacing_m = { field = "res_m" }
year = 2021

[[piece]]
id = "lidar"
label = "Tasmanian lidar point clouds"
method = "arcgis"
class = "service"
url = "https://services.thelist.tas.gov.au/arcgis/rest/services/Public/Indexes/MapServer/97"
filter = { STATUS = ["Completed"] }
by = ["PROJ_NAME", "AREA_NAME"]
name = "AREA_NAME"
tolerance_m = 50
[piece.metrics]
spacing_m = { field = "PPM", text = "pls", density = true }
year = { field = "YEAR", date = "year" }
