notes = "Iceland's national elevation model: a median mosaic of ArcticDEM's 2 m surface models (satellite stereo, 2008 onwards, most from 2012), co-registered to GLO-30, which fills its small gaps, \"one single DEM of Iceland\" (its record, dated 2020-02-23). The 2 m model downloads by cell from the national geoportal; its 10, 20 and 50 m resamples are single GeoTIFFs on the institute's FTP, with no overviews (the 10 m file 2.7 GB, a mask of it a whole download), and the geoportal's cells aren't a published layer of its WFS: claimed, Iceland as Natural Earth's 1:10m administrative areas (v5.1.2) draw it. Its stated accuracy, \"better than 0.5 m (Z)\" against drone lidar at five places, isn't an RMSE: left out. No national lidar is published."

