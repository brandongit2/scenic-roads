notes = "Estonia's bare-earth model (DTM) from the national airborne laser scanning, downloaded free by map sheet: its record states models of the whole country (\"kogu Eestimaa ulatuses\") at 1, 5, 10 and 25 m from the spring mapping flights, and 1 m from the low flights over towns; the geoportal says the latest models are made from the 2021 to 2024 scanning. No index of the 1 m files is published: the download page lists one sheet's files at a time, by its number (asking it sheet by sheet would be a crawl), its WCS (wcs-dtm) is one coverage, and the catalogue's records link no tile index. So its extent is the country the record states, as Natural Earth's 1:10m administrative areas (v5.1.2) draw Estonia: claimed, not checked against the sheets. No vertical accuracy is stated."

