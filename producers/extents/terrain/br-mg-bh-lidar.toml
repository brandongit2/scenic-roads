notes = "The city of Belo Horizonte's terrain model of the bare surface interpolated from its 2015 lidar (\"Mapa Altimétrico 2015\", a TIFF, EPSG:31983), and its point clouds of 2007 and 2015 (\"Nuvem de Pontos - MDT e MDS\"), downloaded from the BHGeo portal. Their cells and densities aren't stated, and no index of their files or outline of the city was read (Natural Earth's administrative areas don't draw the city): listed, not drawn."

