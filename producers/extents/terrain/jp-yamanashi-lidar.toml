id = "dem05"
label = "DEM 0.5 m (2019-22)"
method = "listing"
url = "https://japan-pointcloud.s3.ap-northeast-1.amazonaws.com"
list = "s3"
prefix = "Yamanashi/2024/03/LP/Grid/"
pattern = '/(?P<ref>08[A-Z]{2}\d{4})\.zip$'
grid = "jp-kihonzu"
crs = "EPSG:6676"
tolerance_m = 50
[piece.metrics]
surface = "ground"
spacing_m = 0.5
year = 2022

