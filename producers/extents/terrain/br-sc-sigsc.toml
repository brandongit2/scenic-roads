name = "Aerolevantamento do Estado de Santa Catarina (SIGSC) MDT and MDS"
credit = "Secretaria de Estado do Desenvolvimento Econômico Sustentável de Santa Catarina (SDE/SC), SIGSC"
licence = "free access (\"O acesso ao dado é livre.\")"
licence_url = "https://web.archive.org/web/2026/https://sigsc.sc.gov.br/1_Metadados_Matriciais_v1.pdf"
source = "https://sigsc.sc.gov.br/"
theme = "terrain"
availability = "login"
notes = "The state of Santa Catarina's aerial survey of 2010 to 2012 (flights 22 January 2010 to 3 July 2012, published 20 May 2016; orthomosaics of 0.39 m over 97,037 km²): a terrain model (\"Representa o relevo sem a presença de feições artificiais ou vegetais\") and a surface model, both by image matching, \"resolução espacial de 1,00 metro, precisão altimétrica de 1,00 metro\" (a precision, not stated as an RMSE: left out), in 1:50,000 sheets, SIRGAS 2000 UTM 22S. \"O acesso ao dado é livre\", but the download page shows a gov.br login (its July 2026 capture), and the SIGSC host didn't answer from this network or the Mac mini: login. Its extent is the state the survey covers, as Natural Earth's 1:10m administrative areas (v5.1.2) draw it: claimed, not checked against data."

[[piece]]
id = "mdt"
label = "MDT 1 m (2010-2012, image matching)"
method = "file"
class = "claimed"
url = "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/v5.1.2/geojson/ne_10m_admin_1_states_provinces.geojson"
filter = { adm0_a3 = ["BRA"], name = ["Santa Catarina"] }
tolerance_m = 200
[piece.metrics]
surface = "ground"
spacing_m = 1
year = 2012

[[piece]]
id = "mds"
