notes = "Saitama Prefecture's airborne lidar of its mountain areas, flown in 2024 (\"令和6年に取得したデータ\"), CC BY 4.0: per 1:2,500 base map sheet, ZIPs of LAS in the public bucket its download page links (japan-pointcloud, Saitama/2025/01/LP/Sabo, a folder per area: 09jb852.zip), each sheet placed by its code (JGD2011, plane rectangular zone IX): 2,000 by 1,500 m. The points state no density, so no spacing; a point cloud states no surface. Its river and road point clouds (named by river and route, not by sheet) aren't declared."

