notes = "The survey authority's terrain models (its DTM page): from aerial photogrammetry, heights on 5 m, 10 m and 25 m grids with breaklines (the 2007–2010 survey's model updated from that of 2011–2013); and from lidar, a high-precision 1 m DTM of the Tisa floodplain (about 2,920 km², flown 2012, mean height accuracy 0.07 m). A lidar DTM of 74 flood areas (about 9,427 km²) is being made (IPA II 2014) and is not a piece. Issued for the administrative fees. The page doesn't state the photogrammetric model's coverage, and none of them has a published outline: listed, not drawn."

