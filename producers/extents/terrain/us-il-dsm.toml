name = "Illinois Height Modernization lidar DSMs (ISGS)"
credit = "Illinois State Geological Survey (Illinois Height Modernization Program), with the counties"
licence = "not stated (the ISGS Clearinghouse's free download); Cook County's derivatives are stated as the county's, not to be redistributed without its consent"
licence_url = "https://clearinghouse.isgs.illinois.edu/data/elevation/illinois-height-modernization-ilhmp-lidar-data"
source = "https://data.isgs.illinois.edu/arcgis/rest/services/Elevation/IL_Statewide_Lidar_DSM/ImageServer"
theme = "terrain"
availability = "open"
notes = "The ISGS's statewide lidar surface model, an image service (download enabled) mosaicking each county's newest DSM (103 rasters, 2017 to 2024; its older county DSMs, as separate services, are older editions over the same areas: not declared), each raster's cell 1, 1.5 or 2 ft (0.3048, 0.4572, 0.6096 m: its catalogue's `LowPS`) and its year in its name (wood_dsm_2022). Its catalogue's footprints are the rasters' boxes, reaching well beyond their counties, so a block per cell and year: its rasters' valid data in an exportImage of the state locked to them (`lockRasterIds`) at 250 m cells of the service's Web Mercator grid (about 190 m on the ground), whose cells without data are 0 with no nodata marked (`nodata`). The bare-earth DEMs of the same surveys are 3DEP's 1 m DEM (`usgs-3dep`). No accuracy is stated for the DSMs."

