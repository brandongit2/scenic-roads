theme = "terrain"
availability = "open"
notes = "England's lidar bare-earth models, from the agency's survey index catalogues (the Defra Data Services Platform's WFS, EPSG:27700): the National LIDAR Programme's 1 m DTM, its 5 km tiles by the year flown (302 survey blocks flown January 2017 to February 2023, then repeat surveys of some blocks); the 2022 LIDAR Composite DTM at 1 m and at 2 m, each by the extents of the surveys it was made from (June 2000 to April 2022) and their year (the composite's own `resolution` field is its survey's, resampled to the composite's grid; every survey in it \"had a vertical accuracy of +/-15cm RMSE\", the record says); and the time-stamped archive's survey DTMs finer than 1 m (`resolution` 0.5 and 0.25: its 1 m and 2 m surveys are in the composites), each survey's extent by year. The composites cover \"~99% of England\"; the WFS answers GeoJSON in EPSG:27700. The time-stamped archive's 1 m count by `resultType=hits` times out, so each finer block asks for its own resolution."

