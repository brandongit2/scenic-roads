availability = "open"
notes = "The region's \"DTM 5X5 - Modello digitale del terreno (ed. 2015)\", from its topographic database (contours, spot heights, break lines) and lidar along watercourses: one file of the region, DTM5_RL.img in a 3.09 GB zip (its central directory read by range request), with no header readable short of a whole download; so its extent is the region, as Natural Earth's 1:10m administrative areas (v5.1.2) draw it: claimed, not checked against data. The region's own lidar is partly for public bodies only; its open lidar is the ministry's PST-A (it-pst-lidar)."

