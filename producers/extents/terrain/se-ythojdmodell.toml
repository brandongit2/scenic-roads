notes = "The national surface model matched from the aerial photographs of the national image supply programme (Nationella bildförsörjningsprogrammet): \"Ythöjdmodellen skapas genom flygbildsmatchning\" (image matching, not lidar), the tops of vegetation and buildings, the ground where nothing stands on it, a 2.5D grid thinned and resampled to 0.25 or 0.5 m where the photographs' ground resolution is 0.15 or 0.25 m (0.5 or 1 m from photographs of 0.37 or 0.48 m), holes filled by interpolation from 2019 (its metadata record, geodata.se f4945139-3c9b-4237-bf48-899ff7124714; new data added each year as photographs come in). Its 2.5 km tiles: the items of Lantmäteriet's STAC collection dsm-cog (a cloud-optimised GeoTIFF each, SWEREF 99 TM), by the year flown (`flygar`) and the cell stated (`upplosning`); each year's photographs cover a part of the country, so a year's tiles are its own piece, beside other years' over the same places. Its record states a fee and a licence (\"Avgift för användning av resurs tas ut\"), the collection's licence is \"other\", and its files answer 401 without a login: paid, so claimed. Read on the Mac mini: 149,614 items (2019 to 2026, every one 0.25 or 0.5 m), 150 requests, 997 MB; the pieces sum 935,353 km², the items' count × 6.25 km² 935,088. No vertical accuracy is stated."

