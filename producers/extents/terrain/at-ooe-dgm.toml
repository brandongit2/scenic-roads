theme = "terrain"
availability = "open"
notes = "Upper Austria's bare-earth model (DGM) and surface model (DOM, record ee5b70e2 on data.gv.at: \"Digitales Oberflächenmodell als 0,5m-Raster, abgeleitet aus den aktuellsten Airborne Laserscanning (ALS) Befliegungen\"), both at 0.5 m from the newest lidar flights (GeoTIFF and XYZ zips per municipality). Their pieces are the Land's own map of the newest flight behind each cadastral map sheet (HOEHENMODELL_AKTUELLE_FLUGJAHRE: 10,278 sheets, each with `DATE_LAST`, as 2015/04), by the flight's year (2014 to 2025): the DOM made from the same flights as the DGM. No accuracy is stated in the records."

