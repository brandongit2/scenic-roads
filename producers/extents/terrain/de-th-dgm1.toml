notes = "The state's bare-earth model, 1 m in 1 km tiles (EPSG:25832), from airborne laser scanning, published by survey period (1996-2006, 2010-2013, 2014-2019, 2020-2025; the period in each tile's name, dgm1_32_<east km>_<north km>_1_th_2020-2025). Its tile index couldn't be read on 13 Nov 2026: the download feed (geoportal.geoportal-th.de/dienste/atom_th_hoehendaten_dgm) and the periods' tile overviews (hoehendaten/Uebersichten/Stand_<period>.zip) answer the host's outage page, the Internet Archive holds the feed's top only, not its dataset feed nor the overviews, and the new portal (geoportal.thueringen.de) answers a CAPTCHA. The dataset's record states the model \"landesweit flächendeckend vorhanden\": its extent is Thüringen as Natural Earth's 1:10m administrative areas (v5.1.2) draw it, claimed, not checked against data. No year: which period covers where isn't known without the index. The feed states dl-de/by-2-0 and the record CC BY 4.0 (\"© GDI-Th\"): dl-de/by-2-0, the download service's own, kept. The laser point clouds (LAZ, 4 pts/m²) are the grid's source and make no piece of their own."

