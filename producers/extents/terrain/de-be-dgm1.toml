notes = "The city's bare-earth model, 1 m in 2 km tiles (EPSG:25833), with a buffer of about 250 m into Brandenburg: the INSPIRE download feed's 297 tile files (DGM1_<east km>_<north km>.zip, the south-west corner). The record states it from the airborne laser scan flown on 24 and 25 February and 2 March 2021, updated from the image flights of March 2022, April 2023, March 2025 and August 2025 by stereo plotting: the year is the laser survey's. Its accuracy is stated as ±10 cm + 5 % of the grid at 2 sigma, not an RMSE, so left out. The ALS point cloud (9.8 pts/m²) is the grid's source and makes no piece of its own."

