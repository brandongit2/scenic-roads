notes = "The Department of Infrastructure's lidar of the island, flown in 2013 \"covering all 572 square kilometres of the Island\", with terrain and surface models at 0.5, 1 and 2 m and the point cloud, resold by Bluesky under its 2016 contract with the Isle of Man Government (Bluesky's announcement, 7 September 2016). The government's own pages (gov.im, data.gov.im) answer \"Request Rejected\" to a script, and Bluesky's Mapshop pages read name no Isle of Man product, so the 2016 statement is the one read. Its extent is the island the statement names, as Natural Earth's 1:10m administrative areas (v5.1.2) draw it: claimed, not checked against data."

