notes = "Osaka Prefecture's ground points from its airborne lidar of FY2019 and FY2020, thinned to 0.5 m (4 points/m²), CC BY 4.0: ZIPs per municipality on the G-spatial record (105), each zip's members its map-level-1250 sheets (06pd6113_grd.txt: a 1:2,500 sheet's quarter's quarter, 1,000 by 750 m, plane rectangular zone VI), some with a sheet index (zk1250_*.shp). Of the zips' download links, 18 answered 500 on 13 Nov 2026 (93 of the 105 are stored under names the record mangled, www.geospatial.jp prepended), and the host's firewall then refused this client (403): the zips' central directories, read by range request with `list = \"zip\"` and `urls`, could be read once it answers. The DEM the record names isn't published on it. No accuracy is stated."

