name = "PACCSAP Pacific lidar 2012-13 (Papua New Guinea, Vanuatu, Samoa, Tonga)"
credit = "Geoscience Australia and the Pacific-Australia Climate Change Science and Adaptation Planning programme (AusAID); AAM; the partner governments"
