notes = "The Australian-funded lidar of 2012 and 2013, its products per the programme's factsheets a 1 m ground DEM, a 1 m DSM and 5 m seamless models: Papua New Guinea's north coast (Vanimo, Wewak, Madang, Lae and the coast between, flown 5 May to 13 Jul 2012, a mean point spacing of 0.43 m achieved; the final report is on the PNG SPREP portal, the DEM nowhere found), Vanuatu's Efate and Malekula (September to November 2012) and Espiritu Santo (May 2013, viewable only as a Google Earth KML, raw data on request to the VMGD), Samoa's Apia and Faleolo, Tonga's Tongatapu, Lifuka and Foa. No product or footprint is published: listed, a block a country."

