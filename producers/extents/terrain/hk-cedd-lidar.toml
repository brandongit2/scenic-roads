name = "CEDD Territory-wide Airborne LiDAR"
credit = "Geotechnical Engineering Office, Civil Engineering and Development Department (CEDD), The Government of the Hong Kong SAR"
licence = "CEDD order conditions (2013, for the 2010 set): use for the stated project only, no distribution"
licence_url = "https://www.ginfo.cedd.gov.hk/GEOOpenData/eng/LIDAR.aspx"
source = "https://www.ginfo.cedd.gov.hk/GEOOpenData/eng/LIDAR.aspx"
theme = "terrain"
availability = "closed"
notes = "CEDD's airborne lidar of all of Hong Kong's territories, flown 1 Dec 2010 to 8 Jan 2011 (fixed wing) and 19 Dec 2019 to 1 Feb 2020 (helicopter): point clouds (LAS) and 0.5 m grids of the ground (DTM) and surface (DSM), ordered through the CEDD Spatial Data Portal under conditions allowing use only for the stated project and no distribution (the 2020 set's terms weren't readable). Its extent is the territory, as its metadata states, as Natural Earth's 1:10m administrative areas (v5.1.2) draw it: claimed, not checked against data. No accuracy is stated."

