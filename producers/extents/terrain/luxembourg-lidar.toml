notes = "The country's bare-earth model (MNT) and surface model (MNS), each one cloud-optimized GeoTIFF of 0.5 m (40.1 and 42.8 GB): each file's own header and an overview say where it has data and at what cell. Flown February to April 2024. Its classified point cloud (COPC LAZ, \"> 30 pts/m² émis\": a nominal spacing of 1/√30, 0.1826 m; a point cloud holds ground and surface both, so states no `surface`) is a block of its own, its extent its tile index (lidar2024-ta.gpkg, the 10,905 500 m tiles its zips hold, LUREF)."

