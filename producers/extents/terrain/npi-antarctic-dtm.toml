theme = "terrain"
availability = "open"
notes = "The institute's terrain models of Norway's southern islands: Bouvetøya's DTM 20 (20 m, from the B20 map data, UTM 31S, made 5 Mar 2018), from Geonorge's download API, its extent the island as Natural Earth's 1:10m administrative areas (v5.1.2) draw it: claimed, not checked against data; and Peter I Øy's 20 m model from the contours and coastline of the P50 map data of 1987 (the record modified 3 Oct 2024; no licence stated), its record giving a bounding box only and Natural Earth drawing no area for the island: listed. Both are interpolated from map contours, bare earth."

