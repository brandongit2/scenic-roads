name = "Norwegian Polar Institute: Bouvetøya DTM 20; Peter I Øy terrain model (P0 Terrengmodell)"
credit = "Norwegian Polar Institute (Norsk Polarinstitutt)"
licence = "CC-BY-4.0 (Bouvetøya; Peter I Øy's record states none)"
licence_url = "https://data.npolar.no/dataset/63eaa452-c264-4bd8-8ebd-97e09e1a5a1a"
