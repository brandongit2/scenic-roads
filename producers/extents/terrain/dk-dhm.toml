notes = "The Danish elevation model (DK-DEM, DHM): the Agency for Climate Data states its terrain model as \"an 0.4m grid for the entire country\". Free under CC BY 4.0 (the agency's terms for its free geodata), downloaded from Dataforsyningen after creating a free user (its token): login, so claimed, Denmark as Natural Earth's 1:10m administrative areas (v5.1.2) draw it (its five regions; the Faroes and Greenland apart). The scan's year isn't stated on the agency's pages read (a third party's record gives 2014-2015 and another reports a 2025 version): left out."

