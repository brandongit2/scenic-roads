notes = "The AADC's 10 m DEM of Heard Island, made by interferometry from RADARSAT images of 17 Feb and 13 Mar 2002, merged with the 1997 stereo RADARSAT DEM and the island's coastline: a radar surface model. Its extent is Heard Island as the record states it, as Natural Earth's 1:10m administrative areas (v5.1.2) draw it, which hold the McDonald Islands (about 2.5 km², 44 km west) in the same area: claimed, not checked against data. No accuracy is stated."

