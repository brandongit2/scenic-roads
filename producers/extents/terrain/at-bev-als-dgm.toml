theme = "terrain"
availability = "open"
notes = "Austria's 1 m bare-earth model from the federal and Länder lidar, a mosaic made each year of the newest surveys (Stichtag 15 September; the 2025 mosaic's 55 tiles of 50 km, EPSG:3035, download with no login). Its pieces are the BEV's own map of the surveys behind the 2025 mosaic (Metadatenübersicht SHP DTM/DSM 20250915: each area's Land, `Gebiet`, and flight years, `Flugjahr`), by Land and year: the year the last of a span (2011-12: 2012; 'DTM:2019, DSM:2009': 2019, the DTM's). The mosaic's Stichtag is when it was made, not flown: not a year. Its accuracy is stated as ±0.50 m in height, more in high mountains, not as an RMSE: left out. The tiles' own headers and overviews would say where the mosaic has data but not when it was flown, so the survey map is the extent read (its pieces come to 83,975 km², Austria's 83,879). Of the Länder's own grids, only those finer (Burgenland, Oberösterreich, Tirol, Vorarlberg at 0.5 m) are declared apart: Salzburg's, Steiermark's and Wien's 1 m models are these surveys at this grid (Steiermark's 0.5 m grids of its campaign since 2022 are in none of its open services, which give 1 m), Niederösterreich's and Kärnten's open ones coarser (10 m, 5 m; Kärnten's campaign since 2022: at-ktn-als)."

