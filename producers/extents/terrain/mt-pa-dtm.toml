name = "Planning Authority Digital Terrain and Surface Models 2012"
credit = "Planning Authority, Malta"
licence = "CC-BY-4.0"
licence_url = "https://data.europa.eu/api/hub/search/datasets/e2df40e5-6dff-4571-a9c9-dc45f3db11e2"
source = "https://malta.coverage.wetransform.eu/dtm_1m_2012/ows?SERVICE=WCS&VERSION=2.0.1&REQUEST=DescribeCoverage&COVERAGEID=dtm_1m_2012"
theme = "terrain"
availability = "open"
notes = "The Planning Authority's INSPIRE 1 m terrain model (dtm_1m_2012) and surface model (dsm_1m_2012), a block each, from the airborne lidar of the ERDF156 project (flown 17 February 2012), WCS 2.0.1 coverages whose descriptions give a bounding box (the DTM's 426,534 to 461,821 E, 3,960,612 to 3,993,549 N, the DSM's 425,403 to 462,599 E, 3,958,819 to 3,994,763 N, ETRS89 / UTM 33N) holding Malta, Gozo and Comino; so their extent is the islands, as Natural Earth's 1:10m administrative areas (v5.1.2) draw it: claimed, not checked against data. data.europa.eu lists them under CC BY 4.0, the INSPIRE service records \"noConditionsApply\": the CC BY kept. The advertised 2018 models (0.15 m) hold 8-bit values, not heights: left out."

