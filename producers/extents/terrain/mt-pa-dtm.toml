notes = "The Planning Authority's INSPIRE 1 m terrain model from the airborne lidar of the ERDF156 project (flown 17 February 2012), a WCS 2.0.1 coverage whose description gives a bounding box (426,534 to 461,821 E, 3,960,612 to 3,993,549 N, ETRS89 / UTM 33N) holding Malta, Gozo and Comino; so its extent is the islands, as Natural Earth's 1:10m administrative areas (v5.1.2) draw it: claimed, not checked against data. data.europa.eu lists it under CC BY 4.0, its INSPIRE service records \"noConditionsApply\": the CC BY kept. The advertised 2018 model (0.15 m) holds 8-bit values, not heights: left out."

