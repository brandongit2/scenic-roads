notes = "GA's own surveys outside the states' indexes: Kakadu LiDAR 2011, a 1 m DEM from ground-classified lidar (about 2 points per m², 0.3 m vertical) of the West, South and East Alligator river systems in the Northern Territory, flown 22 Oct to 16 Nov 2011, its record giving only a bounding box (131.68 to 133.24° E, 13.09 to 11.89° S); and the Urban DEM Project's 5 m hydro-DEMs of 2008 to 2010 (Adelaide, Brisbane, the Gold Coast, the Hunter coast, Melbourne, Sydney, Perth to Bunbury; data.gov.au package 6acf3d07), zips with no footprint. Neither publishes an outline: listed. The Northern Territory's own portal holds no lidar or DEM; its surveys are in GA's 5 m DEM (au-ga-dem5m)."

