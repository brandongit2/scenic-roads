name = "tiris DGM and DOM 50 cm"
credit = "Amt der Tiroler Landesregierung, Abteilung Geoinformation (tiris)"
licence = "CC-BY-4.0"
licence_url = "https://creativecommons.org/licenses/by/4.0/"
