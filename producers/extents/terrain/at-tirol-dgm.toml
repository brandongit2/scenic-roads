theme = "terrain"
availability = "open"
notes = "Tyrol's bare-earth model (DGM) and surface model (DOM) at 0.5 m (GeoTIFF on 1:2,000 sheets of 1.25 km², with a WCS), both from the Land's second lidar scan, one record for both (\"Grundlage ... sind Airborne Laserscanning Daten und daraus generierte Gelände- bzw. Oberflächenmodelle mit 50cm Bodenauflösung\"). Their pieces are the Land's flight-year layer in its Laserscan Download app (als_flugjahr: 21 areas, each a `JAHR`, 2017 to 2023), by year. The app's sheet layer (als_tif: 11,278 sheets, each with its file's URL) is a finer tile index but holds no year: the flight-year areas are read instead. No accuracy is stated in the record; the classified point clouds are had on request at a charge: not declared."

