source = "https://www.jupem.gov.my/ms/carian/papar/post/104"
theme = "terrain"
availability = "paid"
notes = "The national survey department's elevation models for sale: DTM Semenanjung Malaysia (DTM_MY501T, 2017) and DTM and DSM Sabah dan Sarawak (DTM_MY511T, DSM_MY511T, 2008), each at a 10 m interval, sold through its product sales; the terms weren't read. Each piece's extent is the area its name states (the peninsula's states and federal territories; Sabah and Sarawak), as Natural Earth's 1:10m administrative areas (v5.1.2) draw it: claimed, not checked against data. Its open river-basin lidar entries (the Kelantan and Terengganu basins, 2016, CC BY on data.gov.my) are tables whose files the archive doesn't hold: listed. No accuracy is stated."

