notes = "CSIRO's lidar of Norfolk Island, flown by Landpro on 13 and 14 Sep 2019 (the whole island with Nepean and Phillip islands, a median of about 30 points per m²): a 0.5 m bare-earth DEM and a 1 m DSM, from CSIRO's Data Access Portal. Its extent is the island the record states it covers, as Natural Earth's 1:10m administrative areas (v5.1.2) draw it: claimed, not checked against data."

