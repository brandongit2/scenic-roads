notes = "The region's 5 m terrain model \"CTR2020 - DTM5K\", photogrammetric from the AGEA flights of 2020, over the whole region, served as an ArcGIS ImageServer (one raster, 5 m pixels, no catalogue to read), WMS and WCS; so its extent is the region, as Natural Earth's 1:10m administrative areas (v5.1.2) draw it: claimed, not checked against data. The ministry's PST-A 1 m (it-pst-lidar) covers some 71 % of it."

