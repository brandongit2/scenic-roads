notes = "The city's surface model, \"Digitales Raster-Oberflächenmodell (DOM) der Stadt Bern mit einer Auflösung von 25cm pro Pixel\" (its opendata.swiss record, with the city's geoportal, WMS and WMTS as its resources; its 2020 DOM, the same, is an older edition: not declared). The city's map server (map.bern.ch) answered every request, its geoportal and WMS capabilities too, with a 403 naming its security policy, so neither its coverage nor its download was read: its extent is the city as the record names it, the municipality of Bern as swisstopo's swissBOUNDARIES3D draws it (its current outline, through the federal geoportal's API), claimed, not checked against data. No year of flight is stated beyond the product's 2023; no accuracy is stated."

