notes = "The transport ministry's lidar of the town of Vergara (Treinta y Tres), where its survey of the arroyo Parao crosses route 18: \"La densidad de puntos es de 1 punto por metro cuadrado\" (a nominal spacing of 1 m), 20 LAZ tiles of 1 × 1 km in one zip (129 MB); the catalogue says a shapefile places them, but the zip holds only the tiles, each named by its south-west corner in km of UTM 21S (1km_784_6348.laz: its LAS header's bounds lie within 784–785 km E, 6,348–6,349 km N), read from the zip's member names. Its survey date isn't stated (the files date from March 2017)."

