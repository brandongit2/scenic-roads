id = "dtm-2023"
label = "Dem_2023 DTM 1 m"
method = "raster"
urls = ["http://inspire.mzh.government.bg:8080/geoserver/ows?service=WCS&version=2.0.1&request=GetCoverage&coverageId=RasterData__Dem_2023&format=image/tiff&SCALEFACTOR=0.0005"]
timeout_s = 600
mask_m = 1900
tolerance_m = 1000
[piece.metrics]
surface = "ground"
spacing_m = 1
year = 2023

