notes = "The City of Stockholm's planning office's lidar products, as its GeoNetwork catalogue's records describe them: SBK Höjdgrid (2023), a 1 m grid interpolated from airborne laser scanning \"over Stockholms stad\" of 22 April to 7 May 2023, at least 16 ground points/m² (heights under buildings and bridges interpolated); and SBK Punktmoln (2025), flown 1 to 3 April 2025, 16 points/m², with no grid of it catalogued. Both are ordered at a cost (\"Kostnaden beräknas enligt stadsbyggnadsnämndens taxa\"); the records state no licence. The area stated is the city (the municipality), which Natural Earth's 1:10m administrative areas don't draw (their Stockholm is the county, some 6,300 km², the city 188): listed, not drawn."

