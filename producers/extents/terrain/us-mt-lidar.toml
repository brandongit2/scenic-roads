credit = "Montana State Library (MSDI Elevation), with the projects' funding partners"
licence = "not stated (the State Library's free download)"
licence_url = "https://msl.mt.gov/geoinfo/msdi/elevation/"
source = "https://mslgis.mt.gov/arcgishosting/rest/services/GEOINFO/LidarInventory/MapServer/2"
theme = "terrain"
availability = "open"
notes = "The lidar projects' surface models the Montana Lidar Inventory lists, each a project-wide GeoTIFF mosaic (Mosaics/DSM.zip on the library's file server, 2 to 44 GB each): its `DSM` field says \"Available for Download\" (136 projects) or \"Request Only\" (5: `login`, claimed). Their extents are the inventory's own project outlines (its Lidar Projects layer; `service`), a piece per project, its year the layer's `Year_Collected`. The layer states no DSM cell: each downloadable mosaic's world file (DSM.tfw in its zip, read by range request on 13 Nov 2026) gives 1 m (96 projects) or 3 ft (0.9144 m, 39), hence a block for each naming its projects; Custer County's 2019 QL2 mosaic has no world file and its header is at the end of a 14 GB member: no spacing. The request-only projects' cells aren't stated. The bare-earth DEMs of the same surveys are 3DEP's 1 m DEM (`usgs-3dep`). The layer's vertical accuracies are the point clouds': left out."

