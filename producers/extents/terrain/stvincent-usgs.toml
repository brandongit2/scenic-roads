name = "Airborne lidar survey of St Vincent (USGS)"
credit = "U.S. Geological Survey"
licence = "CC0-1.0"
licence_url = "https://www.usgs.gov/data/airborne-lidar-survey-st-vincent-eastern-caribbean-following-2020-21-eruption-la-soufriere"
source = "https://www.usgs.gov/data/airborne-lidar-survey-st-vincent-eastern-caribbean-following-2020-21-eruption-la-soufriere"
theme = "terrain"
availability = "open"
notes = "The survey after the 2020-21 eruption of La Soufrière, flown December 2021 to February 2022 and released in February 2024: hydro-flattened bare-earth models at 0.6 m and 1 m, each the main island (its parishes; not the Grenadines), as two ScienceBase zips (1.38 GB and 3.74 GB) whose own extents aren't read. Its extent is the area the publisher states it covers, as Natural Earth's 1:10m administrative areas (v5.1.2) draw it: claimed, not checked against data."

[[piece]]
id = "dtm-0-6m"
label = "Bare-earth DEM 0.6 m"
method = "file"
class = "claimed"
url = "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/v5.1.2/geojson/ne_10m_admin_1_states_provinces.geojson"
filter = { adm0_a3 = ["VCT"], name = ["Charlotte", "Saint Andrew", "Saint David", "Saint George", "Saint Patrick"] }
tolerance_m = 200
[piece.metrics]
surface = "ground"
spacing_m = 0.6
year = 2022

[[piece]]
id = "dtm-1m"
label = "Bare-earth DEM 1 m"
method = "file"
class = "claimed"
url = "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/v5.1.2/geojson/ne_10m_admin_1_states_provinces.geojson"
filter = { adm0_a3 = ["VCT"], name = ["Charlotte", "Saint Andrew", "Saint David", "Saint George", "Saint Patrick"] }
tolerance_m = 200
[piece.metrics]
surface = "ground"
spacing_m = 1
year = 2022
