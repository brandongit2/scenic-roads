notes = "A wall-to-wall DSM and DTM of the Kruger National Park made by image matching from the NGI's DMC aerial imagery flown in September and October 2018, at 0.25 m (and resampled to 1 m and 5 m, the same models: not declared apart), on CEDA's archive without a login: 47 GeoTIFFs a product, one per NGI 1:50,000 sheet. The files have no overviews (a mask would be the 0.25 m files read whole) and the sheet index is a loose shapefile, so the extent is the park the record states it covers, as the WDPA's outline of it (UNEP-WCMC's service, site 873) draws it: claimed, not checked against data. No accuracy is stated per piece."

