name = "SIGTIERRAS Modelo Digital del Terreno (MDT) de Ecuador"
credit = "Ministerio de Agricultura y Ganadería (MAG), Programa SIGTIERRAS; Instituto Geográfico Militar"
licence = "CC-BY-NC-SA"
licence_url = "http://geoportal.agricultura.gob.ec/geonetwork/srv/spa/q?_content_type=json&any=MDT&fast=index&to=30"
source = "http://geoportal.agricultura.gob.ec/index.php/descarga-ortofotos"
theme = "terrain"
availability = "login"
notes = "The agriculture ministry's terrain model of Ecuador from the SIGTIERRAS aerial photography of August 2010 to October 2012, made as an input to the orthorectification (\"No está editado para fines hidrológicos\"): 3 m in the Sierra, 4 m on the Costa, 5 m in the Amazon (vertical 1.5 and 3 m, not stated as RMSEs: left out), in 1:5,000 sheets of about 5.3 km², \"Cerca de 43800 archivos TIFF cubren aproximadamente el 88% de la superficie del Ecuador\"; its full resolution is had at the ministry's offices, a 10 m resample through its download app's login, a 50 m version openly (one RAR). The ministry publishes one availability map for the orthophotos and the MDT; its file index is the orthophotos' (Fechas_orto.zip, a shapefile of 43,165 1:5,000 sheets, cp1252, SIRGAS 2000 UTM 17S, each sheet's capture dates), of which the sheets of aerial photographs (`observacio` ORTOFOTO, most dated 2010 to 2012, some 2005 to 2009 and 2013; the rest satellite images, with no MDT) are the MDT's: claimed on them, by the photographs' year (the index's sheets sum to about 86 % of the country, against the 88 % stated). The sheets' region isn't in the index, so each takes the coarsest of the three stated cells, 5 m. The open 50 m version's extent is continental Ecuador, as Natural Earth's 1:10m administrative areas (v5.1.2) draw it (claimed). Galápagos isn't in it."

[[piece]]
id = "mdt"
label = "MDT 3 to 5 m (2010-2012 photogrammetry)"
method = "file"
class = "claimed"
url = "http://geoportal.agricultura.gob.ec/publico2/zip/Fechas_orto.zip"
encoding = "cp1252"
filter = { observacio = ["ORTOFOTO"] }
tolerance_m = 100
[piece.metrics]
surface = "ground"
spacing_m = 5
year = { field = "fecha", date = "text" }

[[piece]]
id = "mdt-50m"
label = "MDT 50 m (open)"
method = "file"
class = "claimed"
availability = "open"
url = "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/v5.1.2/geojson/ne_10m_admin_1_states_provinces.geojson"
filter = { adm0_a3 = ["ECU"] }
exclude = { name = ["Galápagos"] }
tolerance_m = 500
[piece.metrics]
surface = "ground"
spacing_m = 50
year = 2012
