name = "PNOA-LiDAR"
credit = "Instituto Geográfico Nacional, PNOA-LiDAR (CC BY 4.0 scne.es)"
licence = "CC-BY-4.0"
licence_url = "https://www.ign.es/resources/licencia/Condiciones_licenciaUso_IGN.pdf"
source = "https://centrodedescargas.cnig.es/CentroDescargas/modelo-digital-terreno-mdt50cm"
theme = "terrain"
availability = "open"
notes = "The bare-earth models of the national lidar programme (PNOA-LiDAR), from the CNIG's download centre (file by file; no account for up to 20 files). The third coverage's MDT50cm v1 (0.5 m, from the provisional NPC01 classification; \"cobertura por completar\"): the sheet index the centre publishes with it (Informacion_Auxiliar_MDT50cm.zip, a shapefile of 1:5,000 sheets per community and UTM zone, each its file's name and `FECHA`, a year), read in each shapefile's own projected CRS; 29,494 sheets in 13 communities and Ceuta and Melilla (September 2026). Catalonia's MDT50cm, published too, is in no shapefile of the index (its own 0.5 m model is es-ct-icgc's). The second coverage's MDT02 (2 m, flown 2015 to 2021, \"Cobertura completa\" in its IDEE record, every lot's MDT02 published) and the first coverage's MDT05 (5 m, flown 2009 to 2015, \"publicada en su totalidad\"): their sheet lists are only the centre's file search, which answers 403 to a request without its page's session, so their extent is the area the IGN states, Spain, as Natural Earth's 1:10m administrative areas (v5.1.2) draw it: claimed, not checked against data; their years vary by lot (no per-lot outline is readable: the lots' outlines are RAR archives), so no year is stated. Ceuta's, Melilla's and Alborán's MDT02 and MDT05 sheets are from photogrammetric stereo-correlation, not lidar. The surface models (MDS50cm) cover a subset of the MDT50cm's communities and are left out. The programme's RMSE z of at most 10 cm is the point cloud's specification, not the models' stated accuracy, and is left out. Heights orthometric (EPSG:5782 on the mainland)."

