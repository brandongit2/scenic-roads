notes = "GA's national 5 m bare-earth DEM, \"derived from some 236 individual LiDAR surveys between 2001 and 2015 covering an area in excess of 245,000 square kilometres\" (the service's abstract): each survey's 1 m DEM resampled to 5 m, merged by state; 0.30 m vertical and 0.80 m horizontal at 95 % (not an RMSE: left out). It downloads as per-state GeoTIFF zips (ELVIS, data.gov.au); no footprint of the surveys is published (ELVIS's own file API answers 403 outside its page). Its extent is its valid data in the service's WCS (1.0.0; 2.0.1's GetCoverage fails) asked for at 0.01° (about 1.1 km) over the whole country: the server answers no data as 0 there (`nodata`), so a cell at exactly 0 m is read as none, and its nearest-neighbour resampling can miss a survey narrower than a cell. 239,130 km² on 13 Nov 2026, geodesic (250,643 at 0.025°)."

