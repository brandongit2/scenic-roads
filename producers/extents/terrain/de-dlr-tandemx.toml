name = "TanDEM-X elevation models (DLR; WorldDEM, Airbus)"
credit = "© DLR e.V. (TanDEM-X 90 m and 30 m EDEM); © Airbus Defence and Space (WorldDEM)"
licence = "DLR's TanDEM-X 90 m licence (scientific use, no passing on); the 30 m EDEM's (scientific use); WorldDEM sold"
licence_url = "https://geoservice.dlr.de/web/dataguide/tdm90/"
source = "https://geoservice.dlr.de/web/dataguide/tdm90/"
theme = "terrain"
availability = "login"
notes = "The TanDEM-X mission's global surface models from its radar pairs of 2010 to 2015, pole to pole: the 90 m DEM (3 arc-seconds, a free account and a scientific-use licence), the 30 m Edited DEM (EDEM: 1 arc-second, gaps filled and water flattened, the same terms), and Airbus's WorldDEM (0.4 arc-second, about 12 m, sold). Their tile lists are behind DLR's login (its download host answers a redirect to it) and Airbus's shop, so each is claimed over the mission's land tiles as the Copernicus DEM's GLO-90 list gives them (`cop-dem`: the WorldDEM's public edition, 26,475 1° tiles, each holding land, Antarctica's too; the list `cop-dem`'s GLO-90 piece reads, so the three outlines are its outline): claimed, not checked against data. A tile holding land is the land with a margin of up to a tile: for a 12 to 90 m model that is claimed over the land, a coastline traced closer states nothing more."

[[piece]]
id = "tdm90"
label = "TanDEM-X 90 m DEM"
method = "listing"
class = "claimed"
list = "lines"
url = "https://copernicus-dem-90m.s3.amazonaws.com/tileList.txt"
pattern = '_(?P<ns>[NS])(?P<y>\d+)_00_(?P<ew>[EW])(?P<x>\d+)_00_DEM'
size = 1
tolerance_m = 10
[piece.metrics]
surface = "surface"
spacing_m = 90
year = 2015

