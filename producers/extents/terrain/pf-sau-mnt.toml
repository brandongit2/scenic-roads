availability = "open"
notes = "The Service de l'urbanisme's terrain models of French Polynesia's islands, 36 GeoTIFFs on data.gouv.fr (2 MB to 3.5 GB): lidar MNTs of 2015 at 1 m (Tahiti's urban zone from Mahina to Paea, Moorea, Bora Bora), and photogrammetric MNTs from aerial or satellite stereo pairs of 1997 to 2015 for some thirty islands of the Society, Marquesas, Tuamotu, Gambier and Austral archipelagos (5 m where read: Hiva Oa's). Shom's Litto3D lidar of 2015 (Moorea whole, Tahiti's north-west, Bora Bora's island, lagoon and reef, the Taharuu mouth; 1 m and 5 m tiles, a point cloud), from diffusion.shom.fr behind an account form, has no package grid in Shom's WFS. The GeoTIFFs have no overviews (a mask would be each read whole, 6.4 GB in all), and Natural Earth draws only the archipelagos: listed."

