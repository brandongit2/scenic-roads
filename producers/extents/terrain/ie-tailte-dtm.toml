notes = "Ireland's national survey's height data, sold (the live page redirects; read on the Web Archive's copy of 20 March 2025): \"National coverage is available for DTM data\". Its Series 2 DTM, at a 2 m or 10 m interval, is made from the 2016-2019 imagery's camera and lidar point clouds (\"+/- 25cm\" where lidar, \"+/- 1.5m\" where camera, on hard, open, level surfaces; neither an RMSE); Series 1 (10 m, \"+ or – 3 metre\", 2012-2017 imagery and 10 m contours) is coarser over the same country and isn't declared. Its extent is the country the page states, as Natural Earth's 1:10m administrative areas (v5.1.2) draw it: claimed, not checked against data. Its LiDAR of 2005 to 2014 is \"available for selected sites as per the coverage diagram\", an image: listed, not drawn."

