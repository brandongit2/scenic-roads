notes = "The government's bare-earth model of the principality, \"en una malla contínua de 15m\" (also 50 m and 100 m), its catalogue record (IDE Andorra, created 2013, keyword 2003) covering the whole country (its box and its seven parishes). Its download application gives it free after the user enters their details and accepts its conditions of use (the conditions weren't read: a JavaScript application); the record states exclusive intellectual property, no reproduction without permission. Its extent is the country, as Natural Earth's 1:10m administrative areas (v5.1.2) draw it: claimed, not checked against data. Its year isn't stated (the record's keyword 2003 isn't said to be its survey's). No lidar of Andorra was found; IGN's LiDAR HD and Catalonia's lidar stop at the border."

