notes = "The GSI's classified airborne lidar points (ground, water and other classes; at least 4 points/m² since FY2020, often more; a point's height to about 25 cm RMS), sold by the Japan Map Center as LAZ in 3rd-mesh files, 13,900 yen a 2nd mesh. Taken at the nominal spacing of the stated least density, 1/√4 = 0.5 m; a point cloud, holding both, states no surface; no year (its surveys' years vary; the published area is as of 30 Sep 2026). Its extent is the GSI's published-area layer (3d_pcd_area_dtil, its three zoom-5 GeoJSON tiles on maps.gsi.go.jp that hold features; the other tiles over Japan answer 404): paid, so claimed."

