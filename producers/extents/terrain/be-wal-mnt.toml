name = "Relief de la Wallonie"
credit = "Service public de Wallonie (SPW)"
licence = "CC-BY-4.0"
licence_url = "https://creativecommons.org/licenses/by/4.0/"
source = "https://metawal.wallonie.be/geonetwork/srv/api/records/a004e570-99d6-4fe5-b83d-49b774409278/formatters/xml"
theme = "terrain"
availability = "open"
notes = "Wallonia's 0.5 m bare-earth model (MNT) and surface model (MNS, its record 5a4c28fe-d30c-493e-861e-a80ebc703b64) from the 2021-2022 lidar campaign (the records: 19 February 2021 to 5 March 2022), downloaded by province, a block each. Their extent is the campaign's tile index (RELIEF/LIDAR_MAILLES, \"Mailles 2021-2022\": 69,438 point-cloud tiles of 500 m, the clouds the models are made from), by the year of each tile's last point (`DATE_LAST`; some tiles were flown in December 2020). Their height accuracy is stated as \"de l'ordre de 0,12 m en absolu\", not as an RMSE: left out. The SPW's photogrammetric surface model of summer 2023 (MNS_ORTHOS_2023_ETE, record 4b0dadd1-c2b0-49db-a3bb-2f79236ec42e: image matching of the orthophoto flights of 27 May to 25 June 2023, 0.5 m, \"L'ensemble du territoire wallon est couvert\", about 0.75 m in height, CC BY 4.0) is 384 GB delivered only on a hard disk the user brings, so free on request: its extent is the region it states, as Natural Earth's 1:10m administrative areas (v5.1.2) draw it: claimed, not checked against data. The photogrammetric MNS of 2006-07 and 2018 to 2022 cover the same region and are older, and the 2013-2014 lidar MNT and MNS (1 m) are replaced: left out."

