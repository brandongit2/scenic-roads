notes = "Saarland's 1 m bare-earth model \"ATKIS - DGM1 (2025)\" from the Land's 2025 airborne laser scanning (\"Laserscanbefliegung 2025\"), published as one zip of 1 km GeoTIFF tiles per district on the LVGL's public cloud share (the share its INSPIRE ATOM feed links; the feed's own box is the Land's rectangle): the tiles' names, read from the zips' central directories by range request, a tile each (EPSG:25832; dgm1_32_<x>_<y>_1_SL_2025). Open data, dl-de/by-2-0, with no access restriction. The share also holds the 2025 point cloud (LAZ), not a piece: its grid is this one. No accuracy or density was read: none stated."

