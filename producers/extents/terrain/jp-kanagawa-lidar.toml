name = "神奈川県 3次元点群データ"
credit = "神奈川県 (Kanagawa Prefecture), デジタル戦略本部室"
licence = "CC-BY-4.0"
licence_url = "https://creativecommons.org/licenses/by/4.0/deed.ja"
source = "https://www.geospatial.jp/ckan/dataset/kanagawa-2024-pointcloud"
theme = "terrain"
availability = "open"
notes = "Kanagawa Prefecture's airborne lidar of FY2019 to FY2024 (the G-spatial records kanagawa-2019-pointcloud to kanagawa-2024-pointcloud, CC BY: FY2019 the west, Odawara to Yugawara; FY2020 the centre, and Sagamihara's Midori ward apart; FY2021 south Yokohama, Shōnan, Yokosuka and Miura; FY2022 north Yokohama and Kawasaki; FY2024 the west and Sagamihara again), per 1:500 sheet of the national base map (JGD2011, plane rectangular zone IX; 09LC8143: 400 by 300 m), ZIPs (FY2024's points LAZ) in the public bucket the records' download pages link (kanagawa-pointcloud, a folder per fiscal year, 2020's 01 the centre and 02 Sagamihara), each sheet placed by its code. The grid data are bare-earth DEMs, 0.5 m (their files say so, 09lc8143_0.5g.txt; FY2022's 1 m grid besides, its 02 folder); the 0.5 m DSM (with buildings and trees) of north Yokohama and Kawasaki is in the FY2021 folder's DSM (its sheets FY2022's, as that record lists the DSM). The original points (LAS, TXT, LAZ) state no density, so no spacing; a point cloud states no surface. Each year the fiscal year of its record. No accuracy is stated."

[[piece]]
id = "dem05-2019"
label = "DEM 0.5 m (2019, west)"
method = "listing"
url = "https://kanagawa-pointcloud.s3.ap-northeast-1.amazonaws.com"
list = "s3"
prefix = "2019/01/LP/Grid/MESH/"
pattern = '/(?P<ref>09[A-Za-z]{2}\d{4})\.(?:zip|laz)$'
grid = "jp-kihonzu"
crs = "EPSG:6677"
tolerance_m = 50
[piece.metrics]
surface = "ground"
spacing_m = 0.5
year = 2019

