name = "ÚGKK SR LLS DMR"
credit = "ÚGKK SR"
licence = "CC-BY-4.0"
licence_url = "https://creativecommons.org/licenses/by/4.0/"
source = "https://www.skgeodesy.sk/geoportal/zbgis/lls/poskytovanie/"
theme = "terrain"
availability = "open"
notes = "The bare-earth models of the national airborne laser scanning (LLS), as the geodesy office provides them, by its collection lots (lokality): the outlines are its lots' overview shapefiles (prehlad_lokalit_lls_1_cyklus.zip, 42 lots; prehlad_lokalit_lls_2_cyklus.zip, 73 lots; S-JTSK [JTSK03], their text cp1250 with no .cpg), each lot its number and name. Cycle 1 (2017 to 2023): DMR 5.0, a 1 m grid of the whole country, downloaded as one country ZIP. Cycle 2 (2022 to 2026): DMR 6.0, a 0.5 m grid, downloaded by lot for the 16 lots the download page lists (04, 06, 07, 08, 09, 10, 11, 12, 13, 16, 17, 20, 27, 29, 31, 32); the other 57 lots aren't published yet and are left out. Each lot's year is the last of its scanning period in the office's lot parameter tables (parametre-lokality-zberu-udajov-lls-1-cyklus.pdf and -2-cyklus.pdf), a block a cycle and year. Lots 40 to 42 of cycle 1 are completed with the national forestry centre's (NLC) 2018 to 2021 scanning. The tables give each cycle-1 lot's height accuracy of the DMR 5.0 (0.02 to 0.10 m; the specification m_H ≤ 0.20 m), not called an RMSE: left out. The classified point clouds are ordered offline and the DMP surface models sit beside these grids: not pieces."

