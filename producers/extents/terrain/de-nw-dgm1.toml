name = "Geobasis NRW DGM1"
credit = "Geobasis NRW"
licence = "DL-DE-ZERO-2.0"
licence_url = "https://www.govdata.de/dl-de/zero-2-0"
source = "https://www.opengeodata.nrw.de/produkte/geobasis/hm/dgm1_tiff/dgm1_tiff/"
theme = "terrain"
availability = "open"
notes = "North Rhine-Westphalia's 1 m bare-earth model (DGM1, GeoTIFF) from airborne laser scanning flown in a five-year cycle: the open-data folder's index of its 1 km tiles (35,860, EPSG:25832), by the year in each tile's name, which is its survey's (the folder's tile list, dgm1_meta.zip, gives each tile's capture date, Aktualitaet, in the same year for every tile: 2020 to 2025). \"Kostenfrei und zur Nutzung ohne Einschränkungen oder Bedingungen\" (dl-de/zero-2-0). The height accuracy stated, up to ±10 cm + 5 % of the grid in open flat terrain and + 20 % on steep wooded slopes at 95 % (2σ), and the tile list's `Genauigkeit` of 0.2, aren't RMSEs: left out. Two surface models in the same open-data folder (hm/) are pieces beside it, their indexes read alike, by the year in each tile's name. The DOM1 (1 m, dom1_tiff: the same 35,860 tiles and laser surveys, its tile list, dom1_meta.zip, giving each tile's Aktualitaet in its name's year, Erfassungsmethode 5020, laser scanning). And the image-matched bDOM50 (\"Bildbasiertes Digitales Oberflächenmodell 50\", bdom50_las: a 0.5 m grid of points as LAZ, from SURE image matching, its tile list, bdom50_meta.zip, giving Aufloesung 50 (cm) and each tile's flight date, in its name's year, 2022 to 2026); 37,056 files, 1,196 tiles in two years' editions, so its years overlap there. The tile lists' Standardabweichung_Hoehe of 50 (cm) for the bDOM50 isn't an RMSE: left out."

[[piece]]
id = "dgm1"
label = "DGM1 NRW"
method = "listing"
url = "https://www.opengeodata.nrw.de/produkte/geobasis/hm/dgm1_tiff/dgm1_tiff/"
list = "lines"
pattern = 'dgm1_32_(?P<x>\d{3})_(?P<y>\d{4})_1_nw_(?P<year>\d{4})\.tif'
unit = 1000
size = 1000
crs = "EPSG:25832"
tolerance_m = 100
[piece.metrics]
surface = "ground"
spacing_m = 1
year = { field = "year", date = "year" }

