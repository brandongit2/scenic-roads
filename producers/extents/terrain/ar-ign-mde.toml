url = "https://wms.ign.gob.ar/geoserver/modelos-digitales-elevaciones/ows"
type = "modelos-digitales-elevaciones:mde_5m"
fields = ["nombre", "geom"]
page = 500
by = ["nombre"]
name = "nombre"
tolerance_m = 100
[piece.metrics]
surface = "surface"
spacing_m = 5
year = { field = "nombre", date = "text" }

