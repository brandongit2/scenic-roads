name = "National lidar of Samoa (2015), Tonga (2021, 2026) and Tuvalu (2019)"
credit = "Government of Samoa (MNRE; World Bank PPCR); Government of Tonga (Ministry of Lands, Survey and Natural Resources; World Bank PREP, GCF, UNDP, SPC); Government of Tuvalu (Department of Lands and Survey; UNDP, GCF)"
licence = "none found"
licence_url = "https://www.adaptation-undp.org/tuvalu-wields-state-art-new-data-fight-against-climate-change"
source = "https://www.fig.net/resources/proceedings/fig_proceedings/fig2016/papers/ts05e/TS05E_quadros_chamberlain_8169.pdf"
theme = "terrain"
availability = "closed"
notes = "Three governments' national lidar, none released: Samoa's whole-country topographic and bathymetric lidar by Fugro for the World Bank's PPCR (Upolu and Savai'i, 6 Jul to 9 Aug 2015, about 4 points per m², 22 cm vertical at 95 %; parts of Savai'i from radar and satellite data), held by the MNRE; Tonga's 2021 World Bank PREP lidar of 'Eua and Vava'u (and of Tafahi and Niuatoputapu, in the Niuas, which Natural Earth draws with Niuafo'ou: not claimed) and its 2026 survey of Tongatapu and Ha'apai by Fugro (21 Mar to 18 Apr 2026), to be merged into one national baseline by the Ministry of Lands; Tuvalu's 2019 survey of all nine atolls (about 500 km² with reefs and lagoons), held by the Department of Lands and Survey (its 5 m derived DEMs by request through SPC). Each extent is the areas its publisher states, as Natural Earth's 1:10m administrative areas (v5.1.2) draw them: claimed, not checked against data. Tonga's and Tuvalu's grids and densities aren't stated."

