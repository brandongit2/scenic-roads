name = "Kanton Schaffhausen DOM (Digitales Oberflächenmodell)"
credit = "Amt für Geoinformation des Kantons Schaffhausen"
licence = "opendata.swiss terms_open (free use, also commercial)"
licence_url = "https://opendata.swiss/terms-of-use#terms_open"
source = "https://data.geo.sh.ch/ogd/dom_asc.zip"
theme = "terrain"
availability = "open"
notes = "The canton's lidar surface model: \"Rasterweite ist 0.5m. Absolute Höhengenauigkeit 0.15 m (einfacher mittlerer Fehler). Das DOM basiert auf Laserscanning-Daten aus Befliegung März/April 2013\" (its opendata.swiss record), one zip of 55 ASCII grids (dom_asc.zip, 2.6 GB; and as XYZ), each named for its 1:25,000 sheet and a part of it (dom_1011-23.asc). The grids' extents are in their compressed members' headers, which the producer doesn't read, and no index of the sheets' parts was found: its extent is the canton, as Natural Earth's 1:10m administrative areas (v5.1.2) draw it, claimed, not checked against data. The standard error stated, 0.15 m, is taken as the RMSE."

[[piece]]
id = "dom"
label = "DOM 0.5 m 2013"
method = "file"
class = "claimed"
url = "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/v5.1.2/geojson/ne_10m_admin_1_states_provinces.geojson"
filter = { adm0_a3 = ["CHE"], name = ["Schaffhausen"] }
tolerance_m = 200
[piece.metrics]
surface = "surface"
spacing_m = 0.5
year = 2013
vertical_rmse_m = 0.15
