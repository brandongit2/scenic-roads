name = "Peru: ANIN Piura basin lidar and IGN drone lidar"
credit = "Autoridad Nacional de Infraestructura (ANIN); Instituto Geográfico Nacional del Perú (IGN)"
licence = "none published"
licence_url = "https://www.gob.pe/institucion/anin/noticias/1249148-anin-inicia-vuelos-lidar-en-la-cuenca-del-rio-piura-para-estudios-de-preinversion"
source = "https://www.gob.pe/institucion/anin/noticias/1249148-anin-inicia-vuelos-lidar-en-la-cuenca-del-rio-piura-para-estudios-de-preinversion"
theme = "terrain"
availability = "closed"
notes = "Peru's known lidar: the national infrastructure authority's helicopter lidar of the Piura basin (from September 2025, \"397, 155.28 hectáreas a lo largo de 480 kilómetros\", for its pre-investment studies: elevation and terrain models; no density, licence or route to the data), and the IGN's drone lidar of Machu Picchu and the Choquequirao trail (2021, its products to public bodies only). The national catalogue (GEOIDEP) holds no lidar or terrain model record, and the IGN's clip-and-download task \"PERU_Dem\" states no resolution or source. Neither survey publishes an outline: listed, not drawn."

