name = "LidarBC Open LiDAR Data Portal"
credit = "Province of British Columbia"
licence = "OGL-BC-2.0"
licence_url = "https://www2.gov.bc.ca/gov/content/data/policy-standards/open-data/open-government-licence-bc"
source = "https://services6.arcgis.com/ubm4tcTYICKBpist/arcgis/rest/services/LiDAR_BC_S3_Public/FeatureServer"
theme = "terrain"
availability = "open"
notes = "The portal's indexes of its bare-earth DEM files, a map sheet each (1:20,000 and 1:2,500), with each sheet's cell as the index states it (`spacing`: \"1 metre\", or \"2 metre\" for 1,659 sheets of 2016) and its year (the index's `year`, its folder's: a survey flown over a new year, such as 30 Sep 2023 to 15 Mar 2024 by its file's name, is 2023; the names don't all hold dates)."

[[piece]]
id = "dem-20k"
label = "LidarBC DEM, 1:20,000 sheets"
method = "arcgis"
class = "index"
url = "https://services6.arcgis.com/ubm4tcTYICKBpist/arcgis/rest/services/LiDAR_BC_S3_Public/FeatureServer/6"
page = 1000
[piece.metrics]
surface = "ground"
spacing_m = { field = "spacing", text = "metre" }
year = { field = "year", date = "year" }

