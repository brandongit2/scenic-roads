source = "https://data.geobasis-bb.de/geobasis/daten/dgm/"
theme = "terrain"
availability = "open"
notes = "The state's bare-earth model, 1 m in 1 km tiles (EPSG:25833; 31,291 tiles in the download folder's tif/ listing): the LGB's actuality service (an OGC API Features collection, dgm_single, as many tiles) holds each tile with the date of its laser survey (`creationdate`: 2008 to 2011 for 17,433 tiles, 2017 to 2025 for the rest) and of its photogrammetric revision (`revisiondate`, mostly 2019 to 2025, for 21,708 tiles): the pieces are by the laser survey's year. No accuracy is stated in what was read. The ALS point cloud (LAZ, about 5 pts/m², 13,087 tiles) is the grid's source and makes no piece of its own."

