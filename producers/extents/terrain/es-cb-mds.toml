notes = "Cantabria's 1 m surface model with buildings but not vegetation (\"MDS 2018-19 sin vegetación\"), from the 2018-19 lidar campaign the government flew with the IGN-CNIG, filled where those data were missing or poor with the 2010-12 campaign's, \"un conjunto de datos homogéneo y continuo de toda la Comunidad Autónoma\": seen only as the government's map service's raster layer (no download of its grid and no licence found), so closed. Its extent is the area it states, Cantabria, as Natural Earth's 1:10m administrative areas (v5.1.2) draw it: claimed, not checked against data. The service's 5 m terrain models (2001 to 2012) are coarser than the PNOA's and left out."

