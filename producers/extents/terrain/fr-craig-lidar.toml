notes = "CRAIG's 0.5 m bare-earth model (MNT) of 21 zones of Auvergne-Rhône-Alpes (3,582 km²: the Dombes, the Chaîne des Puys, the Loire in its département and smaller sites), from a lidar flown February to April 2021: its tile index (TA_LiDAR_2021_MN_L93.gpkg, layer MNT, 14,331 500 m tiles), a piece per zone (its folder). Its grid is LiDAR HD's and its year no newer than LiDAR HD's 2021 and 2022 where those tiles are published; on 13 Nov 2026 Montluçon's zone lay outside LiDAR HD's published tiles. Its record (ids.craig.fr's dd5035b2-7db9-4821-aef5-ea4b54180889) states Licence Ouverte v2.0 as its access rights."

