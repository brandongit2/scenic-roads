name = "NASA's global elevation models: NASADEM, SRTM, ASTER GDEM"
credit = "NASA JPL (NASADEM, SRTM), NASA and Japan's METI (ASTER GDEM), distributed by the LP DAAC"
licence = "NASA's data use policy (no restrictions)"
licence_url = "https://www.earthdata.nasa.gov/engage/open-data-services-software-policies/data-use-guidance"
source = "https://lpdaac.usgs.gov/products/nasadem_hgtv001/"
theme = "terrain"
availability = "login"
notes = "Each model's 1° tiles from an index of them: NASADEM (the SRTM's February 2000 radar data reprocessed, its voids filled from ASTER GDEM, AW3D30 and ICESat; 1 arc-second, a surface model) from Microsoft's Planetary Computer, whose copy downloads with no login (open), its STAC collection's 14,520 items; the SRTM GL1 (1 arc-second) and GL3 (3 arc-second) version 3 and ASTER GDEM version 3 (1 arc-second, from ASTER stereo scenes of March 2000 to November 2013) from NASA's CMR granule search of the LP DAAC (its CSV answers, 2,000 granules a page, each granule's name holding its tile: 14,297, 14,297 and 22,912 granules; its STAC answers 500 to every page after the first), whose files download after a free Earthdata login: claimed, their outlines the index's. NASADEM's tiles' footprints are their 1° squares and half a cell beyond; the others' the squares their names give. The SRTM's reach is 60° N to 56° S; ASTER GDEM's 83° N to 83° S, Greenland's and Antarctica's tiles held to be less reliable."

