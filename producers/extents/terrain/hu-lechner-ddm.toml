notes = "Hungary's national elevation model, a 5 × 5 m grid made from the 1:10,000 topographic maps' contours (surveyed 1979 to 2000), corrected by stereo photogrammetry, with full national updates in 2000, 2005, 2015 and 2022 and partial ones between. Sold per km² (5 m 1,920 Ft, 10 m 1,440 Ft, plus a cutting fee); the 25 m grid is free of charge, on request. Its stated mean height reliability (±0.7 m, of the map-based model) is not called an RMSE: left out. No open lidar model was found. Its extent is the country the agency's national updates cover, as Natural Earth's 1:10m administrative areas (v5.1.2) draw Hungary: claimed (paid, and free only on request)."

