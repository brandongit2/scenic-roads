notes = "The state's bare-earth model, 1 m cloud-optimised GeoTIFFs in 1 km tiles (EPSG:25832), from airborne laser scanning at 4 pts/m² or more: the LGLN's STAC collection's items, each tile's footprint, its survey lot (`los`) and its date (`datetime`, the tile metadata's AKTUALITAET), by lot and the date's year. The collection holds every edition still published: 70,285 items for 49,708 tiles (20,211 tiles in two or three editions, an older lot's and a newer's), so the lots' pieces overlap where a tile was flown again; the newest edition of each tile is of 2016 or 2017 for 55 % of the tiles, of 2025 for 15 %. Each tile states a `genauigkeit` of 0.3 (m; the AdV standard's height accuracy as a standard deviation, not stated as an RMSE, so left out). The ordered 3D-Messdaten point cloud (fees by the KOVerm) is the grid's source and makes no piece of its own. Two surface models are pieces beside it, each from its own STAC collection read alike. The DOM1 (1 m, 1 km tiles, from the same laser scans: its items' `erfassungsmethode` 5020, by lot and the date's year; its `genauigkeit` of 0.5 left out likewise). And the image-matched bDOM20 (\"BDOM 20 Niedersachsen\", 0.2 m, its items' `aufloesung` 20, from the aerial survey flights, CC BY 4.0): its items, each tile with its flight (`bildflugnummer`, `bildflugname`) and date (`datetime`, 2021 to 2026), a piece per flight; a tile flown again is an item per flight, so the pieces overlap there too. No accuracy is stated for the bDOM20."

