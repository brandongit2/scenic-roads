availability = "closed"
notes = "DAERA's lidar of Northern Ireland's whole coastline in 2021 (the intertidal area and about 200 m landward of the high-water mark; its DTM's \"source resolution of 0.25m\") and the North Coast's post-storm surveys of March and September 2022 (Curran Strand, Portrush East Strand, Portstewart Strand, Downhill to Magilligan; September's DTM 0.1 m). Each is published only as cached ArcGIS tile services (MapServer, \"Map,TilesOnly\") and scene services, under the Open Government Licence: no file to download. The services' Footprint and Boundary layers can't be queried (tiles only: a query answers \"Page Not Found\"), the hub's download of them answers \"Downloads are not supported for this item\", ArcGIS Online lists no feature service of the surveys, and a 200 m strip along the coast is no administrative area to claim: listed, not drawn."

