theme = "terrain"
availability = "open"
notes = "Shom's and IGN's continuous land-sea models of the metropolitan coast (topographic lidar on land, up to about 2 km inland, topo-bathymetric lidar and multibeam at sea): a 1 m DTM each, in 5 km packages from Shom's INSPIRE download service, without a login. Each campaign's extent is its package grid (Shom's WFS LITTO3D_<campaign>_GRILLE_WFS), a block each, its year the last of its topographic surveys as its record states: Languedoc-Roussillon (bathymetry 2009, topography 16 July to 17 August 2010), PACA (2007 to 12 July 2013), Finistère (2011 to 7 July 2013), Brittany (4 May 2018 to 2 July 2021; its record says the inland part is completed from RGE ALTI) and Nouvelle-Aquitaine (at sea 2020 to 2022; on land IGN's LiDAR HD, flown 8 May 2021 to 1 October 2023). The packages are squares over land and sea: an outline over the sea as they are. The campaigns of the sea only (Litto3D's marine parts: Corsica, Normandy and Hauts-de-France, Iroise, Morbihan, Languedoc-Roussillon 2011 and 2014-2015) are bathymetry's, left out; the overseas ones are antilles-litto3d's and spm-litto3d's."

