notes = "The survey administration's relief model (DMR, and its height model DMV) from the multisensor aerial survey of the Republic of Croatia: lidar of at least 8 points/m² flown 2022–2023 (two lots and the levees), photogrammetry 2023–2024; the DMV from lidar has its points every 1 m (the product page). Issued by area or by 1:25,000 and 1:2,000 sheets on a written request, at a fee under the cost regulation. The NIPP registry's entry for the classified point cloud (source 1694) says \"Nema uvjeta za pristup i korištenje\", but no download was found and the product page names the fee: the more restrictive reading is kept. Its extent is the country the survey is stated to cover (\"Multisenzorsko zračno snimanje Republike Hrvatske\"), as Natural Earth's 1:10m administrative areas (v5.1.2) draw it: claimed, not checked against data. No accuracy is stated."

