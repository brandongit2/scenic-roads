name = "Sachsen-Anhalt DGM1 (LVermGeo)"
credit = "Landesamt für Vermessung und Geoinformation Sachsen-Anhalt (LVermGeo)"
licence = "DL-DE-BY-2.0"
licence_url = "https://www.govdata.de/dl-de/by-2-0"
source = "https://www.lvermgeo.sachsen-anhalt.de/de/gdp-dgm1-landesweit.html"
theme = "terrain"
availability = "open"
notes = "The state's bare-earth model, 1 m in 2 km tiles (EPSG:25832): the statewide download's four archives (DGM1_1.zip to DGM1_4.zip, 11.5 GB the first, zip64), each tile's file a member (dgm1_32_<east km>_<north km>_2_st.tif), read from the archives' central directories by range request. No year: the tiles' years (2021 to 2025, as of 5 Dec 2025) are in an overview PDF only, and each tile's .meta file is a member of the archives. No accuracy figure is stated in what was read. The 3D-Messdaten point cloud is had on request, with fees. Two image-matched surface models are pieces beside it, both \"online zum kostenfreien selbstständigen Download\" (gdp-dom-bdom-lsa.html): Sachsen-Anhalt's DOM is derived from its bDOM, \"orientierte Luftbilder ..., aus denen per Bildkorrelation 3D-Punktwolken ... abgeleitet werden\", renewed with the two-yearly image flights. The DOM1 (1 m, 2 km tiles; its height accuracy of ±0.5 m isn't stated as an RMSE: left out): its statewide download's four archives (DOM1_1.zip to DOM1_4.zip, gdp-dom1-landesweit.html), each tile a member named with its year (dom1_32_<east km>_<north km>_2_st_<year>.tif; its .meta: Aktualitaet 2023-05, Erfassungsmethode 5040, image matching, for one of 2023), by that year. And the bDOM20 (0.2 m, LAZ): its download page's map (gdp-bdom20.html) embeds its 5,466 2 km tiles, each named for its south-west corner (\"label\": \"32<east km><north km>\"), read from the page; no year is given for them."

[[piece]]
id = "dgm1"
label = "DGM1"
method = "listing"
urls = [
  "https://www.geodatenportal.sachsen-anhalt.de/gfds_webshare/download/LVermGeo/Geodatenportal/Online-Bereitstellung-LVermGeo/DGM/DGM1_1.zip",
  "https://www.geodatenportal.sachsen-anhalt.de/gfds_webshare/download/LVermGeo/Geodatenportal/Online-Bereitstellung-LVermGeo/DGM/DGM1_2.zip",
  "https://www.geodatenportal.sachsen-anhalt.de/gfds_webshare/download/LVermGeo/Geodatenportal/Online-Bereitstellung-LVermGeo/DGM/DGM1_3.zip",
  "https://www.geodatenportal.sachsen-anhalt.de/gfds_webshare/download/LVermGeo/Geodatenportal/Online-Bereitstellung-LVermGeo/DGM/DGM1_4.zip",
]
list = "zip"
pattern = 'dgm1_32_(?P<x>\d{3})_(?P<y>\d{4})_2_st\.tif$'
unit = 1000
size = 2000
crs = "EPSG:25832"
tolerance_m = 100
[piece.metrics]
surface = "ground"
spacing_m = 1

[[piece]]
id = "dom1"
label = "DOM1"
method = "listing"
urls = [
  "https://www.geodatenportal.sachsen-anhalt.de/gfds_webshare/download/LVermGeo/Geodatenportal/Online-Bereitstellung-LVermGeo/DOM/DOM1_1.zip",
  "https://www.geodatenportal.sachsen-anhalt.de/gfds_webshare/download/LVermGeo/Geodatenportal/Online-Bereitstellung-LVermGeo/DOM/DOM1_2.zip",
  "https://www.geodatenportal.sachsen-anhalt.de/gfds_webshare/download/LVermGeo/Geodatenportal/Online-Bereitstellung-LVermGeo/DOM/DOM1_3.zip",
  "https://www.geodatenportal.sachsen-anhalt.de/gfds_webshare/download/LVermGeo/Geodatenportal/Online-Bereitstellung-LVermGeo/DOM/DOM1_4.zip",
]
list = "zip"
pattern = 'dom1_32_(?P<x>\d{3})_(?P<y>\d{4})_2_st_(?P<year>\d{4})\.tif$'
unit = 1000
size = 2000
crs = "EPSG:25832"
tolerance_m = 100
[piece.metrics]
surface = "surface"
spacing_m = 1
year = { field = "year", date = "year" }

[[piece]]
id = "bdom20"
label = "bDOM20"
method = "listing"
url = "https://www.lvermgeo.sachsen-anhalt.de/de/gdp-bdom20.html"
list = "lines"
pattern = '"32(?P<x>\d{3})(?P<y>\d{4})"'
unit = 1000
size = 2000
crs = "EPSG:25832"
tolerance_m = 100
[piece.metrics]
surface = "surface"
spacing_m = 0.2
