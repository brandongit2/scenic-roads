notes = "The state's bare-earth model, 1 m in 2 km tiles (EPSG:25833), from airborne laser scanning: the product download's tile layer (rest_geosn_downloadlinks, layer DGM1: 4,981 tiles, each with its download link and its actuality, `Stand`), by the actuality's year. The terms (Sächsische Geodatennutzungsverordnung) are those of dl-de/by-2-0, naming \"GeoSN\". The laser data's accuracy is stated as ±0.15 m and ±0.30 m at 95 %, not an RMSE, so left out. The classified laser point clouds (\"Laserscandaten\", LAZ in the same 2 km tiles), the grid's source, are a piece beside it: the same service's layer LSC holds their 4,981 tiles, each with its `Stand` (the DGM1's), but no download link, and the product download offers only the DGM1 and DOM1, so they are ordered from the GeoSN (by tile or area, a fee of 25 to 500 euros under the SächsVermKoVO where not self-served): claimed, paid, read alike. Their density: the GeoSN's tender for the scanning (TED 484096-2021) asks for at least 4 points per m² (0.5 m).The surface model DOM1 (1 m, 2 km tiles, \"durch Interpolation der Ausgangsdaten (Laserscandaten)\") is a piece beside it, from the same service's layer DOM1 (4,981 tiles, each with its `Stand`), read alike; the DOM2 (2 m, 20 km tiles) is the same coarser and makes no piece. No image-matched model is published."

