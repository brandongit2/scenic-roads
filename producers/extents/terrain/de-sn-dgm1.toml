notes = "The state's bare-earth model, 1 m in 2 km tiles (EPSG:25833), from airborne laser scanning: the product download's tile layer (rest_geosn_downloadlinks, layer DGM1: 4,981 tiles, each with its download link and its actuality, `Stand`), by the actuality's year. The terms (Sächsische Geodatennutzungsverordnung) are those of dl-de/by-2-0, naming \"GeoSN\". The laser data's accuracy is stated as ±0.15 m and ±0.30 m at 95 %, not an RMSE, so left out. The laser point clouds (LAZ, tile by tile) are the grid's source and make no piece of their own. The surface model DOM1 (1 m, 2 km tiles, \"durch Interpolation der Ausgangsdaten (Laserscandaten)\") is a piece beside it, from the same service's layer DOM1 (4,981 tiles, each with its `Stand`), read alike; the DOM2 (2 m, 20 km tiles) is the same coarser and makes no piece. No image-matched model is published."

