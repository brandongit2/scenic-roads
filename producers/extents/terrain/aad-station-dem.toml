notes = "The AADC's DEMs round Australia's Antarctic stations, made from 1994 to 2005: Shirley Island's 2 m (Windmill Islands, near Casey, 2005), Holme Bay's 10 m (near Mawson, interpolated from contours), the Larsemann Hills' 10 m and the Vestfold Hills' (near Davis). Their records give bounding boxes only: listed. REMA's 2 m mosaic (pgc-rema) covers them all."

