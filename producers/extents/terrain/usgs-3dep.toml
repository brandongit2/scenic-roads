name = "USGS 3D Elevation Program"
credit = "U.S. Geological Survey"
licence = "public domain"
licence_url = "https://www.usgs.gov/3d-elevation-program/about-3dep-products-services"
source = "https://elevation.nationalmap.gov/arcgis/rest/services/3DEPElevation/ImageServer"
theme = "terrain"
availability = "open"
notes = "The catalogue of the program's bare-earth DEM service (an ImageServer's items, one per published file: \"all 3DEP DEM data published as of\" its stated date), each item's footprint, its cell (`LowPS`, in metres: 3.44 for 1/9, 10.3 for 1/3, 30.9 for 1 and 61.8 for 2 arc-second; the 1 m DEM's and Alaska's 5 m IfSAR DTM's as their products are named, their `LowPS` 1 and 5, but for 993 of the 1 m items not exactly 1) and its acquisition's end (`EndDate`). The 1 m DEM by project (the item's `Name`), the 1/9 arc-second DEM and Alaska's 5 m IfSAR DTM by the year their acquisitions ended, the seamless 1/3, 1 and 2 arc-second layers each one outline (their tiles are compiled from many surveys; no year). The 0.5 m source DEMs (OPR) aren't in the catalogue, and the index service that has them (3DEPElevationIndex/MapServer, layer 11, and WESM) refused every feature query on 12 and 13 Nov (\"Failed to execute query\"); its WESM GeoPackage is 3.8 GB, so they aren't here. Alaska's 5 m IfSAR DSM (the radar's first surface, beside its DTM) isn't in that catalogue: its own Full Extent Spatial Metadata (FESM_DSM_PROJ.gpkg, 26 MB, 429 cell outlines, each its `horizres_m`, 5, and its acquisition's end, `e_date`) gives its extent, by year."

[[piece]]
id = "1m"
method = "arcgis"
class = "index"
url = "https://elevation.nationalmap.gov/arcgis/rest/services/3DEPElevation/ImageServer"
where = "Category = 1 AND LowPS > 0.9 AND LowPS < 1.1"
page = 2000
by = ["Name"]
name = "Name"
tolerance_m = 100
[piece.metrics]
surface = "ground"
spacing_m = 1
year = { field = "EndDate", date = "text" }

[[piece]]
id = "19"
label = "1/9 arc-second DEM"
method = "arcgis"
class = "index"
url = "https://elevation.nationalmap.gov/arcgis/rest/services/3DEPElevation/ImageServer"
where = "Category = 1 AND LowPS > 3 AND LowPS < 4"
page = 2000
tolerance_m = 100
[piece.metrics]
surface = "ground"
spacing_m = { field = "LowPS" }
year = { field = "EndDate", date = "text" }

