name = "USGS 3D Elevation Program"
credit = "U.S. Geological Survey"
licence = "public domain"
licence_url = "https://www.usgs.gov/3d-elevation-program/about-3dep-products-services"
source = "https://index.nationalmap.gov/arcgis/rest/services/3DEPElevationIndex/MapServer"
theme = "terrain"
availability = "open"
notes = "The program's own index (refreshed weekly). Not fetched yet: on 12 and 13 Nov its MapServer answered a layer's description and a count (`returnCountOnly`: 2,633 source DEM work units) but refused every feature query (\"Failed to execute query\": by `where`, by object id, by envelope, with and without geometry). The quality levels' words are the index's own (`ql`: QL 0, QL 1, QL 2, QL 3, QL 5 and Other, as WESM.csv, its published table of the same work units, has them, 13 Nov); a level's accuracy is the Lidar Base Specification's non-vegetated RMSEz (https://www.usgs.gov/3d-elevation-program/topographic-data-quality-levels-qls); QL 5 (IfSAR) and Other aren't in that table, so they state no accuracy. The seamless layers (1/9, 1/3, 1 and 2 arc-second) are each one outline, with no survey year."

# The lidar work units whose source DEM is published, at the DEM's own cell.
[[piece]]
id = "lidar"
method = "arcgis"
class = "service"
url = "https://index.nationalmap.gov/arcgis/rest/services/3DEPElevationIndex/MapServer/11"
by = ["workunit"]
name = "workunit"
[piece.metrics]
surface = "ground"
spacing_m = { field = "dem_gsd_meters" }
year = { field = "collect_end", date = "epoch-ms" }
vertical_rmse_m = { field = "ql", map = { "QL 0" = 0.05, "QL 1" = 0.10, "QL 2" = 0.10, "QL 3" = 0.20 } }

[[piece]]
id = "1m"
label = "1 meter DEM"
method = "arcgis"
class = "service"
url = "https://index.nationalmap.gov/arcgis/rest/services/3DEPElevationIndex/MapServer/1"
[piece.metrics]
surface = "ground"
spacing_m = 1

