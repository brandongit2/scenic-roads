notes = "Hiroshima Prefecture's airborne lidar of the whole prefecture (the 2022 prefecture-wide survey in 7 lots at map information level 500, delivered 2023, with the landslide basic surveys from 2018 on): grid data, contours and orthophotos downloadable without application from its DoboX portal (dataset 1434, some 38,000 resources, a page per file, its API keyed); the original points on request. No sheet list was read, so its extent is the prefecture, as Natural Earth's 1:10m administrative areas (v5.1.2) draw it: claimed, not checked against data. The page states no grid spacing: level 500 grid data is 0.5 m under the public-survey rules (作業規程の準則), taken as the spacing. No accuracy is stated."

