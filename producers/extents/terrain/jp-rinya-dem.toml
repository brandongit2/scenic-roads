name = "林野庁 DEM（森林計画区・災害）"
credit = "林野庁 (Forestry Agency); the prefectures and municipalities whose lidar it converted"
licence = "公共データ利用規約 (第1.0版) (PDL 1.0)"
licence_url = "https://www.digital.go.jp/resources/open_data/public_data_license_v1.0"
source = "https://www.geospatial.jp/ckan/dataset/r6_noto-peninsula-earthquake"
theme = "terrain"
availability = "open"
notes = "The Forestry Agency's bare-earth DEMs converted to the forest GIS forum's standard specification (\"森林資源データ解析・管理標準仕様書\") from prefectures' and municipalities' airborne lidar, per forest planning area (Aichi's Owari-Nishimikawa and Higashimikawa, Mie's Kitaise, Tokushima's Yoshinogawa and Naka-Kaifugawa, Nagano's Inadani, Yamagata's Shonai, south Oita's of FY2020), and from its own surveys after disasters (the 2016 Kumamoto earthquake, the floods of July 2018 and July 2020, the 2024 Noto Peninsula earthquake, flown with the GSI after it), each a G-spatial record under the public data licence (PDL 1.0). A GeoTIFF per quarter of a 1:50,000 base map sheet (dem_07md1_2025.tif: 20 by 15 km; JGD2011, plane rectangular zones II to X, a block per record and zone), the files each record lists (read from its API answer), placed by their codes: the quarters hold data over the surveyed areas only, so the outlines overstate them. The DEM's cell is 0.5 m (the files' own headers, read for two of them); a planning area's survey year isn't stated on its record (its data sheet PDF), so only the disaster sets' and south Oita's years are. The disaster sets' ground points (ground_data_*.7z, by the same quarters) aren't declared apart. No accuracy is stated."

[[piece]]
id = "owarinishimikawa-078"
label = "DEM 0.5 m, Aichi, Owari-Nishimikawa planning area"
method = "listing"
url = "https://www.geospatial.jp/ckan/api/3/action/package_show?id=owarinishimikawa_078"
list = "lines"
pattern = 'dem_(?P<ref>07[a-z]{2}[1-4])_2025\.tif"'
grid = "jp-kihonzu"
crs = "EPSG:6675"
tolerance_m = 200
[piece.metrics]
surface = "ground"
spacing_m = 0.5

