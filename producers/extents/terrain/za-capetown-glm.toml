notes = "The City's 5 m bare-earth DEM from its lidar of 2018 and 2019 (2 to 3 points per m²), vertical accuracy 30 cm, approved by Council on 27 Jul 2023. Its REST service renders an image, not heights; the grid itself is had from the City Maps office on request (login). Its extent is the city the publisher states it covers, as the City's own boundary layer (Base_Data_LDTL_VTC, the Municipal Demarcation Board's) draws it: claimed, not checked against data. The City's 2 m and 5 m contours (the latter from its 2025-26 lidar at 15 points per m²) are not grids and aren't declared."

