notes = "The state's bare-earth model, 1 m in 2 km tiles (EPSG:25833): the INSPIRE download feed's tile files (6,407 in each of its six formats; dgm1_33_<east km>_<north km>_2_….tif, the south-west corner). Free downloads are CC BY 4.0 by the LAiV's terms (\"©GeoBasis-DE/MV/CC BY 4.0\"). The feed's own `bbox`es are latitude first and the tiles' boxes in degrees, so the names are read instead. No year: the tiles' dates are in the download page's application only; the LAiV's yearly update overviews (shapefiles for 2022, 2024 and 2025: 3,220, 4,040 and 260 km²) cover a part, the rest (2011 to 2020, on a ten-year cycle) only as pictures. No accuracy figure is stated in what was read. The laser point clouds are paid."

