notes = "The state's bare-earth model, 1 m in 2 km tiles (EPSG:25833): the INSPIRE download feed's tile files (6,407 in each of its six formats; dgm1_33_<east km>_<north km>_2_….tif, the south-west corner). Free downloads are CC BY 4.0 by the LAiV's terms (\"©GeoBasis-DE/MV/CC BY 4.0\"). The feed's own `bbox`es are latitude first and the tiles' boxes in degrees, so the names are read instead. No year: the tiles' dates are in the download page's application only; the LAiV's yearly update overviews (shapefiles for 2022, 2024 and 2025: 3,220, 4,040 and 260 km²) cover a part, the rest (2011 to 2020, on a ten-year cycle) only as pictures. No accuracy figure is stated in what was read. The laser point clouds are paid. Two surface models are pieces beside it. The DOM1 (1 m, its own feed's 6,407 tiles, dom1_33_<east km>_<north km>_2_…; renewed on a three-year cycle, its yearly overviews of 2021 to 2024 naming Erfassungsmethode 5040, image matching, though its record names both laser scanning and image matching): no year, as for the DGM1, its overviews overlapping from year to year. And the image-matched bDOM10light (0.10 m, \"Bildkorrelation auf Basis orientierter Luftbildpaare\", LAZ without its colours, free under CC BY 4.0, 6,561 2 km tiles in its feed): its extent and years are the LAiV's yearly bDOM overviews of 2023, 2024 and 2025 (shapefiles, EPSG:25833: each 500 m tile with its flight date, aktualitae), which together cover the state once, without overlap (25,838 km² against the feed's 6,561 tiles' 26,244), a piece each. The bDOM10 with colours, the same grid, is paid and needs a stated interest; the bDOM20 is the same coarser: neither makes a piece of its own."

