name = "Portland RLIS and Oregon SBFO buildings"
credit = "Metro (RLIS), State of Oregon"
licence = "RLIS Open Database End User Licence Agreement"
theme = "buildings"
availability = "open"
notes = "Two sources (USA §6): Metro's RLIS Building Footprint Database, lidar AVG_HEIGHT on 552,958 of its 749,627 buildings, with roof type, over the Portland metro's three counties (Multnomah, Washington, Clackamas); and DOGAMI's Statewide Building Footprints for Oregon (SBFO 1.1, 2022), about 2.1 million footprints, with lidar roof heights only where the state's lidar reaches. The extents: RLIS's the three counties' boundaries as OpenStreetMap maps them (relations 1837126, 1837133, 1837105, read from Nominatim's lookup), SBFO's footprints the state as Natural Earth's 1:10m admin-1 areas (v5.1.2) draw it (each claimed, not checked against the data); SBFO's heights aren't drawn: where the state's lidar reaches isn't read for it. Claimed because its data is its buildings, one layer or file for its whole area with no tile index, and buildings draw no area's outline: reading them would be the whole download. From RESEARCH-BUILDINGS-INDEX.md §2 (task #1438)."

[[piece]]
id = "rlis"
label = "RLIS lidar heights (Portland metro)"
method = "file"
class = "claimed"
url = "https://nominatim.openstreetmap.org/lookup?format=geojson&polygon_geojson=1&polygon_threshold=0.0005&osm_ids=R1837126,R1837133,R1837105"
tolerance_m = 100
[piece.metrics]
detail = "heights"
measured = "lidar"
completeness = 73.8

[[piece]]
id = "sbfo"
label = "SBFO footprints (Oregon)"
method = "file"
class = "claimed"
url = "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/v5.1.2/geojson/ne_10m_admin_1_states_provinces.geojson"
filter = { iso_3166_2 = ["US-OR"] }
tolerance_m = 200
[piece.metrics]
detail = "footprints"
year = 2022

[[piece]]
id = "sbfo-heights"
label = "SBFO lidar roof heights"
method = "none"
why = "where the state's lidar reaches, which SBFO's heights follow, isn't read for it"
[piece.metrics]
detail = "heights"
measured = "lidar"
year = 2022
