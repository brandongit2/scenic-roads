name = "FEMA/ORNL USA Structures"
credit = "FEMA, Oak Ridge National Laboratory"
licence = "CC-BY-4.0"
source = "https://source.coop/"
theme = "buildings"
availability = "open"
notes = "Footprints of the 50 states and the territories, with a lidar-mean HEIGHT where the source is NGA: 31,926,171 of 131,811,952 GeoParquet rows (24.2 %) carry a height; the GeoParquet snapshot of December 2024 on Source Cooperative, the live layer by ArcGIS REST (USA §3). The USGS National Structures Dataset repackages the same polygons by state: not declared apart. The footprints' extent: the states and territories, as Natural Earth's 1:10m admin-1 areas (v5.1.2) draw them (claimed, not checked against the data); the heights are NGA's cities' (us-nga-133-cities), whose list and outlines aren't read: not drawn. Claimed because its data is its buildings, one layer or file for its whole area with no tile index, and buildings draw no area's outline: reading them would be the whole download. From RESEARCH-BUILDINGS-INDEX.md §2 (task #1438)."

[[piece]]
id = "footprints"
label = "USA Structures footprints"
method = "file"
class = "claimed"
url = "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/v5.1.2/geojson/ne_10m_admin_1_states_provinces.geojson"
filter = { adm0_a3 = ["USA", "PRI", "VIR", "GUM", "ASM", "MNP"] }
tolerance_m = 500
[piece.metrics]
detail = "footprints"
year = 2024

[[piece]]
id = "heights"
label = "USA Structures lidar heights (NGA's)"
method = "none"
why = "the heights are where the source is NGA (24.2 % of the rows): NGA's cities, not listed as an area"
[piece.metrics]
detail = "heights"
measured = "lidar"
year = 2024
