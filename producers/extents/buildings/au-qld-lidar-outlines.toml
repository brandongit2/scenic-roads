source = "https://spatial-gis.information.qld.gov.au/arcgis/rest/services/Structure/BuildingsAndSettlements/MapServer/11"
notes = "Roof ridge and eave heights from lidar: the state's generated building outlines (BuildingsAndSettlements layer 11, its Current rows), 3,069,378 outlines in 119 lidar projects on 18 Nov 2026 (the layer's own count by `featuresourceproject`); Brisbane: 25.3 % of Overture's buildings gain a height (REST §3.1, §9.3). Its extent: of the 55 projects the state's elevation data extents layer lists (2,096,443 outlines), their footprints there (ElevationProjectExtents, its `project_name` the outlines' `featuresourceproject`): where each project's lidar was flown, not where its buildings are. The other 64 (972,935 outlines, Brisbane 2025's 484,871 among them) aren't in that layer, and their outlines (building polygons, not areas) don't make one: not drawn. From RESEARCH-BUILDINGS-INDEX.md §2 (task #1438)."

