name = "Overture Maps buildings"
credit = "Overture Maps Foundation, and its sources: OpenStreetMap contributors, Microsoft, Google, Esri Community Maps contributors, the USGS, Instituto Geográfico Nacional (España), the East Asian buildings dataset's authors (CLSM), the City of Vancouver"
licence = "ODbL-1.0"
licence_url = "https://docs.overturemaps.org/attribution/"
source = "https://docs.overturemaps.org/guides/buildings/"
theme = "buildings"
availability = "open"
notes = "The buildings the map's 3D buildings are made from (docs/buildings3d.md §2.1): the pinned Overture release, as the build holds it (its normalized files, work/bld/6-x-y, one per z6 tile within 1 km of the coverage). Each piece is drawn by the build's own step from those files (class mask: bld::bld::extents), a cell a z14 tile (2.4 km at the equator), by the cells' rule: a cell is the footprints' piece of the dataset holding the most of its buildings' footprints; where half its buildings or more have a height, it is the heights' piece of each dataset holding a quarter or more of those heights; storeys (floors, no height) likewise. A building's footprint is its footprint's own dataset, as Overture names the source of its geometry; its height the dataset Overture names for the height; its storeys its footprint's dataset. Overture's datasets in the build's files: OpenStreetMap, Microsoft ML Buildings, Google Open Buildings, the East Asian buildings (CLSM, doi:10.5281/zenodo.8174931), Esri Community Maps, USGS Lidar (heights only), Instituto Geográfico Nacional (España), the City of Vancouver. The research (RESEARCH-BUILDINGS-INDEX.md §1): Overture's heights are OSM's tags, Microsoft's estimates in some countries and the USGS's lidar values in patches of the USA; most buildings elsewhere have neither height nor storeys. Outside the coverage the build holds none, so these pieces stop there: what the build downloaded, not what Overture has."

# Footprints: a cell is the piece of the dataset holding the most of its buildings.
[[piece]]
id = "osm"
label = "OpenStreetMap footprints"
method = "overture"
dataset = "OpenStreetMap"
holds = "footprints"
[piece.metrics]
detail = "footprints"

# Storeys or heights: where half a cell's buildings or more have them, each dataset holding a
# quarter or more of them.
[[piece]]
id = "osm-storeys"
label = "OpenStreetMap storeys"
method = "overture"
dataset = "OpenStreetMap"
holds = "storeys"
[piece.metrics]
detail = "storeys"
measured = "mapped"

