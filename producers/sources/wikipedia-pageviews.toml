name = "Wikimedia pageview dumps (pageview_complete, monthly, user agents)"
what = "Fame: Wikipedia pageviews"
credit = "Wikimedia Foundation, pageview dumps"
licence = "CC0-1.0"
licence_url = "https://creativecommons.org/publicdomain/zero/1.0/"
source = "https://dumps.wikimedia.org/other/pageview_complete/readme.html"
territory = "world"
notes = "A month's dump streamed once into an index kept in sources/pageviews/ (pipeline::pageviews); which months are read is the jobs' rule (pipeline::pageviews::months_before), not the declaration's."

[data]
role = "pageviews"
format = "pageviews-dump"
# A month's dump: `{y}` its year, `{m}` its month (two digits).
url = "https://dumps.wikimedia.org/other/pageview_complete/monthly/{y}/{y}-{m}/pageviews-{y}{m}-user.bz2"
refresh = "pinned"
