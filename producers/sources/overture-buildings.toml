name = "Overture Maps Foundation buildings, release 2026-09-23.1"
what = "3D buildings"
credit = "Overture Maps Foundation buildings, release 2026-09-23.1 (© OpenStreetMap contributors, Microsoft, Esri Community Maps, USGS, IGN España, Google and others; each building's sources in the release)"
licence = "ODbL-1.0"
licence_url = "https://opendatacommons.org/licenses/odbl/1-0/"
source = "https://docs.overturemaps.org/guides/buildings/"
territory = "world"
notes = "The roadside buildings' boxes (dem/buildings.py, crate::buildtiles: sources/buildings/<release>/) and the 3D buildings (dem/bldfetch.py's files in sources/overture/<release>/, crate::bld). Overture keeps a release about two months: a new one is a new version here."

[data]
role = "buildings"
format = "geoparquet"
# The bucket, read anonymously: release/<version>/theme=buildings/type=<type>/*.parquet.
url = "https://overturemaps-us-west-2.s3.us-west-2.amazonaws.com/"
version = "2026-09-23.1"
refresh = "pinned"

[data.params]
# The bucket as DuckDB reads it, and its region.
s3 = "s3://overturemaps-us-west-2"
region = "us-west-2"
# The 3D buildings' types; the roadside buildings read `building` alone.
types = ["building_part", "building"]
