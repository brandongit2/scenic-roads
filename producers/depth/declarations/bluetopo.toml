name = "BlueTopo (NOAA Office of Coast Survey), 4–16 m"
what = "Depth of the US coasts"
credit = "NOAA Office of Coast Survey, BlueTopo"
licence = "CC0-1.0"
licence_url = "https://nauticalcharts.noaa.gov/data/bluetopo.html"
source = "https://nauticalcharts.noaa.gov/data/bluetopo.html"
territory = ["US"]
notes = "producers/depth/bluetopo.py's steps over every tile in the tile scheme of 2026-10-16 (checksums checked), a chunk of tiles at a time (producers/depth/chunked.py bluetopo). Heights above NAVD88 brought to MSL, and MLLW kept as the low water, by NOAA VDatum (producers/depth/vdatum.py: a point per 0.25° cell holding a tile, NAVD88 to LMSL and LMSL to MLLW; GEOID18, and GEOID12B in Southeast Alaska); the Puerto Rico and Virgin Islands tiles are on MSL already. Cells its attribute tables call interpolated are capped at z12. Not for navigation."

[data]
role = "depth"
