index = "bluetopo-grids.geojson"
version = "2026-10"
refresh = "pinned"

[data.params]
code = 2
water = "sea"
label = "BlueTopo, 4–16 m"
datum = "mean sea level (from NAVD88 by NOAA VDatum)"
