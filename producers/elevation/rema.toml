notes = "Ranked after GLO-30 and the Terrarium tiles: it serves only where GLO-30 has a void (its fill mask's 3 and up) and the Terrarium tiles, which end at 85.05° S, have nothing. Index: producers/elevation/indexes.py rema --south-of -87 (the 100 km tiles wholly south of 87° S, so its coverage, 1° cells, meets no Web Mercator tile and no existing key changes: docs/polar.md §2). Kept in the store (sources/fetched/rema/, `scenic-build store-fetch rema --index rema-tiles.geojson`). Heights above the WGS 84 ellipsoid, brought to EGM2008 by the egm2008 grid."

