# The build's tools, installed by `mise install` (tools/app/*.sh put them on the PATH with `mise env`).
#
# Rust has no version here: rust-toolchain.toml declares it (version, components), which every
# cargo honours, and mise reads it as Rust's version file (the setting below), installing rustup and
# that toolchain with its components. Node builds the web app (web/; its packages: `pnpm install --frozen-lockfile` there).
#
# Python has no version here either: dem/.python-version declares it, which uv honours (the agent's
# Python steps run `uv run` in the app's copy of dem/, wherever they run) and mise reads (below).
# uv runs the Python steps and publish.sh's checks of them. cargo-nextest runs publish.sh's tests.
# CMake builds GEOS (crates/geos-src).
[tools]
node = "24.20.0"
pnpm = "11.21.0"
uv = "0.12.9"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.146"
cmake = "4.4.4"

[settings]
idiomatic_version_file_enable_tools = ["rust", "python"]
